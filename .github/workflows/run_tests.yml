name: Compile and test SymCC
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: symcc-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Building and running the tests with Dockerfile
  build_and_test_symcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup docker compilation environment
        run: docker build --target builder  -t symcc .
      - name: Build and test SymCC with simple backend
        run: docker build --target builder_simple  -t symcc .
      - name: Build libcxx using SymCC simple backend
        run: docker build --target builder_libcxx  -t symcc .
      - name: Build and test SymCC with Qsym backend
        run: docker build --target builder_qsym  -t symcc .
      - name: Creation of the final SymCC docker image with Qsym backend and libcxx
        run: docker build  -t symcc .

  # The research Python suite has system-level optional integrations. The gate
  # makes every expected capability explicit and rejects skips, xfails, test
  # deselection, collection shrinkage, and collection errors.
  python_quality:
    name: Capability-closed Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify sealed source delivery
        run: |
          python util/source_delivery_gate.py \
            --manifest source-delivery-manifest.json \
            --require-tracked \
            --require-clean

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install system test capabilities
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            afl++ \
            build-essential \
            clang \
            cvc5 \
            libgmp-dev \
            libmpfr-dev \
            libopenmpi-dev \
            libz3-dev \
            meson \
            ninja-build \
            openmpi-bin \
            openssl \
            pkg-config \
            llvm

      - name: Install Python test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r requirements-test.txt

      - name: Cache Bitwuzla 0.9.1
        id: cache-bitwuzla
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/bitwuzla-0.9.1
          key: >-
            bitwuzla-0.9.1-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('benchmark/install_bitwuzla_0_9_1.sh') }}

      - name: Build pinned Bitwuzla
        if: steps.cache-bitwuzla.outputs.cache-hit != 'true'
        run: benchmark/install_bitwuzla_0_9_1.sh

      - name: Export pinned Bitwuzla
        run: echo "$HOME/.local/opt/bitwuzla-0.9.1/bin" >> "$GITHUB_PATH"

      - name: Cache cvc5 CPC and Ethos proof toolchain
        id: cache-cpc-ethos
        uses: actions/cache@v4
        with:
          path: ~/.local/share/symcc-cpc-1.3.4
          key: >-
            cvc5-cpc-ethos-1.3.4-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('benchmark/install_cvc5_cpc_ethos_1_3_4.sh') }}

      - name: Build pinned cvc5 CPC and Ethos proof toolchain
        if: steps.cache-cpc-ethos.outputs.cache-hit != 'true'
        run: benchmark/install_cvc5_cpc_ethos_1_3_4.sh

      - name: Verify pinned proof toolchain
        run: |
          test -x "$HOME/.local/share/symcc-cpc-1.3.4/bin/cvc5"
          test -x "$HOME/.local/share/symcc-cpc-1.3.4/bin/ethos"
          test -f "$HOME/.local/share/symcc-cpc-1.3.4/share/cpc/Cpc.eo"
          test -f "$HOME/.local/share/symcc-cpc-1.3.4/share/cpc/expert/CpcExpert.eo"

      - name: Run capability-closed Python gate
        run: |
          python util/python_test_gate.py \
            --output python-test-gate.json \
            --min-collected 1597 \
            --max-skips 0 \
            --max-xfails 0 \
            --max-xpasses 0 \
            --max-deselected 0 \
            --max-missing-nodeids 0 \
            --max-unexpected-nodeids 0 \
            --require-nodeid-manifest test/pytest-nodeids.json \
            --require-command cc \
            --require-command z3 \
            --require-command cvc5 \
            --require-command bitwuzla \
            --require-command afl-clang-fast \
            --require-command afl-showmap \
            --require-command mpiexec \
            --require-command openssl \
            --require-command opt \
            --require-command llvm-diff \
            --require-module mpi4py \
            --require-module tree_sitter \
            --require-module tree_sitter_json \
            --require-module lark \
            --require-module parglare \
            --require-library z3 \
            -- -q -W error -p no:cacheprovider

      - name: Archive Python gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-gate
          path: python-test-gate.json
          if-no-files-found: error
          retention-days: 14

  # checking compatibility with ubuntu llvm packages
  llvm_compatibility:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        llvm_version: [15, 16, 17, 18, 19]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-${{ matrix.llvm_version }}-dev \
            libz3-dev \
            git

      - name: Build SymCC with the QSYM backend
        run: |
          git submodule update --init --recursive runtime
          mkdir build
          cd build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DZ3_TRUST_SYSTEM_VERSION=ON \
            -DSYMCC_RT_BACKEND=qsym \
            -DLLVM_DIR=/usr/lib/llvm-${{ matrix.llvm_version }}/cmake \
            ..
          make

