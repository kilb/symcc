  <text x="72" y="782" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="start">该看 concolic 列而不是 edge%：hybrid 里 AFL 每轮产出上千用例、主导原始边覆盖，SymSan 的价值是解出 AFL 猜不到的魔数、校验和与结构键。</text>
  <text x="72" y="806" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">xml 三轮为 139 / 128 / 0——有一轮 concolic worker 在 20 s 内超时未贡献。这正是必须跑多轮并给出全距的原因，单轮数字不可引用。</text>
  <text x="72" y="828" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">uniq 稳定为 8（三轮一致）：它需要一处真实的 SymSan runtime 修复（taint_getc 每次 getc 丢污点）加一处构建 flag 修复后才可解。</text>
