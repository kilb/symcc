<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="706"
     viewBox="0 0 1600 706" role="img" aria-labelledby="title desc">
  <title id="title">图 R-18　三个求解开关的实测效果</title>
  <desc id="desc">同一目标、同一种子，只改一个环境变量；产出数与 Z3 查询数为「默认 → 开启后」</desc>
  <rect width="1600" height="706" fill="white"/>
  <text x="48" y="54" font-family="WenQuanYi Zen Hei" font-size="28" font-weight="700" fill="#17212B" text-anchor="start">图 R-18　三个求解开关的实测效果</text>
  <text x="48" y="86" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">同一目标、同一种子，只改一个环境变量；产出数与 Z3 查询数为「默认 → 开启后」</text>
  <rect x="48" y="128" width="1504" height="184" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
  <rect x="48" y="128" width="1504" height="40" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <text x="74" y="155" font-family="WenQuanYi Zen Hei" font-size="17" font-weight="700" fill="#15803D" text-anchor="start">SYMCC_FAST_SOLVE</text>
  <text x="474" y="155" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="700" fill="#17212B" text-anchor="start">→　划算（形状匹配时）</text>
  <text x="880" y="155" font-family="WenQuanYi Zen Hei" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">产出数</text>
  <text x="1080" y="155" font-family="WenQuanYi Zen Hei" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">Z3 查询数</text>
  <text x="1250" y="155" font-family="WenQuanYi Zen Hei" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">求解耗时</text>
  <text x="74" y="194" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="650" fill="#17212B" text-anchor="start">xml</text>
  <text x="180" y="194" font-family="WenQuanYi Zen Hei" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">91/225 = 40 % 的分支不用 Z3</text>
  <text x="880" y="194" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="middle">225 → 225</text>
  <text x="1080" y="194" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="middle">336 → 245</text>
  <text x="1250" y="194" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">−22 %</text>
  <text x="74" y="236" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="650" fill="#17212B" text-anchor="start">pcre2</text>
  <text x="180" y="236" font-family="WenQuanYi Zen Hei" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">只有 14 个分支命中形状</text>
  <text x="880" y="236" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="middle">131 → 131</text>
  <text x="1080" y="236" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="middle">214 → 200</text>
  <text x="1250" y="236" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="700" fill="#64748B" text-anchor="middle">≈ 0</text>
  <text x="74" y="278" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="650" fill="#17212B" text-anchor="start">png</text>
  <text x="180" y="278" font-family="WenQuanYi Zen Hei" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">几乎不触发，形状不匹配</text>
  <text x="880" y="278" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="middle">132 → 132</text>
  <text x="1080" y="278" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="middle">233 → 230</text>
  <text x="1250" y="278" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">−9 %</text>
  <rect x="48" y="330" width="1504" height="100" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/>
  <rect x="48" y="330" width="1504" height="40" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
  <text x="74" y="357" font-family="WenQuanYi Zen Hei" font-size="17" font-weight="700" fill="#B91C1C" text-anchor="start">SYMCC_OPTIMISTIC_FIRST</text>
  <text x="474" y="357" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="700" fill="#17212B" text-anchor="start">→　在这几个目标上净亏</text>
  <text x="880" y="357" font-family="WenQuanYi Zen Hei" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">产出数</text>
  <text x="1080" y="357" font-family="WenQuanYi Zen Hei" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">Z3 查询数</text>
  <text x="1250" y="357" font-family="WenQuanYi Zen Hei" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">求解耗时</text>
  <text x="74" y="396" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="650" fill="#17212B" text-anchor="start">xml</text>
  <text x="180" y="396" font-family="WenQuanYi Zen Hei" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">产出一个没多，查询 +34 %</text>
  <text x="880" y="396" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="middle">225 → 225</text>
  <text x="1080" y="396" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="middle">336 → 450</text>
  <text x="1250" y="396" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="middle">+33 %</text>
  <rect x="48" y="448" width="1504" height="142" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <rect x="48" y="448" width="1504" height="40" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="74" y="475" font-family="WenQuanYi Zen Hei" font-size="17" font-weight="700" fill="#94A3B8" text-anchor="start">SYMCC_MULTI_SOLVE</text>
  <text x="474" y="475" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="700" fill="#17212B" text-anchor="start">→　几乎不产出</text>
  <text x="880" y="475" font-family="WenQuanYi Zen Hei" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">产出数</text>
  <text x="1080" y="475" font-family="WenQuanYi Zen Hei" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">Z3 查询数</text>
  <text x="1250" y="475" font-family="WenQuanYi Zen Hei" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">求解耗时</text>
  <text x="74" y="514" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="650" fill="#17212B" text-anchor="start">xml</text>
  <text x="180" y="514" font-family="WenQuanYi Zen Hei" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">group-opt 产出 0</text>
  <text x="880" y="514" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="middle">225 → 225</text>
  <text x="1080" y="514" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="middle">336 → 336</text>
  <text x="1250" y="514" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="middle">+7 %</text>
  <text x="74" y="556" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="650" fill="#17212B" text-anchor="start">pcre2</text>
  <text x="180" y="556" font-family="WenQuanYi Zen Hei" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">group-opt 产出 1</text>
  <text x="880" y="556" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="middle">131 → 132</text>
  <text x="1080" y="556" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="middle">214 → 216</text>
  <text x="1250" y="556" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="middle">+4 %</text>
  <rect x="48" y="608" width="1504" height="82" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="72" y="634" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="start">读法：三个开关都默认关闭，因为它们的收益强依赖目标形状。FAST_SOLVE 只在「宽整数内联比较」形态上命中；</text>
  <text x="72" y="656" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#17212B" text-anchor="start">OPTIMISTIC_FIRST 先跑一次乐观查询，而这几个目标的严格查询本来大多就 SAT，那次查询纯属浪费——只有严格查询大量 UNSAT 时才值得开；</text>
  <text x="72" y="678" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">MULTI_SOLVE 针对「源码逐字节比较」形态，而这些目标的比较早被 -O2 合并成宽比较了。【C 级】单种子短测，耗时列取 5 次中位数口径。</text>
</svg>
