  <text x="72" y="704" font-family="WenQuanYi Zen Hei" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start">相对 strict-first-z3，runtime-full：候选 +33.7%，unique +23.5%，完整路径 Z3 调用 −56.6%。</text>
  <text x="72" y="736" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="start">代价：solver queries +190.5%，solver time +82.6%，墙钟 ×53.3，候选吞吐 −97.5%，unique 吞吐 −97.7%。</text>
  <text x="72" y="768" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="start">关键边界：三个 profile 的 listed bug 并集完全相同（41/44）。候选空间扩大没有转化为 LAVA listed bug 增量。</text>
  <text x="72" y="800" font-family="WenQuanYi Zen Hei" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">范围：13 个 public seeds × 3 profiles = 39 cases，无 timeout。【C 级机制描述】13 个测量单元是不同 seed 而非重复运行，未给置信区间；不能用于宣称成本下降或达到 SOTA。</text>
