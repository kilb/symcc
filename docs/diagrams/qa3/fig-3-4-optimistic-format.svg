  <text x="48" y="86" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">柱高为每个保存产出的新边数；标签同时给出独有 edge ID 数</text>
  <rect x="100" y="135" width="650" height="570" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="425" y="180" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="700" fill="#17212B" text-anchor="middle">XML · 宽容文本格式</text><rect x="215" y="314.73333333333335" width="150" height="285.26666666666665" rx="5" fill="#0F766E" stroke="#0F766E" stroke-width="1.5"/><text x="290" y="296.73333333333335" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="700" fill="#17212B" text-anchor="middle">3.89 边/产出</text><text x="290" y="630" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="400" fill="#17212B" text-anchor="middle">nominal</text><text x="290" y="657" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">独有新边 84</text><rect x="480" y="297.8666666666666" width="150" height="302.1333333333334" rx="5" fill="#C2410C" stroke="#C2410C" stroke-width="1.5"/><text x="555" y="279.8666666666666" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="700" fill="#17212B" text-anchor="middle">4.12 边/产出</text><text x="555" y="630" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="400" fill="#17212B" text-anchor="middle">optimistic</text><text x="555" y="657" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">独有新边 97</text><rect x="850" y="135" width="650" height="570" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="1175" y="180" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="700" fill="#17212B" text-anchor="middle">PNG · 严格二进制 + CRC</text><rect x="965" y="512.0" width="150" height="88.0" rx="5" fill="#0F766E" stroke="#0F766E" stroke-width="1.5"/><text x="1040" y="494.0" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="700" fill="#17212B" text-anchor="middle">1.20 边/产出</text><text x="1040" y="630" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="400" fill="#17212B" text-anchor="middle">nominal</text><text x="1040" y="657" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">独有新边 31</text><rect x="1230" y="562.6" width="150" height="37.400000000000006" rx="5" fill="#C2410C" stroke="#C2410C" stroke-width="1.5"/><text x="1305" y="544.6" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="700" fill="#17212B" text-anchor="middle">0.51 边/产出</text><text x="1305" y="630" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="400" fill="#17212B" text-anchor="middle">optimistic</text><text x="1305" y="657" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">独有新边 11</text><rect x="175" y="755" width="1250" height="82" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="800" y="790" font-family="WenQuanYi Zen Hei" font-size="17" font-weight="700" fill="#17212B" text-anchor="middle">XML 中 optimistic 单产出价值略高；PNG 中仅为 nominal 的 42.5%。</text><text x="800" y="817" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">这是一次性重放的互补性观察，未计入求解、启动、排队和长期反馈成本。</text>
