<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850"
     viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">图 6-1  LAVA-M base64 的 endpoint 结果</title>
  <desc id="desc">条长为触发的 listed bug 数；右侧同时标注墙钟预算与近似 CPU·秒</desc>
  <rect width="1600" height="850" fill="white"/>
  <text x="48" y="54" font-family="WenQuanYi Zen Hei" font-size="28" font-weight="700" fill="#17212B" text-anchor="start">图 6-1  LAVA-M base64 的 endpoint 结果</text>
  <text x="48" y="86" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">条长为触发的 listed bug 数；右侧同时标注墙钟预算与近似 CPU·秒</text>
  <text x="65" y="203" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="600" fill="#17212B" text-anchor="start">AFL-only · 8 instances</text><rect x="400" y="175" width="930" height="38" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/><text x="1348" y="202" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="700" fill="#17212B" text-anchor="start">0/44</text><text x="1435" y="202" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">240 s · CPU·s ~1,920</text><text x="65" y="303" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="600" fill="#17212B" text-anchor="start">Hybrid · np=8</text><rect x="400" y="275" width="930" height="38" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/><rect x="400" y="275" width="612.9545454545455" height="38" rx="4" fill="#C2410C" stroke="#C2410C" stroke-width="1.5"/><text x="1348" y="302" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="700" fill="#17212B" text-anchor="start">29/44</text><text x="1435" y="302" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">~18 s · CPU·s ~144</text><text x="65" y="403" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="600" fill="#17212B" text-anchor="start">Concolic MPI · np=8</text><rect x="400" y="375" width="930" height="38" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/><rect x="400" y="375" width="887.7272727272727" height="38" rx="4" fill="#0F766E" stroke="#0F766E" stroke-width="1.5"/><text x="1348" y="402" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="700" fill="#17212B" text-anchor="start">42/44</text><text x="1435" y="402" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">104 s · CPU·s ~832</text><text x="65" y="503" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="600" fill="#17212B" text-anchor="start">Concolic MPI · np=32</text><rect x="400" y="475" width="930" height="38" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/><rect x="400" y="475" width="930.0" height="38" rx="4" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="1348" y="502" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="700" fill="#17212B" text-anchor="start">44/44</text><text x="1435" y="502" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">105 s · CPU·s ~3,360</text><text x="400" y="630" font-family="WenQuanYi Zen Hei" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">0</text><text x="865" y="630" font-family="WenQuanYi Zen Hei" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">22</text><text x="1330" y="630" font-family="WenQuanYi Zen Hei" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">44 listed bugs</text><rect x="150" y="690" width="1300" height="116" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="800" y="728" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="700" fill="#17212B" text-anchor="middle">四行来自不同历史运行，CPU·秒相差超过 20 倍；墙钟是 campaign 预算，不是首次发现时间。</text><text x="800" y="760" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="400" fill="#B91C1C" text-anchor="middle">因此只能说明 endpoint 机制能力，不能计算速度提升、显著性或系统排名。</text><text x="800" y="788" font-family="WenQuanYi Zen Hei" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">LAVA-M 规模小且 endpoint 接近上限；这些非等预算历史结果不能外推到大型真实程序。</text>
</svg>
