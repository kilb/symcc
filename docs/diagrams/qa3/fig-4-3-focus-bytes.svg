dth="2"/><text x="1280" y="562" font-family="WenQuanYi Zen Hei" font-size="17" font-weight="700" fill="#17212B" text-anchor="middle">focus 0-1</text><text x="1280" y="605" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="700" fill="#6D28D9" text-anchor="middle">2 个产出</text><rect x="185" y="700" width="1230" height="96" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="800" y="738" font-family="WenQuanYi Zen Hei" font-size="17" font-weight="700" fill="#17212B" text-anchor="middle">范围外字节返回 nullptr：依赖它们的分支不会生成查询，也不会产生候选。</text><text x="800" y="770" font-family="WenQuanYi Zen Hei" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">偏移仍在门控前记录，因此 focus 不等同于截短输入。</text>
