<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760">
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .card { fill: #ffffff; stroke: #d7deea; stroke-width: 1; rx: 8; }
      .title { font: 700 25px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 14px Arial, sans-serif; fill: #536075; }
      .head { font: 700 17px Arial, sans-serif; fill: #172033; }
      .label { font: 13px Arial, sans-serif; fill: #2b3445; }
      .small { font: 12px Arial, sans-serif; fill: #536075; }
      .metric { font: 700 15px Arial, sans-serif; fill: #172033; }
      .line { stroke: #d7deea; stroke-width: 1; }
    </style>
  </defs>
  <rect class="bg" width="1240" height="760"/>
  <text x="42" y="48" class="title">Monthly Progress: Parallel Symbolic Execution and Hybrid Fuzzing</text>
  <text x="42" y="74" class="subtitle">2026-07-19 to 2026-08-19. Mechanism evidence, benchmark results, and next integration targets.</text>

  <rect x="42" y="105" width="270" height="135" class="card"/>
  <text x="66" y="137" class="head">Scale</text>
  <text x="66" y="166" class="metric">F297-F441</text>
  <text x="66" y="190" class="label">feature stream advanced</text>
  <text x="66" y="216" class="small">140 F-number research/audit docs in research-progress</text>

  <rect x="335" y="105" width="270" height="135" class="card"/>
  <text x="359" y="137" class="head">Latest Gate</text>
  <text x="359" y="166" class="metric">1337 + 310</text>
  <text x="359" y="190" class="label">Python tests and subtests</text>
  <text x="359" y="216" class="small">LLVM17: 329 passed; LLVM18: 330 passed</text>

  <rect x="628" y="105" width="270" height="135" class="card"/>
  <text x="652" y="137" class="head">Parallel Scaling</text>
  <text x="652" y="166" class="metric">+27.1%</text>
  <text x="652" y="190" class="label">synthetic np16 vs np2 edge coverage</text>
  <text x="652" y="216" class="small">candidates: 2688 vs 974</text>

  <rect x="921" y="105" width="277" height="135" class="card"/>
  <text x="945" y="137" class="head">Hybrid Positive</text>
  <text x="945" y="166" class="metric">+50.3%</text>
  <text x="945" y="190" class="label">LAVA base64 hybrid vs AFL-only</text>
  <text x="945" y="216" class="small">230 edges vs 153 edges</text>

  <rect x="42" y="275" width="1156" height="210" class="card"/>
  <text x="66" y="309" class="head">Main technical tracks</text>
  <line x1="66" y1="328" x2="1174" y2="328" class="line"/>
  <circle cx="80" cy="360" r="6" fill="#2f6fed"/>
  <text x="98" y="365" class="label">MPI control plane and recovery</text>
  <text x="370" y="365" class="small">leases, target fencing, generation tokens, bounded shutdown, ULFM 4 to 3 recovery</text>
  <circle cx="80" cy="395" r="6" fill="#23a26d"/>
  <text x="98" y="400" class="label">Hybrid AFL/SymCC feedback</text>
  <text x="370" y="400" class="small">native AFL peer, fail-closed coverage oracle, TopSeed, diversity/density balancing</text>
  <circle cx="80" cy="430" r="6" fill="#ef8b36"/>
  <text x="98" y="435" class="label">QF_BV proof and solver reuse</text>
  <text x="370" y="435" class="small">cross-worker contexts, proof receipts, lemma exchange, realtime proof stream, PalRUP wire</text>
  <circle cx="80" cy="465" r="6" fill="#7c8da6"/>
  <text x="98" y="470" class="label">Backsolver, continuation, MemoryPhi</text>
  <text x="370" y="470" class="small">Agolic BSE, selective concolic MDP, heap union, nested-loop summaries, executable transfer</text>

  <rect x="42" y="520" width="565" height="172" class="card"/>
  <text x="66" y="552" class="head">Benchmark results</text>
  <line x1="66" y1="571" x2="582" y2="571" class="line"/>
  <text x="66" y="601" class="label">gfts-xml np16</text>
  <text x="250" y="601" class="metric">3441 edges</text>
  <text x="360" y="601" class="small">seed: 2310 edges</text>
  <text x="66" y="632" class="label">pcre2 tuned vs legacy</text>
  <text x="250" y="632" class="metric">50.20% vs 47.01%</text>
  <text x="66" y="663" class="label">libarchive tuned</text>
  <text x="250" y="663" class="metric">20.94%</text>
  <text x="360" y="663" class="small">AFL-only: 20.87%</text>

  <rect x="633" y="520" width="565" height="172" class="card"/>
  <text x="657" y="552" class="head">Evidence boundary</text>
  <line x1="657" y1="571" x2="1174" y2="571" class="line"/>
  <text x="657" y="601" class="label">Mechanism evidence</text>
  <text x="850" y="601" class="small">not generalized as speedup or bug yield</text>
  <text x="657" y="632" class="label">Benchmark positives</text>
  <text x="850" y="632" class="small">reported only for measured local targets</text>
  <text x="657" y="663" class="label">Next targets</text>
  <text x="850" y="663" class="small">tcpdump, binutils, bento, Magma, FuzzBench</text>

  <text x="42" y="730" class="subtitle">All metrics are local evidence from the workspace and benchmark/evidence directories; literature-backed candidates are tracked separately.</text>
</svg>
