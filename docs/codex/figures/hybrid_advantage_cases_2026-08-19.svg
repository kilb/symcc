<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid fuzzing advantage testcase comparison</title>
  <desc id="desc">Chart showing AFL-only versus hybrid coverage for selected testcase configurations.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #fff; stroke: #d8dee8; stroke-width: 1; rx: 12; }
      .title { font: 700 26px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 14px Arial, sans-serif; fill: #5f6b7a; }
      .label { font: 13px Arial, sans-serif; fill: #273244; }
      .small { font: 12px Arial, sans-serif; fill: #637083; }
      .value { font: 700 12px Arial, sans-serif; fill: #172033; }
      .axis { stroke: #aeb7c5; stroke-width: 1; }
      .grid { stroke: #e8ecf2; stroke-width: 1; }
      .afl { fill: #8ca0b7; }
      .hybrid { fill: #246bce; }
      .gain { fill: #2a9d8f; }
      .neg { fill: #d97706; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="620"/>
  <text class="title" x="48" y="48">混合模糊测试优势 testcase 筛选</text>
  <text class="subtitle" x="48" y="74">AFL-only 等核对照 vs AFL+SymCC hybrid；edge coverage by afl-showmap；2026-08-19</text>

  <rect class="panel" x="42" y="110" width="1016" height="400" rx="12"/>
  <text class="label" x="72" y="142" font-weight="700">覆盖率对比</text>
  <text class="small" x="72" y="164">强正例使用 symbolic-heavy 配置：np=8，1 AFL + 6 SymCC，AFL profiles off，60s，3 rounds。</text>

  <line class="axis" x1="230" y1="450" x2="1000" y2="450"/>
  <line class="axis" x1="230" y1="200" x2="230" y2="450"/>
  <line class="grid" x1="230" y1="400" x2="1000" y2="400"/>
  <line class="grid" x1="230" y1="350" x2="1000" y2="350"/>
  <line class="grid" x1="230" y1="300" x2="1000" y2="300"/>
  <line class="grid" x1="230" y1="250" x2="1000" y2="250"/>
  <line class="grid" x1="230" y1="200" x2="1000" y2="200"/>
  <text class="small" x="204" y="455">0%</text>
  <text class="small" x="197" y="405">10%</text>
  <text class="small" x="197" y="355">20%</text>
  <text class="small" x="197" y="305">30%</text>
  <text class="small" x="197" y="255">40%</text>
  <text class="small" x="197" y="205">50%</text>

  <text class="label" x="72" y="228">lava-base64</text>
  <rect class="afl" x="250" y="379.7" width="56" height="70.3" rx="5"/>
  <rect class="hybrid" x="315" y="344.3" width="56" height="105.7" rx="5"/>
  <text class="value" x="247" y="370">14.06%</text>
  <text class="value" x="309" y="335">21.14%</text>
  <text class="gain" x="386" y="403" font-family="Arial" font-size="13" font-weight="700">+77 edges / +50.3%</text>

  <text class="label" x="72" y="308">base64_harness</text>
  <rect class="afl" x="250" y="210.4" width="56" height="239.6" rx="5"/>
  <rect class="hybrid" x="315" y="194.8" width="56" height="255.2" rx="5"/>
  <text class="value" x="247" y="201">47.92%</text>
  <text class="value" x="309" y="186">51.04%</text>
  <text class="gain" x="386" y="283" font-family="Arial" font-size="13" font-weight="700">+6 edges / +6.5%（单轮候选）</text>

  <text class="label" x="72" y="388">gfts-xml</text>
  <rect class="afl" x="250" y="395.9" width="56" height="54.1" rx="5"/>
  <rect class="hybrid" x="315" y="399.7" width="56" height="50.3" rx="5"/>
  <text class="value" x="247" y="386">10.83%</text>
  <text class="value" x="309" y="390">10.06%</text>
  <text class="neg" x="386" y="390" font-family="Arial" font-size="13" font-weight="700">真实目标负例：AFL-only 更高</text>

  <rect class="afl" x="735" y="525" width="18" height="18" rx="3"/>
  <text class="small" x="760" y="539">AFL-only</text>
  <rect class="hybrid" x="845" y="525" width="18" height="18" rx="3"/>
  <text class="small" x="870" y="539">Hybrid AFL+SymCC</text>

  <text class="small" x="48" y="580">强正例数据目录：benchmark/evidence/hybrid-advantage-lava-base64-symbolic-heavy-r3-2026-08-19</text>
</svg>
