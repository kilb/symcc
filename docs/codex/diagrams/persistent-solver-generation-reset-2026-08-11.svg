<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">F368 failure-atomic persistent solver generation reset</title>
  <desc id="desc">A dual-channel descriptor and text request is either completed on one helper generation or the process, pipes, and socketpair are retired together before recovery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 19px Arial, sans-serif; fill: #475569; }
      .band { font: 700 18px Arial, sans-serif; fill: #334155; }
      .node { font: 700 21px Arial, sans-serif; fill: #111827; }
      .body { font: 400 16px Arial, sans-serif; fill: #334155; }
      .small { font: 400 14px Arial, sans-serif; fill: #475569; }
      .mono { font: 600 14px Consolas, monospace; fill: #1f2937; }
      .pill { font: 700 13px Arial, sans-serif; letter-spacing: 0; }
      .footer { font: 400 16px Arial, sans-serif; fill: #f8fafc; }
      .footer-small { font: 400 14px Arial, sans-serif; fill: #cbd5e1; }
      .line { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .red-line { fill: none; stroke: #b91c1c; stroke-width: 3; marker-end: url(#red-arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#f8fafc"/>
  <rect x="0" y="0" width="1600" height="116" fill="#ffffff"/>
  <rect x="0" y="113" width="1600" height="3" fill="#0f766e"/>
  <text x="70" y="58" class="title">F368 | Persistent Solver Generation Reset</text>
  <text x="70" y="91" class="subtitle">Failure-atomic recovery for SCM_RIGHTS + pipe + JSON transactions</text>
  <rect x="1320" y="38" width="210" height="42" rx="5" fill="#dcfce7" stroke="#15803d"/>
  <text x="1425" y="64" text-anchor="middle" class="pill" fill="#166534">CROSS-REQUEST CLOSED</text>

  <text x="70" y="152" class="band">THE REPRODUCED DUAL-CHANNEL GAP</text>
  <rect x="70" y="170" width="1460" height="132" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <rect x="94" y="194" width="350" height="82" rx="5" fill="#ffffff" stroke="#fdba74"/>
  <text x="118" y="226" class="node">1 | A sends sealed fds</text>
  <text x="118" y="254" class="mono">socket queue: [ A.prefix, A.target ]</text>
  <path d="M 444 235 L 590 235" class="line"/>
  <rect x="590" y="194" width="390" height="82" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="614" y="226" class="node">2 | Text commit fails</text>
  <text x="614" y="254" class="mono">stdin.write(A) -&gt; OSError</text>
  <path d="M 980 235 L 1120 235" class="red-line"/>
  <rect x="1120" y="194" width="382" height="82" rx="5" fill="#ffffff" stroke="#fca5a5"/>
  <text x="1144" y="226" class="node">3 | B consumes A fds</text>
  <text x="1144" y="254" class="mono">text ID = B | fd payload ID = A</text>

  <text x="70" y="348" class="band">ONE HELPER GENERATION IS THE TRANSACTION UNIT</text>
  <rect x="70" y="368" width="252" height="242" rx="7" fill="#ecfeff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
  <text x="94" y="402" class="node">Pre-transport gate</text>
  <text x="94" y="438" class="body">query ID</text>
  <text x="94" y="466" class="body">timeout + prefix key</text>
  <text x="94" y="494" class="body">witness field</text>
  <text x="94" y="522" class="body">non-empty; no TAB / CR / LF</text>
  <rect x="94" y="554" width="204" height="32" rx="4" fill="#cffafe"/>
  <text x="196" y="575" text-anchor="middle" class="pill" fill="#155e75">ZERO TRANSPORT EFFECTS</text>

  <path d="M 322 488 L 380 488" class="line"/>
  <rect x="380" y="348" width="730" height="282" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="380" y="348" width="730" height="48" rx="7" fill="#dbeafe"/>
  <text x="404" y="380" class="node">Generation G = process group + stdin/stdout + socketpair</text>

  <rect x="406" y="422" width="194" height="126" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="430" y="452" class="node">Descriptor lane</text>
  <text x="430" y="482" class="mono">dup(prefix,target)</text>
  <text x="430" y="510" class="mono">sendmsg(SCM_RIGHTS)</text>
  <text x="430" y="538" class="small">payload = query ID</text>

  <path d="M 600 485 L 642 485" class="line"/>
  <rect x="642" y="422" width="194" height="126" rx="5" fill="#f0fdf4" stroke="#86efac"/>
  <text x="666" y="452" class="node">Text lane</text>
  <text x="666" y="482" class="mono">write(request)</text>
  <text x="666" y="510" class="mono">flush(stdin)</text>
  <text x="666" y="538" class="small">same query ID</text>

  <path d="M 836 485 L 878 485" class="line"/>
  <rect x="878" y="422" width="206" height="126" rx="5" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="902" y="452" class="node">Response lane</text>
  <text x="902" y="482" class="mono">bounded os.read</text>
  <text x="902" y="510" class="mono">JSON request_id == ID</text>
  <text x="902" y="538" class="small">one UTF-8 line</text>

  <rect x="406" y="570" width="678" height="36" rx="4" fill="#dcfce7"/>
  <text x="745" y="594" text-anchor="middle" class="pill" fill="#166534">SUCCESS: KEEP G AND ITS Z3 PREFIX CACHE</text>

  <path d="M 1110 488 L 1180 488" class="red-line"/>
  <rect x="1180" y="368" width="350" height="242" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="1204" y="402" class="node">Any uncertain outcome</text>
  <text x="1204" y="438" class="body">send / write / flush error</text>
  <text x="1204" y="466" class="body">deadline / EOF / partial line</text>
  <text x="1204" y="494" class="body">oversize / UTF-8 / JSON error</text>
  <text x="1204" y="522" class="body">response ID mismatch / cancel</text>
  <rect x="1204" y="554" width="302" height="32" rx="4" fill="#fee2e2"/>
  <text x="1355" y="575" text-anchor="middle" class="pill" fill="#991b1b">G.valid := FALSE (MONOTONIC)</text>

  <text x="70" y="674" class="band">FAIL-STOP RECOVERY AND BOUNDED CONTROL PLANE</text>
  <rect x="70" y="694" width="920" height="244" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="94" y="726" width="174" height="156" rx="5" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="118" y="758" class="node">1 | Detach</text>
  <text x="118" y="790" class="body">state lock</text>
  <text x="118" y="818" class="body">socket := none</text>
  <text x="118" y="846" class="body">valid := false</text>
  <path d="M 268 804 L 312 804" class="line"/>
  <rect x="312" y="726" width="174" height="156" rx="5" fill="#fff7ed" stroke="#fdba74"/>
  <text x="336" y="758" class="node">2 | Unblock</text>
  <text x="336" y="790" class="body">close socket</text>
  <text x="336" y="818" class="body">SIGTERM group</text>
  <text x="336" y="846" class="body">SIGKILL fallback</text>
  <path d="M 486 804 L 530 804" class="line"/>
  <rect x="530" y="726" width="174" height="156" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="554" y="758" class="node">3 | Close</text>
  <text x="554" y="790" class="body">stdin</text>
  <text x="554" y="818" class="body">stdout</text>
  <text x="554" y="846" class="body">stderr</text>
  <path d="M 704 804 L 748 804" class="line"/>
  <rect x="748" y="726" width="218" height="156" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="772" y="758" class="node">4 | Spawn G+1</text>
  <text x="772" y="790" class="body">new process group</text>
  <text x="772" y="818" class="body">new pipes + socketpair</text>
  <text x="772" y="846" class="body">cold prefix cache</text>

  <rect x="1030" y="694" width="500" height="244" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054" y="730" class="node">Bounded response reader</text>
  <text x="1054" y="768" class="mono">DefaultSelector (epoll on Linux)</text>
  <text x="1054" y="800" class="mono">deadline = query timeout + 5 s</text>
  <text x="1054" y="832" class="mono">chunk &lt;= 64 KiB | total &lt;= 16 MiB</text>
  <text x="1054" y="864" class="mono">exactly one newline-terminated frame</text>
  <text x="1054" y="896" class="mono">strict UTF-8 -&gt; JSON object -&gt; ID gate</text>
  <text x="1054" y="922" class="small">No FD_SETSIZE-bound wait and no unbounded readline.</text>

  <rect x="70" y="978" width="1460" height="76" rx="7" fill="#111827"/>
  <text x="96" y="1009" class="pill" fill="#5eead4">PROVEN INVARIANT</text>
  <text x="250" y="1010" class="footer">a request completes entirely on G, or no later request can observe any state from G</text>
  <text x="96" y="1039" class="footer-small">legacy: A-fd/B-text mismatch | production: G terminated, G+1 binds B ID + B hashes | 787 + 127 full gate</text>
</svg>
