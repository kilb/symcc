<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">F370 deadline-bounded dual-channel request commit</title>
  <desc id="desc">Comparison of unbounded legacy descriptor and pipe writes with the F370 prevalidated request frame, shared monotonic deadline, nonblocking dual-channel commit, response admission, and generation fencing.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17212b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2166ac"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c43b3b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#23845b"/>
    </marker>
    <style>
      .bg { fill: #f5f7f8; }
      .panel { fill: #ffffff; stroke: #cad2d8; stroke-width: 2; filter: url(#shadow); }
      .legacy { fill: #fff5f4; stroke: #e0a09b; stroke-width: 2; }
      .preflight { fill: #fff9e8; stroke: #d6ae45; stroke-width: 2; }
      .transport { fill: #eef6fd; stroke: #75a6cf; stroke-width: 2; }
      .success { fill: #edf8f2; stroke: #68a98a; stroke-width: 2; }
      .fence { fill: #f8f0f0; stroke: #c76767; stroke-width: 2; }
      .neutral { fill: #f1f3f5; stroke: #98a4ae; stroke-width: 2; }
      .title { font: 700 38px Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #52606b; }
      .section { font: 700 24px Arial, sans-serif; fill: #26333e; }
      .label { font: 700 18px Arial, sans-serif; fill: #23313d; }
      .body { font: 400 16px Arial, sans-serif; fill: #344450; }
      .small { font: 400 14px Arial, sans-serif; fill: #52606b; }
      .mono { font: 600 15px 'DejaVu Sans Mono', monospace; fill: #23313d; }
      .red { fill: #ae3030; }
      .green { fill: #1e714f; }
      .blue { fill: #1e5e94; }
      .line-blue { fill: none; stroke: #2166ac; stroke-width: 4; marker-end: url(#arrow-blue); }
      .line-red { fill: none; stroke: #c43b3b; stroke-width: 4; marker-end: url(#arrow-red); }
      .line-green { fill: none; stroke: #23845b; stroke-width: 4; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 10 8; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1100"/>
  <text class="title" x="70" y="68">F370 · Deadline-Bounded Dual-Channel Request Commit</text>
  <text class="subtitle" x="70" y="102">One commit image · one absolute deadline · one disposable helper generation</text>

  <rect class="panel" x="60" y="135" width="1480" height="210" rx="8"/>
  <text class="section red" x="90" y="177">Legacy counterexample: solver timeout starts too late</text>

  <rect class="legacy" x="95" y="205" width="270" height="95" rx="6"/>
  <text class="label" x="120" y="239">Worker request</text>
  <text class="body" x="120" y="266">up to 128 MiB input</text>
  <text class="small" x="120" y="289">≈ 256 MiB input_hex</text>

  <rect class="legacy" x="455" y="205" width="255" height="95" rx="6"/>
  <text class="label" x="480" y="239">Blocking sendmsg</text>
  <text class="mono red" x="480" y="269">SCM_RIGHTS</text>
  <text class="small" x="480" y="291">no transport deadline</text>

  <rect class="legacy" x="800" y="205" width="255" height="95" rx="6"/>
  <text class="label" x="825" y="239">Blocking write</text>
  <text class="mono red" x="825" y="269">stdin.flush()</text>
  <text class="small" x="825" y="291">pipe backpressure</text>

  <rect class="neutral" x="1145" y="205" width="300" height="95" rx="6"/>
  <text class="label" x="1170" y="239">Response deadline</text>
  <text class="body" x="1170" y="267">created only after write</text>
  <text class="small red" x="1170" y="291">may never be reached</text>

  <path class="line-red" d="M365 252 H445"/>
  <path class="line-red" d="M710 252 H790"/>
  <path class="line-red" d="M1055 252 H1135"/>
  <text class="small red" x="517" y="326">real full socket buffer</text>
  <text class="small red" x="850" y="326">real unread pipe</text>

  <rect class="panel" x="60" y="380" width="1480" height="520" rx="8"/>
  <text class="section blue" x="90" y="425">F370 production flow</text>

  <rect class="preflight" x="95" y="465" width="330" height="175" rx="6"/>
  <text class="label" x="120" y="499">1 · Pure preflight</text>
  <text class="body" x="120" y="531">• exact integer timeout range</text>
  <text class="body" x="120" y="558">• six-field grammar (F369)</text>
  <text class="body" x="120" y="585">• strict UTF-8 encoding</text>
  <text class="body" x="120" y="612">• bounded complete frame</text>

  <rect class="transport" x="505" y="465" width="300" height="175" rx="6"/>
  <text class="label" x="530" y="499">2 · Freeze deadline</text>
  <text class="mono blue" x="530" y="537">D = monotonic()</text>
  <text class="mono blue" x="530" y="563">  + timeout + 5 s</text>
  <line x1="535" y1="592" x2="775" y2="592" stroke="#2166ac" stroke-width="5"/>
  <circle cx="535" cy="592" r="8" fill="#2166ac"/>
  <circle cx="775" cy="592" r="8" fill="#2166ac"/>
  <text class="small" x="530" y="620">absolute; retries do not refresh</text>

  <rect class="transport" x="885" y="455" width="290" height="105" rx="6"/>
  <text class="label" x="910" y="489">3A · FD datagram</text>
  <text class="mono" x="910" y="518">MSG_DONTWAIT</text>
  <text class="small" x="910" y="543">selector(EVENT_WRITE, D-now)</text>

  <rect class="transport" x="885" y="595" width="290" height="105" rx="6"/>
  <text class="label" x="910" y="629">3B · Text frame</text>
  <text class="mono" x="910" y="658">os.write + offset</text>
  <text class="small" x="910" y="683">same deadline D</text>

  <rect class="success" x="1255" y="515" width="230" height="125" rx="6"/>
  <text class="label" x="1280" y="551">4 · One response</text>
  <text class="body" x="1280" y="580">≤ 16 MiB · UTF-8</text>
  <text class="body" x="1280" y="607">JSON object · exact ID</text>

  <path class="line-blue" d="M425 550 H495"/>
  <path class="line-blue" d="M805 550 H865 V508 H875"/>
  <path class="line-blue" d="M1030 560 V585"/>
  <path class="line-green" d="M1175 648 H1210 V578 H1245"/>

  <rect class="fence" x="505" y="750" width="670" height="105" rx="6"/>
  <text class="label red" x="535" y="786">Any uncertain state → retire the whole generation</text>
  <text class="body" x="535" y="817">close descriptor channel + TERM/KILL process group + close stdio</text>
  <text class="small" x="535" y="840">next request cold-starts; no stale FD, partial line, or response survives</text>

  <path class="line-red dash" d="M1030 455 V430 H1215 V802 H1185"/>
  <path class="line-red dash" d="M1030 700 V730 H1185 V802"/>
  <path class="line-red dash" d="M1370 640 V802 H1185"/>
  <text class="small red" x="1195" y="735">timeout / I/O / framing / ID failure</text>

  <rect class="panel" x="60" y="935" width="1480" height="115" rx="8"/>
  <text class="section green" x="90" y="977">Measured mechanism evidence</text>
  <text class="body" x="90" y="1010">Legacy: pipe write blocked PASS  ·  SCM_RIGHTS send blocked PASS</text>
  <text class="body" x="650" y="1010">Production: both deadlines enforced PASS  ·  both partial generations retired PASS</text>
  <text class="body" x="90" y="1037">Regression: 787 passed + 137 subtests  ·  16 capabilities  ·  787 canonical identities unchanged</text>

  <text class="small" x="1240" y="1080">Scope: local Linux I/T/E mechanism evidence</text>
</svg>
