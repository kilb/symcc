<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">F314 reboot-safe local lease fencing</title>
  <desc id="desc">Single-owner work and state admission, owner-checked result completion, and reboot-safe Unix-clock migration.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #526174; }
      .lane { font: 700 17px Arial, sans-serif; fill: #172033; }
      .head { font: 700 18px Arial, sans-serif; fill: #172033; }
      .body { font: 400 15px Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px Arial, sans-serif; fill: #526174; }
      .mono { font: 600 14px Consolas, monospace; fill: #172033; }
      .inverseHead { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .inverseMono { font: 600 14px Consolas, monospace; fill: #ffffff; }
      .inverseSmall { font: 400 13px Arial, sans-serif; fill: #d7e0eb; }
      .edge { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 4; }
      .teal { fill: #e8f6f3; stroke: #178071; stroke-width: 2; rx: 4; }
      .blue { fill: #eaf2fb; stroke: #2463a0; stroke-width: 2; rx: 4; }
      .amber { fill: #fff4d8; stroke: #b7791f; stroke-width: 2; rx: 4; }
      .red { fill: #fdecec; stroke: #b64242; stroke-width: 2; rx: 4; }
      .dark { fill: #243044; stroke: #172033; stroke-width: 2; rx: 4; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="70" y="62" class="title">F314 · Reboot-Safe Local Lease Fencing</text>
  <text x="70" y="94" class="subtitle">Single-owner admission, master-authoritative identity, and explicit persistent clock domains</text>

  <rect x="55" y="130" width="1490" height="430" class="panel"/>
  <text x="78" y="164" class="lane">LIVE DISPATCH EPOCH</text>

  <rect x="85" y="205" width="245" height="122" class="blue"/>
  <text x="108" y="239" class="head">Candidate task</text>
  <text x="108" y="270" class="mono">work_id / state_task_id</text>
  <text x="108" y="298" class="body">worker rank + immutable payload</text>

  <rect x="405" y="190" width="330" height="152" class="teal"/>
  <text x="430" y="225" class="head">Atomic local admission</text>
  <text x="430" y="257" class="mono">active[id] = (worker, unix_time)</text>
  <text x="430" y="286" class="body">Reject if id is active or completed</text>
  <text x="430" y="313" class="body">No counter or journal side effect on reject</text>

  <path d="M330 266 H405" class="edge"/>

  <rect x="790" y="175" width="300" height="104" class="red"/>
  <text x="815" y="210" class="head">Duplicate / wrong owner</text>
  <text x="815" y="241" class="body">Reject and invoke F313 rollback stack</text>
  <path d="M735 225 H790" class="edge"/>

  <rect x="790" y="316" width="300" height="112" class="blue"/>
  <text x="815" y="351" class="head">MPI send + execution</text>
  <text x="815" y="382" class="body">One active transaction per rank</text>
  <text x="815" y="407" class="small">No rank pipelining in the current protocol</text>
  <path d="M735 306 L790 354" class="edge"/>

  <rect x="1150" y="302" width="330" height="142" class="teal"/>
  <text x="1175" y="337" class="head">Owner-checked completion</text>
  <text x="1175" y="369" class="mono">master task ID + MPI source rank</text>
  <text x="1175" y="398" class="body">Worker-reported mismatch is ignored</text>
  <text x="1175" y="425" class="body">Only current owner may complete or reclaim</text>
  <path d="M1090 372 H1150" class="edge"/>

  <rect x="1150" y="185" width="330" height="82" class="amber"/>
  <text x="1175" y="220" class="head">Late or mismatched result</text>
  <text x="1175" y="247" class="body">No state mutation; preserve current lease</text>
  <path d="M1315 302 V267" class="dash"/>

  <rect x="55" y="595" width="1490" height="245" class="panel"/>
  <text x="78" y="630" class="lane">COORDINATOR RESTART / CLOCK MIGRATION</text>

  <rect x="85" y="670" width="285" height="112" class="dark"/>
  <text x="110" y="706" class="inverseHead">Persistent artifacts</text>
  <text x="110" y="737" class="inverseMono">work JSONL · state snapshot</text>
  <text x="110" y="764" class="inverseSmall">clock=unix or legacy/no marker</text>

  <rect x="445" y="660" width="315" height="132" class="amber"/>
  <text x="470" y="696" class="head">Epoch transition</text>
  <text x="470" y="727" class="body">Old MPI rank ownership is invalid</text>
  <text x="470" y="754" class="body">Legacy clock ⇒ stale</text>
  <text x="470" y="779" class="body">Zero TTL ⇒ unconditional reclaim</text>
  <path d="M370 726 H445" class="edge"/>

  <rect x="835" y="660" width="300" height="132" class="teal"/>
  <text x="860" y="696" class="head">Recover work</text>
  <text x="860" y="727" class="body">Append reclaim event</text>
  <text x="860" y="754" class="body">Requeue immutable payload</text>
  <text x="860" y="779" class="body">Keep cumulative task statistics</text>
  <path d="M760 726 H835" class="edge"/>

  <rect x="1210" y="660" width="270" height="132" class="blue"/>
  <text x="1235" y="696" class="head">Fresh lease epoch</text>
  <text x="1235" y="727" class="mono">clock = unix</text>
  <text x="1235" y="754" class="body">New owner, no stale alias</text>
  <text x="1235" y="779" class="body">Normal dispatch resumes</text>
  <path d="M1135 726 H1210" class="edge"/>

  <text x="70" y="872" class="small">Correctness claim: state ownership and recovery invariants. Performance impact requires duplicate-dispatch and reboot campaigns.</text>
</svg>
