<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">F323 directory durability barriers</title>
  <desc id="desc">A schematic of file fsync, atomic rename, ordered destination and source directory fsync, failure states, and replay convergence.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563a6"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#25805a"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b56a15"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#153047" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 34px 'WenQuanYi Zen Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #ffffff; }
      .subtitle { font: 400 18px 'WenQuanYi Zen Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #cde0ee; }
      .section { font: 700 22px 'WenQuanYi Zen Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #18324a; }
      .step { font: 700 18px 'WenQuanYi Zen Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #18324a; }
      .body { font: 400 16px 'WenQuanYi Zen Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #334d61; }
      .small { font: 400 14px 'WenQuanYi Zen Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #496277; }
      .mono { font: 600 15px 'DejaVu Sans Mono', monospace; fill: #18324a; }
      .compact { font-size: 13px; }
      .white { fill: #ffffff; }
      .badge { font: 700 14px 'WenQuanYi Zen Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#f4f7fa"/>
  <rect width="1800" height="108" fill="#18324a"/>
  <rect x="0" y="108" width="1800" height="6" fill="#31a276"/>
  <text x="70" y="52" class="title">F323 机器掉电边界：目录项持久化屏障</text>
  <text x="70" y="84" class="subtitle">从“文件内容已落盘”推进到“rename / link / unlink 的目录可达性已得到存储确认”</text>
  <rect x="1510" y="31" width="220" height="48" rx="6" fill="#ffffff" opacity="0.13"/>
  <text x="1620" y="61" text-anchor="middle" class="badge">FAIL-CLOSED + REDO</text>

  <text x="70" y="157" class="section">A. 同目录原子提交：ACK 必须位于两个不同持久化事实之后</text>
  <rect x="55" y="180" width="1690" height="225" rx="8" fill="#eaf2f8" stroke="#b6cad9"/>

  <g filter="url(#shadow)">
    <rect x="85" y="225" width="230" height="125" rx="7" fill="#ffffff" stroke="#79a3c2" stroke-width="2"/>
    <circle cx="117" cy="255" r="18" fill="#2563a6"/>
    <text x="117" y="261" text-anchor="middle" class="badge">1</text>
    <text x="145" y="260" class="step">写临时文件</text>
    <text x="112" y="296" class="mono">record.tmp</text>
    <text x="112" y="323" class="small">完整 JSON / corpus bytes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="370" y="225" width="230" height="125" rx="7" fill="#ffffff" stroke="#79a3c2" stroke-width="2"/>
    <circle cx="402" cy="255" r="18" fill="#2563a6"/>
    <text x="402" y="261" text-anchor="middle" class="badge">2</text>
    <text x="430" y="260" class="step">同步内容</text>
    <text x="397" y="297" class="mono">fsync(file)</text>
    <text x="397" y="323" class="small">保证 inode 与数据可恢复</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="655" y="225" width="230" height="125" rx="7" fill="#ffffff" stroke="#d49447" stroke-width="2"/>
    <circle cx="687" cy="255" r="18" fill="#b56a15"/>
    <text x="687" y="261" text-anchor="middle" class="badge">3</text>
    <text x="715" y="260" class="step">原子换名</text>
    <text x="682" y="297" class="mono compact">rename(tmp, final)</text>
    <text x="682" y="323" class="small">进程可见性已切换</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="940" y="225" width="250" height="125" rx="7" fill="#ffffff" stroke="#38a075" stroke-width="2"/>
    <circle cx="972" cy="255" r="18" fill="#25805a"/>
    <text x="972" y="261" text-anchor="middle" class="badge">4</text>
    <text x="1000" y="260" class="step">同步目录项</text>
    <text x="967" y="297" class="mono compact">fsync(parent_dir)</text>
    <text x="967" y="323" class="small">final 名称跨掉电可达</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1245" y="225" width="205" height="125" rx="7" fill="#e7f5ee" stroke="#25805a" stroke-width="2"/>
    <circle cx="1277" cy="255" r="18" fill="#25805a"/>
    <text x="1277" y="261" text-anchor="middle" class="badge">5</text>
    <text x="1305" y="260" class="step">提交可确认</text>
    <text x="1272" y="297" class="mono">COMMIT / ACK</text>
    <text x="1272" y="323" class="small">上层可推进 frontier</text>
  </g>

  <rect x="1498" y="225" width="205" height="125" rx="7" fill="#fff1ef" stroke="#c64b45" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1522" y="258" class="step" fill="#a83834">禁止提前确认</text>
  <text x="1522" y="291" class="small">只有 file fsync：</text>
  <text x="1522" y="317" class="small">内容可能存在，但 final</text>
  <text x="1522" y="340" class="small">目录项掉电后仍可能消失</text>

  <line x1="315" y1="287" x2="355" y2="287" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="600" y1="287" x2="640" y2="287" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="885" y1="287" x2="925" y2="287" stroke="#b56a15" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <line x1="1190" y1="287" x2="1230" y2="287" stroke="#25805a" stroke-width="3" marker-end="url(#arrow-green)"/>

  <text x="70" y="458" class="section">B. 跨目录 corpus 提升：先确保持久公开，再确认 staging 删除</text>
  <rect x="55" y="480" width="1690" height="335" rx="8" fill="#ffffff" stroke="#c6d1da"/>

  <rect x="90" y="525" width="385" height="210" rx="7" fill="#edf3f8" stroke="#7395ae" stroke-width="2"/>
  <rect x="90" y="525" width="385" height="48" rx="7" fill="#315b78"/>
  <text x="282" y="556" text-anchor="middle" class="badge">STAGING DIRECTORY（源）</text>
  <text x="122" y="610" class="mono">staging/&lt;rank&gt;/&lt;id&gt;/H</text>
  <rect x="120" y="638" width="325" height="60" rx="5" fill="#ffffff" stroke="#8ba8bb"/>
  <text x="143" y="665" class="step">对象 H</text>
  <text x="143" y="687" class="small">内容已 file-fsync，尚未公开</text>
  <text x="122" y="722" class="small">manifest 已把 H 与父任务 fence 绑定</text>

  <rect x="548" y="555" width="240" height="150" rx="7" fill="#fff5e8" stroke="#d49447" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="588" cy="594" r="22" fill="#b56a15"/>
  <text x="588" y="601" text-anchor="middle" class="badge">1</text>
  <text x="622" y="600" class="step">原子移动</text>
  <text x="575" y="640" class="mono">rename(H)</text>
  <text x="575" y="669" class="small">同一文件系统内</text>

  <rect x="860" y="525" width="385" height="210" rx="7" fill="#e9f6ef" stroke="#4a9976" stroke-width="2"/>
  <rect x="860" y="525" width="385" height="48" rx="7" fill="#25805a"/>
  <text x="1052" y="556" text-anchor="middle" class="badge">PUBLIC CORPUS（目标）</text>
  <text x="892" y="610" class="mono">shared_dir/H</text>
  <rect x="890" y="638" width="325" height="60" rx="5" fill="#ffffff" stroke="#68a98c"/>
  <text x="913" y="665" class="step">对象 H</text>
  <text x="913" y="687" class="small">其他 master 可按 SHA-256 发现</text>
  <text x="892" y="722" class="small">同摘要重复发布为幂等成功</text>

  <rect x="1305" y="515" width="385" height="95" rx="7" fill="#e7f5ee" stroke="#25805a" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1342" cy="550" r="20" fill="#25805a"/>
  <text x="1342" y="557" text-anchor="middle" class="badge">2</text>
  <text x="1374" y="550" class="step">fsync(public_dir)</text>
  <text x="1374" y="578" class="small">先保证 H 在公开目录跨掉电可见</text>

  <rect x="1305" y="640" width="385" height="95" rx="7" fill="#edf3f8" stroke="#315b78" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1342" cy="675" r="20" fill="#315b78"/>
  <text x="1342" y="682" text-anchor="middle" class="badge">3</text>
  <text x="1374" y="675" class="step">fsync(staging_dir)</text>
  <text x="1374" y="703" class="small">再保证源名称删除跨掉电生效</text>

  <line x1="475" y1="630" x2="530" y2="630" stroke="#b56a15" stroke-width="4" marker-end="url(#arrow-amber)"/>
  <line x1="788" y1="630" x2="842" y2="630" stroke="#b56a15" stroke-width="4" marker-end="url(#arrow-amber)"/>
  <path d="M1245 640 C1270 640,1270 562,1290 562" fill="none" stroke="#25805a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <line x1="1498" y1="610" x2="1498" y2="625" stroke="#315b78" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="1275" y="779" class="small">目标屏障失败：报错并保留 manifest，重放 stage ∪ public</text>
  <text x="650" y="779" class="small">源屏障失败：public 已耐久；源名重现可由摘要幂等收敛</text>

  <text x="70" y="868" class="section">C. 保证升级与证据边界</text>
  <rect x="55" y="892" width="1690" height="180" rx="8" fill="#e9eef2" stroke="#becbd4"/>

  <rect x="85" y="930" width="350" height="100" rx="7" fill="#ffffff" stroke="#7e9cb1"/>
  <text x="112" y="963" class="step">F321 · 原子可见性</text>
  <text x="112" y="993" class="body">临时文件 + file fsync + rename</text>
  <text x="112" y="1017" class="small">进程失败下不暴露半写文件</text>

  <rect x="505" y="930" width="350" height="100" rx="7" fill="#ffffff" stroke="#d49447"/>
  <text x="532" y="963" class="step">F322 · 决策可重放</text>
  <text x="532" y="993" class="body">manifest + fencing + content redo</text>
  <text x="532" y="1017" class="small">commit 后崩溃仍可恢复活性</text>

  <rect x="925" y="930" width="350" height="100" rx="7" fill="#e7f5ee" stroke="#25805a" stroke-width="2"/>
  <text x="952" y="963" class="step">F323 · 名称持久性</text>
  <text x="952" y="993" class="body">ordered directory fsync + fail closed</text>
  <text x="952" y="1017" class="small">把掉电边界纳入可执行协议</text>

  <rect x="1345" y="920" width="350" height="120" rx="7" fill="#fff1ef" stroke="#c64b45" stroke-dasharray="8 6"/>
  <text x="1372" y="952" class="step">当前不证明</text>
  <text x="1372" y="981" class="small">真实物理断电、存储控制器诚实性</text>
  <text x="1372" y="1005" class="small">多文件同时可见、同 epoch 共识</text>
  <text x="1372" y="1029" class="small">覆盖率或求解吞吐提升</text>

  <line x1="435" y1="980" x2="490" y2="980" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="855" y1="980" x2="910" y2="980" stroke="#b56a15" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <line x1="1275" y1="980" x2="1330" y2="980" stroke="#25805a" stroke-width="3" marker-end="url(#arrow-green)"/>

  <text x="70" y="1100" class="small">线性化规则：只有所有必需目录屏障成功后才返回成功；任一屏障错误均保留 redo/fencing 证据并向上游传播。</text>
</svg>
