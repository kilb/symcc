<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">F400 persistent multi-objective live-state feedback</title>
  <desc id="desc">A durable ready frontier is scored with structural and learned outcome signals. Claim records exactly one attempt. Successful execution or failed abandonment records at most one outcome on the latest generation. Generation conflicts rebase, while stale lease tokens cannot mutate feedback.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#263645" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#455766"/></marker>
    <marker id="greenArrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#1f755b"/></marker>
    <marker id="redArrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#b0443d"/></marker>
    <style>
      .bg{fill:#f5f7f9}.panel{fill:#fff;stroke:#c7d1da;stroke-width:2;filter:url(#shadow)}
      .navy{fill:#173b57}.teal{fill:#087f8c}.green{fill:#1f755b}.amber{fill:#a96100}.red{fill:#b0443d}.violet{fill:#66539c}
      .title{font:700 38px system-ui,sans-serif;fill:#17212b}.sub{font:400 18px system-ui,sans-serif;fill:#526170}
      .h{font:700 22px system-ui,sans-serif;fill:#17212b}.body{font:400 17px system-ui,sans-serif;fill:#34495e}
      .small{font:400 15px system-ui,sans-serif;fill:#526170}.white{font:700 20px system-ui,sans-serif;fill:#fff}
      .mono{font:600 15px ui-monospace,SFMono-Regular,monospace;fill:#34495e}.formula{font:600 16px ui-monospace,SFMono-Regular,monospace;fill:#173b57}
      .line{fill:none;stroke:#455766;stroke-width:3;marker-end:url(#arrow)}
      .success{fill:none;stroke:#1f755b;stroke-width:3;marker-end:url(#greenArrow)}
      .failure{fill:none;stroke:#b0443d;stroke-width:3;marker-end:url(#redArrow)}
      .retry{fill:none;stroke:#a96100;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1080"/>
  <text class="title" x="72" y="64">F400 · Persistent Multi-Objective Live-State Feedback</text>
  <text class="sub" x="72" y="100">Outcome-aware scheduling on the durable continuation frontier, with generation-CAS and lease-fenced observations</text>

  <rect class="panel" x="55" y="145" width="325" height="250" rx="8"/>
  <rect class="navy" x="55" y="145" width="325" height="58" rx="8"/><rect class="navy" x="55" y="188" width="325" height="15"/>
  <text class="white" x="82" y="183">1 · Durable ready set</text>
  <text class="body" x="82" y="244">Checkpoint identity</text>
  <text class="body" x="82" y="278">CFG location + target branch</text>
  <text class="body" x="82" y="312">Depth, queries, loop exit</text>
  <text class="mono" x="82" y="354">generation g · token fenced</text>

  <rect class="panel" x="445" y="145" width="440" height="250" rx="8"/>
  <rect class="teal" x="445" y="145" width="440" height="58" rx="8"/><rect class="teal" x="445" y="188" width="440" height="15"/>
  <text class="white" x="472" y="183">2 · Deterministic score</text>
  <text class="formula" x="472" y="241">0.26 novelty + 0.20 uncovered</text>
  <text class="formula" x="472" y="274">+ 0.18 target + 0.10 depth cost</text>
  <text class="formula" x="472" y="307">+ cost/exit/efficiency/UCB</text>
  <text class="formula" x="472" y="340">− 0.20 failure ratio</text>
  <text class="small" x="472" y="370">Stable checkpoint identity breaks equal scores</text>

  <rect class="panel" x="950" y="145" width="345" height="250" rx="8"/>
  <rect class="violet" x="950" y="145" width="345" height="58" rx="8"/><rect class="violet" x="950" y="188" width="345" height="15"/>
  <text class="white" x="977" y="183">3 · Selection commit</text>
  <text class="body" x="977" y="244">Remove one ready checkpoint</text>
  <text class="body" x="977" y="278">Create owner/worker lease</text>
  <text class="body" x="977" y="312">Increment exactly one attempt</text>
  <text class="mono" x="977" y="354">snapshot v2 · g → g+1</text>

  <rect class="panel" x="1360" y="145" width="385" height="250" rx="8"/>
  <rect class="amber" x="1360" y="145" width="385" height="58" rx="8"/><rect class="amber" x="1360" y="188" width="385" height="15"/>
  <text class="white" x="1387" y="183">4 · Live continuation</text>
  <text class="body" x="1387" y="244">Execute / fork / checkpoint</text>
  <text class="body" x="1387" y="278">Observe reached locations</text>
  <text class="body" x="1387" y="312">Count steps + feasibility checks</text>
  <text class="small" x="1387" y="354">No native AFL coverage claim</text>

  <path class="line" d="M380 270 H445"/><path class="line" d="M885 270 H950"/><path class="line" d="M1295 270 H1360"/>

  <rect class="panel" x="115" y="505" width="455" height="235" rx="8"/>
  <rect class="green" x="115" y="505" width="455" height="58" rx="8"/><rect class="green" x="115" y="548" width="455" height="15"/>
  <text class="white" x="142" y="543">5A · Successful completion</text>
  <text class="body" x="142" y="606">Re-read latest generation</text>
  <text class="body" x="142" y="640">Credit only newly reached locations</text>
  <text class="body" x="142" y="674">Add children; mark parent done</text>
  <text class="mono" x="142" y="711">completion += 1 · failure += 0</text>

  <rect class="panel" x="672" y="505" width="455" height="235" rx="8"/>
  <rect class="red" x="672" y="505" width="455" height="58" rx="8"/><rect class="red" x="672" y="548" width="455" height="15"/>
  <text class="white" x="699" y="543">5B · Failed abandonment</text>
  <text class="body" x="699" y="606">Execution or heartbeat failure</text>
  <text class="body" x="699" y="640">Requeue the same checkpoint</text>
  <text class="body" x="699" y="674">Zero gain/cost; retain failure signal</text>
  <text class="mono" x="699" y="711">completion += 1 · failure += 1</text>

  <rect class="panel" x="1228" y="505" width="455" height="235" rx="8"/>
  <rect class="navy" x="1228" y="505" width="455" height="58" rx="8"/><rect class="navy" x="1228" y="548" width="455" height="15"/>
  <text class="white" x="1255" y="543">6 · Transaction verdict</text>
  <text class="body" x="1255" y="606">Current token + generation: commit</text>
  <text class="body" x="1255" y="640">Generation conflict: reload and rebase</text>
  <text class="body" x="1255" y="674">Stale token: reject all mutation</text>
  <text class="mono" x="1255" y="711">one observation transition max</text>

  <path class="success" d="M1552 395 V450 H342 V505"/>
  <path class="failure" d="M1552 395 V465 H900 V505"/>
  <path class="success" d="M570 690 V770 H1455 V740"/>
  <path class="failure" d="M1127 622 H1228"/>
  <path class="retry" d="M1550 740 V825 H665 V395"/>
  <text class="small" x="790" y="815">generation changed · recompute novelty and outcome deltas against current snapshot</text>

  <rect class="panel" x="95" y="855" width="1610" height="165" rx="8"/>
  <text class="h" x="130" y="900">Bounded recovery contract</text>
  <line x1="130" y1="922" x2="1670" y2="922" stroke="#d7dfe6" stroke-width="2"/>
  <rect x="135" y="946" width="350" height="45" rx="6" fill="#e9f5f1"/><text class="body" x="158" y="975">v1 snapshots upgrade with empty history</text>
  <rect x="525" y="946" width="365" height="45" rx="6" fill="#eef1f7"/><text class="body" x="548" y="975">bounded context table + @overflow</text>
  <rect x="930" y="946" width="355" height="45" rx="6" fill="#fff3e3"/><text class="body" x="953" y="975">integer monotone merge, no float state</text>
  <rect x="1325" y="946" width="335" height="45" rx="6" fill="#fbeceb"/><text class="body" x="1348" y="975">selection and observation separated</text>
  <text class="small" x="130" y="1047">Scope: mechanism I/T/E only · no Empc/CBC/CGS/TopSeed completeness claim · no coverage, bug-yield, or end-to-end speedup claim</text>
</svg>
