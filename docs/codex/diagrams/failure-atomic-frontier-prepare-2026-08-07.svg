<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-labelledby="title desc">
  <title id="title">F321 failure-atomic frontier admission and symmetric quiescence prepare</title>
  <desc id="desc">A three-stage schematic showing verified corpus publication, fenced worker retry, and symmetric root and peer prepare refresh.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17202a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3d5266"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#c43d4f"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #17202a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #52616f; }
      .section { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .head { font: 700 18px Arial, sans-serif; fill: #17202a; }
      .body { font: 400 15px Arial, sans-serif; fill: #34495e; }
      .small { font: 400 13px Arial, sans-serif; fill: #52616f; }
      .inverse { fill: #dbe5ec; }
      .mono { font: 600 14px 'DejaVu Sans Mono', monospace; fill: #263746; }
      .line { stroke: #3d5266; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7d8d9c; stroke-width: 2.5; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrow); }
      .reject { stroke: #c43d4f; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect width="1700" height="1120" fill="#f7f9fb"/>
  <text x="70" y="62" class="title">F321  Failure-Atomic Frontier + Symmetric PREPARE</text>
  <text x="70" y="94" class="subtitle">Byte identity, lease identity, retry ownership, and termination boundary form one verifiable transaction.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="130" width="500" height="700" rx="8" fill="#ffffff" stroke="#b9c6d0"/>
    <rect x="55" y="130" width="500" height="58" rx="8" fill="#167d83"/>
    <rect x="55" y="180" width="500" height="8" fill="#167d83"/>
    <text x="82" y="167" class="section">1  Verified corpus admission</text>
  </g>

  <rect x="95" y="225" width="420" height="82" rx="7" fill="#e7f5f4" stroke="#65a9a8"/>
  <text x="120" y="258" class="head">External seed / staged child bytes</text>
  <text x="120" y="285" class="body">Immutable semantic work starts as bytes, not a filename.</text>
  <path d="M305 307 L305 347" class="line"/>

  <rect x="95" y="350" width="420" height="112" rx="7" fill="#fff6dc" stroke="#d7aa3d"/>
  <text x="120" y="382" class="head">Unique temporary publication</text>
  <text x="120" y="410" class="mono">PID + monotonic_ns + random64</text>
  <text x="120" y="438" class="body">write → flush → file fsync → atomic replace</text>
  <path d="M305 462 L305 502" class="line"/>

  <rect x="95" y="505" width="420" height="112" rx="7" fill="#eaf2fb" stroke="#6a95bd"/>
  <text x="120" y="537" class="head">Owner-side SHA-256 gate</text>
  <text x="120" y="565" class="mono">filename == SHA256(actual bytes)</text>
  <text x="120" y="593" class="body">External, shared-scan, and recovery paths all verify.</text>
  <path d="M305 617 L305 657" class="line"/>

  <rect x="95" y="660" width="420" height="122" rx="7" fill="#eef7ea" stroke="#7aac68"/>
  <text x="120" y="692" class="head">Strict lease-record admission</text>
  <text x="120" y="720" class="mono">record.id == payload.hash == corpus hash</text>
  <text x="120" y="748" class="body">schema + finite Unix time + nonempty token</text>

  <g filter="url(#shadow)">
    <rect x="600" y="130" width="500" height="700" rx="8" fill="#ffffff" stroke="#b9c6d0"/>
    <rect x="600" y="130" width="500" height="58" rx="8" fill="#345f93"/>
    <rect x="600" y="180" width="500" height="8" fill="#345f93"/>
    <text x="627" y="167" class="section">2  Fenced execution and retry</text>
  </g>

  <rect x="640" y="225" width="420" height="90" rx="7" fill="#eaf2fb" stroke="#6a95bd"/>
  <text x="665" y="258" class="head">Pending exact assignment</text>
  <text x="665" y="288" class="mono">(work_hash, fencing_token)</text>
  <path d="M850 315 L850 355" class="line"/>

  <rect x="640" y="358" width="420" height="96" rx="7" fill="#f1f3f5" stroke="#9aa8b4"/>
  <text x="665" y="390" class="head">Private copy + hidden child stage</text>
  <text x="665" y="420" class="body">RESULT binds input bytes, stage identity, and children.</text>
  <path d="M850 454 L850 494" class="line"/>

  <polygon points="850,495 1000,560 850,625 700,560" fill="#fff6dc" stroke="#d7aa3d" stroke-width="2"/>
  <text x="756" y="552" class="head">Strict RESULT valid?</text>
  <text x="748" y="580" class="small">schema + input hash + exact stage inventory</text>

  <path d="M760 600 L735 663" class="reject"/>
  <text x="720" y="630" class="small">no</text>
  <rect x="625" y="665" width="210" height="118" rx="7" fill="#fff0f1" stroke="#c95a68"/>
  <text x="645" y="696" class="head">Re-hash corpus</text>
  <text x="645" y="724" class="small">intact: quarantine +</text>
  <text x="645" y="746" class="small">same-token requeue</text>
  <text x="645" y="768" class="small">bad/exhausted: fail</text>

  <path d="M940 600 L955 663" class="line"/>
  <text x="950" y="630" class="small">yes</text>
  <rect x="855" y="665" width="205" height="118" rx="7" fill="#eef7ea" stroke="#7aac68"/>
  <text x="875" y="696" class="head">Commit path</text>
  <text x="875" y="724" class="small">irreversible begin_commit</text>
  <text x="875" y="746" class="small">promote verified children</text>
  <text x="875" y="768" class="small">complete token</text>

  <g filter="url(#shadow)">
    <rect x="1145" y="130" width="500" height="700" rx="8" fill="#ffffff" stroke="#b9c6d0"/>
    <rect x="1145" y="130" width="500" height="58" rx="8" fill="#9b6a23"/>
    <rect x="1145" y="180" width="500" height="8" fill="#9b6a23"/>
    <text x="1172" y="167" class="section">3  Symmetric quiescence PREPARE</text>
  </g>

  <rect x="1185" y="225" width="420" height="82" rx="7" fill="#fff6dc" stroke="#d7aa3d"/>
  <text x="1210" y="258" class="head">All masters report stable idle</text>
  <text x="1210" y="285" class="body">Fresh monotonic status is only a trigger.</text>
  <path d="M1395 307 L1395 347" class="line"/>

  <rect x="1185" y="350" width="420" height="162" rx="7" fill="#e7f5f4" stroke="#65a9a8"/>
  <text x="1210" y="382" class="head">Every participant refreshes</text>
  <rect x="1220" y="405" width="350" height="30" rx="4" fill="#ffffff" stroke="#9fc9c7"/>
  <text x="1240" y="426" class="small">1. external input directory</text>
  <rect x="1220" y="443" width="350" height="30" rx="4" fill="#ffffff" stroke="#9fc9c7"/>
  <text x="1240" y="464" class="small">2. shared content-addressed corpus</text>
  <rect x="1220" y="481" width="350" height="30" rx="4" fill="#ffffff" stroke="#9fc9c7"/>
  <text x="1240" y="502" class="small">3. expired lease records</text>
  <path d="M1395 512 L1395 552" class="line"/>

  <polygon points="1395,553 1555,623 1395,693 1235,623" fill="#eaf2fb" stroke="#6a95bd" stroke-width="2"/>
  <text x="1307" y="616" class="head">Still locally idle?</text>
  <text x="1319" y="643" class="small">root and peers use the same gate</text>

  <path d="M1300 665 L1270 703" class="reject"/>
  <text x="1265" y="682" class="small">no</text>
  <rect x="1170" y="705" width="200" height="89" rx="7" fill="#fff0f1" stroke="#c95a68"/>
  <text x="1190" y="735" class="head">Publish BUSY</text>
  <text x="1190" y="761" class="small">reset window; no token</text>

  <path d="M1490 665 L1500 703" class="line"/>
  <text x="1510" y="682" class="small">yes</text>
  <rect x="1390" y="705" width="220" height="89" rx="7" fill="#eef7ea" stroke="#7aac68"/>
  <text x="1410" y="735" class="head">Freeze frontier</text>
  <text x="1410" y="761" class="small">COMMIT / exact ACK</text>

  <path d="M555 400 C580 400 580 270 600 270" class="dash"/>
  <path d="M1100 270 C1120 270 1120 270 1145 270" class="dash"/>

  <rect x="55" y="870" width="1590" height="178" rx="8" fill="#17202a"/>
  <text x="85" y="910" class="section">Safety envelope</text>
  <rect x="85" y="935" width="360" height="78" rx="6" fill="#243444" stroke="#4f687d"/>
  <text x="105" y="964" class="section" font-size="16">At-most-once commit</text>
  <text x="105" y="992" class="small inverse">Execution may retry; stale tokens cannot commit.</text>
  <rect x="470" y="935" width="360" height="78" rx="6" fill="#243444" stroke="#4f687d"/>
  <text x="490" y="964" class="section" font-size="16">No payload redirection</text>
  <text x="490" y="992" class="small inverse">Record id and content hash remain inseparable.</text>
  <rect x="855" y="935" width="360" height="78" rx="6" fill="#243444" stroke="#4f687d"/>
  <text x="875" y="964" class="section" font-size="16">No time-based mutex theft</text>
  <text x="875" y="992" class="small inverse">Only pre-commit leases expire; commit cannot be stolen.</text>
  <rect x="1240" y="935" width="370" height="78" rx="6" fill="#243444" stroke="#4f687d"/>
  <text x="1260" y="964" class="section" font-size="16">Finite-batch boundary</text>
  <text x="1260" y="992" class="small inverse">Post-PREPARE arrivals belong to the next run.</text>

  <text x="55" y="1090" class="small">Evidence: 618 Python tests + 38 subtests; Open MPI healthy 12/12, staged child 13/1, digest-corruption Abort(70).</text>
</svg>
