<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">F398 ParaSuit branch-rarity parameter-selection workflow</title>
  <desc id="desc">Worker branch outcomes are normalized and deterministically sampled. Standalone extraction establishes per-parameter baselines, iterative combinations receive inverse-frequency scores and synergy penalties, then ParaSuit or hybrid selection controls the next assignment. Three hash-bound state files preserve exact replay.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17212b" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d4f5f"/></marker>
    <marker id="tealArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker>
    <style>
      .bg{fill:#f7f8fa}.panel{fill:#fff;stroke:#cbd3dc;stroke-width:2;filter:url(#shadow)}
      .navy{fill:#17324d}.teal{fill:#087f8c}.green{fill:#2f855a}.amber{fill:#b86400}.red{fill:#b5483a}.violet{fill:#7157a5}
      .title{font:700 36px system-ui,sans-serif;fill:#17212b}.sub{font:400 18px system-ui,sans-serif;fill:#536273}
      .h{font:700 21px system-ui,sans-serif;fill:#17212b}.body{font:400 17px system-ui,sans-serif;fill:#34495e}
      .white{font:700 20px system-ui,sans-serif;fill:#fff}.small{font:400 15px system-ui,sans-serif;fill:#536273}
      .mono{font:600 15px ui-monospace,SFMono-Regular,monospace;fill:#34495e}.formula{font:600 18px ui-monospace,SFMono-Regular,monospace;fill:#17324d}
      .line{fill:none;stroke:#3d4f5f;stroke-width:3;marker-end:url(#arrow)}.feedback{fill:none;stroke:#087f8c;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#tealArrow)}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1100"/>
  <text class="title" x="80" y="68">F398 · ParaSuit Branch-Rarity Parameter Selection</text>
  <text class="sub" x="80" y="104">Standalone evidence, synergy-aware combinations, bounded feedback, exact state replay</text>

  <rect class="panel" x="65" y="150" width="335" height="220" rx="8"/>
  <rect class="navy" x="65" y="150" width="335" height="56" rx="8"/><rect class="navy" x="65" y="190" width="335" height="16"/>
  <text class="white" x="92" y="187">1 · Worker execution</text>
  <text class="body" x="92" y="244">One assignment token</text>
  <text class="body" x="92" y="281">Six-field runtime branch trace</text>
  <text class="mono" x="92" y="318">(stable site, taken)</text>
  <text class="small" x="92" y="348">No AFL-global novelty substitution</text>

  <rect class="panel" x="480" y="150" width="350" height="220" rx="8"/>
  <rect class="teal" x="480" y="150" width="350" height="56" rx="8"/><rect class="teal" x="480" y="190" width="350" height="16"/>
  <text class="white" x="507" y="187">2 · Stable coverage set</text>
  <text class="body" x="507" y="244">Validate uint64 site + {0,1}</text>
  <text class="body" x="507" y="281">Deduplicate outcomes</text>
  <text class="body" x="507" y="318">Deterministic MinHash sample</text>
  <text class="mono" x="507" y="348">≤ 128 features / execution</text>

  <rect class="panel" x="910" y="150" width="360" height="220" rx="8"/>
  <rect class="amber" x="910" y="150" width="360" height="56" rx="8"/><rect class="amber" x="910" y="190" width="360" height="16"/>
  <text class="white" x="937" y="187">3 · Inverse-frequency score</text>
  <text class="formula" x="937" y="252">S(B) = Σ 1 / frequency(b)</text>
  <text class="body" x="937" y="293">Rare outcomes contribute more</text>
  <text class="body" x="937" y="329">Current bounded window only</text>
  <text class="small" x="937" y="352">Paper formula, not branch count</text>

  <rect class="panel" x="1350" y="150" width="385" height="220" rx="8"/>
  <rect class="green" x="1350" y="150" width="385" height="56" rx="8"/><rect class="green" x="1350" y="190" width="385" height="16"/>
  <text class="white" x="1377" y="187">4 · Bounded evidence window</text>
  <text class="body" x="1377" y="244">16–256 completed executions</text>
  <text class="body" x="1377" y="281">Exact parameter choices + context</text>
  <text class="body" x="1377" y="318">Replay consumes each token once</text>
  <text class="small" x="1377" y="348">Missing telemetry creates no coverage</text>

  <path class="line" d="M400 260 H480"/><path class="line" d="M830 260 H910"/><path class="line" d="M1270 260 H1350"/>

  <rect class="panel" x="115" y="465" width="665" height="235" rx="8"/>
  <rect class="violet" x="115" y="465" width="665" height="55" rx="8"/><rect class="violet" x="115" y="504" width="665" height="16"/>
  <text class="white" x="145" y="502">Phase A · Standalone extraction</text>
  <text class="body" x="145" y="562">Try each declared non-unset value once</text>
  <text class="body" x="145" y="599">Inject only transitive activation parents + hard guards</text>
  <text class="body" x="145" y="636">Exclude unrelated base-profile parameters from attribution</text>
  <text class="formula" x="145" y="674">baseline(p) = mean S(B) for standalone p</text>

  <rect class="panel" x="1020" y="465" width="665" height="235" rx="8"/>
  <rect class="red" x="1020" y="465" width="665" height="55" rx="8"/><rect class="red" x="1020" y="504" width="665" height="16"/>
  <text class="white" x="1050" y="502">Phase B · Combination and synergy</text>
  <text class="body" x="1050" y="562">Observe actual multi-parameter assignments</text>
  <text class="body" x="1050" y="599">Compare the same run score with each member baseline</text>
  <text class="formula" x="1050" y="638">credit(p,B) = 0  if S(B) &lt; baseline(p)</text>
  <text class="formula" x="1050" y="674">combined(p) = mean credit(p,B)</text>

  <path class="line" d="M1450 370 V418 H448 V465"/>
  <path class="line" d="M1535 370 V430 H1353 V465"/>

  <rect class="panel" x="335" y="795" width="1130" height="205" rx="8"/>
  <text class="h" x="375" y="839">5 · Next-assignment selector</text>
  <line x1="375" y1="860" x2="1425" y2="860" stroke="#d9e0e7" stroke-width="2"/>
  <rect x="385" y="888" width="285" height="76" rx="7" fill="#edf7f5" stroke="#2f855a" stroke-width="2"/>
  <text class="h" x="415" y="920">ParaSuit</text><text class="small" x="415" y="947">independent P(p) = normalized score</text>
  <rect x="758" y="888" width="285" height="76" rx="7" fill="#f3effa" stroke="#7157a5" stroke-width="2"/>
  <text class="h" x="788" y="920">Hybrid</text><text class="small" x="788" y="947">rarity weight + hierarchy rank</text>
  <rect x="1130" y="888" width="285" height="76" rx="7" fill="#fff5e8" stroke="#b86400" stroke-width="2"/>
  <text class="h" x="1160" y="920">Hierarchical</text><text class="small" x="1160" y="947">F186 contextual fallback / ablation</text>
  <path class="line" d="M448 700 L675 795"/><path class="line" d="M1353 700 L1125 795"/>

  <path class="feedback" d="M335 920 H48 Q25 920 25 897 V418 Q25 395 48 395 H655 V370"/>
  <text class="small" x="48" y="890">next assignment → real worker</text>

  <rect x="65" y="1032" width="1670" height="42" rx="7" fill="#e8edf2"/>
  <text class="mono" x="90" y="1059">state triple = base SHA-256 ↔ value sidecar SHA-256 ↔ selection sidecar · program + schema + provider + policy + sequence · mismatch ⇒ clear all learned state</text>
</svg>
