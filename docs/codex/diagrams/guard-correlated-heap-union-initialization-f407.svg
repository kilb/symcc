<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">F407 guard-correlated heap-union initialization</title>
  <desc id="desc">A producer, guard-tree proof artifact, consumer replay, and runtime authority schematic.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 40px 'WenQuanYi Zen Hei',sans-serif; fill: #102a43; }
      .subtitle { font: 400 21px 'WenQuanYi Zen Hei',sans-serif; fill: #52606d; }
      .headerTitle { font: 700 40px 'WenQuanYi Zen Hei',sans-serif; fill: #ffffff; }
      .headerSub { font: 400 21px 'WenQuanYi Zen Hei',sans-serif; fill: #d9e2ec; }
      .section { font: 700 25px 'WenQuanYi Zen Hei',sans-serif; fill: #ffffff; }
      .heading { font: 700 21px 'WenQuanYi Zen Hei',sans-serif; fill: #102a43; }
      .body { font: 400 18px 'WenQuanYi Zen Hei',sans-serif; fill: #334e68; }
      .small { font: 400 16px 'WenQuanYi Zen Hei',sans-serif; fill: #486581; }
      .inverseSmall { font: 400 16px 'WenQuanYi Zen Hei',sans-serif; fill: #ffffff; }
      .mono { font: 600 16px 'DejaVu Sans Mono',monospace; fill: #243b53; }
      .panel { fill: #ffffff; stroke: #bcccdc; stroke-width: 2; rx: 6; }
      .step { fill: #f7fafc; stroke: #9fb3c8; stroke-width: 2; rx: 5; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #627d98; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f3f6f8"/>
  <rect x="0" y="0" width="1920" height="104" fill="#102a43"/>
  <text x="60" y="56" class="headerTitle">F407  Guard-Correlated Heap-Union Initialization</text>
  <text x="60" y="88" class="headerSub">有界控制流证明 · 每路径 store witness · proof-carrying artifact · runtime 标记保持权威</text>

  <rect x="54" y="132" width="508" height="742" class="panel"/>
  <rect x="54" y="132" width="508" height="58" fill="#147d73" rx="6"/>
  <text x="80" y="169" class="section">A. LLVM Producer</text>

  <rect x="82" y="218" width="452" height="94" class="step"/>
  <circle cx="112" cy="249" r="17" fill="#147d73"/>
  <text x="106" y="256" class="inverseSmall">1</text>
  <text x="142" y="248" class="heading">恢复有限 pointer alternatives</text>
  <text x="142" y="278" class="body">heap identity · base · offset · guards</text>

  <path d="M308 312 L308 339" class="thin"/>
  <rect x="82" y="340" width="452" height="94" class="step"/>
  <circle cx="112" cy="371" r="17" fill="#147d73"/>
  <text x="106" y="378" class="inverseSmall">2</text>
  <text x="142" y="370" class="heading">F406 支配集合证明先执行</text>
  <text x="142" y="400" class="body">成功则走旧快速路径；失败才进入 F407</text>

  <path d="M308 434 L308 461" class="thin"/>
  <rect x="82" y="462" width="452" height="112" class="step"/>
  <circle cx="112" cy="493" r="17" fill="#147d73"/>
  <text x="106" y="500" class="inverseSmall">3</text>
  <text x="142" y="492" class="heading">枚举完整无环 guard tree</text>
  <text x="142" y="522" class="body">NCD root → merge predecessor</text>
  <text x="142" y="550" class="mono">paths ≤ 64 · depth ≤ 8</text>

  <path d="M308 574 L308 601" class="thin"/>
  <rect x="82" y="602" width="452" height="112" class="step"/>
  <circle cx="112" cy="633" r="17" fill="#147d73"/>
  <text x="106" y="640" class="inverseSmall">4</text>
  <text x="142" y="632" class="heading">逐路径闭合对象与写入</text>
  <text x="142" y="662" class="body">select / PHI guard → 唯一 object</text>
  <text x="142" y="690" class="body">同路径逆向 → 覆盖区间的 store</text>

  <path d="M308 714 L308 741" class="thin"/>
  <rect x="82" y="742" width="452" height="100" fill="#e8f5f2" stroke="#147d73" stroke-width="2" rx="5"/>
  <circle cx="112" cy="773" r="17" fill="#147d73"/>
  <text x="106" y="780" class="inverseSmall">5</text>
  <text x="142" y="772" class="heading">输出证书与 capability</text>
  <text x="142" y="802" class="mono">initialization_guard_tree</text>
  <text x="142" y="828" class="small">任何未知、超限或错配均 fail closed</text>

  <rect x="606" y="132" width="666" height="742" class="panel"/>
  <rect x="606" y="132" width="666" height="58" fill="#d05a47" rx="6"/>
  <text x="632" y="169" class="section">B. Guard Tree + Logical MemoryPhi</text>

  <rect x="824" y="224" width="230" height="66" fill="#fff3df" stroke="#d69e2e" stroke-width="2" rx="5"/>
  <text x="876" y="251" class="heading">root branch</text>
  <text x="861" y="276" class="mono">choose = ?</text>

  <path d="M901 290 C850 328 785 340 744 374" class="arrow"/>
  <path d="M977 290 C1029 328 1094 340 1135 374" class="arrow"/>
  <text x="804" y="334" class="small">true</text>
  <text x="1041" y="334" class="small">false</text>

  <rect x="660" y="382" width="252" height="122" fill="#e8f5f2" stroke="#147d73" stroke-width="2" rx="5"/>
  <text x="708" y="415" class="heading">Path P_T</text>
  <text x="686" y="447" class="mono">store 11 → left</text>
  <text x="686" y="478" class="small">block · ordinal · interval</text>

  <rect x="966" y="382" width="252" height="122" fill="#e7eef8" stroke="#2767a8" stroke-width="2" rx="5"/>
  <text x="1012" y="415" class="heading">Path P_F</text>
  <text x="993" y="447" class="mono">store 22 → right</text>
  <text x="993" y="478" class="small">block · ordinal · interval</text>

  <path d="M786 504 C810 544 860 562 903 586" class="arrow"/>
  <path d="M1092 504 C1068 544 1018 562 975 586" class="arrow"/>

  <rect x="786" y="592" width="306" height="134" fill="#fff7ed" stroke="#d05a47" stroke-width="3" rx="5"/>
  <text x="833" y="626" class="heading">merge load</text>
  <text x="817" y="658" class="mono">p = select(choose)</text>
  <text x="817" y="687" class="mono">v = load p</text>
  <text x="817" y="714" class="small">逻辑 MemoryPhi：P_T→left，P_F→right</text>

  <rect x="650" y="770" width="578" height="72" fill="#f7fafc" stroke="#9fb3c8" stroke-width="2" rx="5"/>
  <text x="676" y="799" class="heading">证明不变量</text>
  <text x="676" y="828" class="body">每条 CFG 路径：唯一被选对象 = 同路径完整写入对象</text>

  <path d="M562 504 L596 504" class="arrow"/>
  <path d="M1272 504 L1292 504" class="arrow"/>

  <rect x="1310" y="132" width="556" height="742" class="panel"/>
  <rect x="1310" y="132" width="556" height="58" fill="#2767a8" rx="6"/>
  <text x="1336" y="169" class="section">C. Artifact Consumer + Runtime</text>

  <rect x="1340" y="218" width="496" height="138" fill="#e7eef8" stroke="#2767a8" stroke-width="2" rx="5"/>
  <text x="1367" y="251" class="heading">Proof-carrying artifact</text>
  <text x="1367" y="283" class="mono">root · merge · depth · paths[]</text>
  <text x="1367" y="311" class="mono">decisions · base · load_address</text>
  <text x="1367" y="339" class="mono">store(block, ordinal, address, bytes)</text>

  <path d="M1588 356 L1588 390" class="thin"/>
  <rect x="1340" y="392" width="496" height="174" fill="#f7fafc" stroke="#2767a8" stroke-width="2" rx="5"/>
  <text x="1367" y="425" class="heading">Consumer 独立重放</text>
  <text x="1367" y="458" class="body">① 重枚举 artifact CFG 全部路径</text>
  <text x="1367" y="488" class="body">② 重算 select / PHI guard 与 owner</text>
  <text x="1367" y="518" class="body">③ 定位 store ordinal 并核对区间</text>
  <text x="1367" y="548" class="body">④ capability 依赖及使用点闭合</text>

  <path d="M1588 566 L1588 600" class="thin"/>
  <rect x="1340" y="602" width="496" height="124" fill="#e8f5f2" stroke="#147d73" stroke-width="2" rx="5"/>
  <text x="1367" y="637" class="heading">Content-addressed program root</text>
  <text x="1367" y="669" class="body">规范化证书随 program 持久化</text>
  <text x="1367" y="699" class="body">fresh-process resume 使用相同不可变事实</text>

  <path d="M1588 726 L1588 758" class="thin"/>
  <rect x="1340" y="760" width="496" height="82" fill="#fff3df" stroke="#d69e2e" stroke-width="2" rx="5"/>
  <text x="1367" y="793" class="heading">Runtime 最终权威</text>
  <text x="1367" y="823" class="body">真实 store 更新 init；load 仍检查 live / size / init</text>

  <rect x="54" y="908" width="1812" height="124" fill="#ffffff" stroke="#bcccdc" stroke-width="2" rx="6"/>
  <rect x="54" y="908" width="286" height="124" fill="#102a43" rx="6"/>
  <text x="83" y="955" class="section">验证边界</text>
  <text x="83" y="990" class="headerSub">机制证据，不外推性能</text>

  <text x="376" y="946" class="heading">已验证</text>
  <text x="376" y="979" class="body">LLVM 17/18 · select/PHI · 4叶嵌套 · 64路径 · 10类篡改</text>
  <text x="376" y="1009" class="body">48 trees · 1,008 assignments · 3 × 1,008 negative oracles</text>

  <line x1="1184" y1="932" x2="1184" y2="1008" stroke="#bcccdc" stroke-width="2"/>
  <text x="1216" y="946" class="heading">未声称</text>
  <text x="1216" y="979" class="body">一般 LLVM MemorySSA / loops / dynamic GEP / interprocedural clobber</text>
  <text x="1216" y="1009" class="body">无公共 coverage、solver throughput、bug-yield 或端到端 speedup</text>
</svg>
