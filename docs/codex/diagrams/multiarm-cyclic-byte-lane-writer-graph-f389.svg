<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16233c" flood-opacity=".12"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#385170"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#13866f"/></marker>
    <style>
      .t{font:700 40px 'WenQuanYi Zen Hei',sans-serif;fill:#16233c}.st{font:400 20px 'WenQuanYi Zen Hei',sans-serif;fill:#586b82}
      .h{font:700 24px 'WenQuanYi Zen Hei',sans-serif;fill:#16233c}.n{font:700 18px 'WenQuanYi Zen Hei',sans-serif;fill:#16233c}
      .b{font:400 16px 'WenQuanYi Zen Hei',sans-serif;fill:#43566f}.sm{font:400 14px 'WenQuanYi Zen Hei',sans-serif;fill:#5a6d84}
      .w{fill:#fff}.l{stroke:#385170;stroke-width:3;fill:none;marker-end:url(#a)}.pr{stroke:#13866f;stroke-width:4;fill:none;stroke-dasharray:9 7;marker-end:url(#p)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f4f7fb"/><rect width="1600" height="104" fill="#fff"/><rect y="101" width="1600" height="3" fill="#13866f"/>
  <text x="70" y="55" class="t">F389  Multi-Arm 循环逐叶写者证明</text>
  <text x="72" y="86" class="st">三条 arm 使用各自的 branch 边界，组合为无路径猜测的 byte-lane last-writer 图</text>

  <text x="70" y="150" class="h">1  分支树与三叶分区</text>
  <rect x="55" y="170" width="970" height="500" rx="8" fill="#fff" filter="url(#s)"/>
  <rect x="90" y="350" width="145" height="78" rx="7" fill="#e8eef6" stroke="#aebdd0"/><text x="162" y="381" class="n" text-anchor="middle">merge load</text><text x="162" y="407" class="sm" text-anchor="middle">lane 0 / lane 1</text>
  <rect x="300" y="350" width="145" height="78" rx="7" fill="#fff3d7" stroke="#d99b1d"/><text x="372" y="381" class="n" text-anchor="middle">root branch</text><text x="372" y="407" class="sm" text-anchor="middle">outer guard</text>
  <rect x="535" y="350" width="145" height="78" rx="7" fill="#fff3d7" stroke="#d99b1d"/><text x="607" y="381" class="n" text-anchor="middle">inner branch</text><text x="607" y="407" class="sm" text-anchor="middle">nested guard</text>
  <rect x="760" y="205" width="210" height="100" rx="7" fill="#e4f5ef" stroke="#13866f" stroke-width="2"/><text x="865" y="240" class="n" text-anchor="middle">root store arm</text><text x="865" y="267" class="b" text-anchor="middle">lane 0 = S0</text><text x="865" y="291" class="b" text-anchor="middle">lane 1 = carry</text>
  <rect x="760" y="350" width="210" height="100" rx="7" fill="#eaf0fa" stroke="#5279ad" stroke-width="2"/><text x="865" y="385" class="n" text-anchor="middle">inner store arm</text><text x="865" y="412" class="b" text-anchor="middle">lane 0 = carry</text><text x="865" y="436" class="b" text-anchor="middle">lane 1 = S1</text>
  <rect x="760" y="495" width="210" height="100" rx="7" fill="#fff0ea" stroke="#d85f42" stroke-width="2"/><text x="865" y="530" class="n" text-anchor="middle">pure carry arm</text><text x="865" y="557" class="b" text-anchor="middle">lane 0 = carry</text><text x="865" y="581" class="b" text-anchor="middle">lane 1 = carry</text>
  <path d="M235 389H300" class="l"/><path d="M445 380C575 275 650 250 760 253" class="l"/><path d="M445 399H535" class="l"/><path d="M680 382C710 380 730 390 760 398" class="l"/><path d="M680 410C720 455 730 520 760 545" class="l"/>
  <path d="M970 255C1010 290 1000 620 880 630C620 650 300 620 162 428" class="l"/><path d="M970 400C1010 430 1000 620 900 630" class="l"/><path d="M970 545C1000 565 990 610 930 625" class="l"/>
  <rect x="90" y="515" width="560" height="105" rx="7" fill="#16233c"/><text x="120" y="552" class="n w">边界绑定</text><text x="120" y="582" class="b w">root arm → root branch</text><text x="365" y="582" class="b w">inner arms → inner branch</text><text x="120" y="607" class="sm w">每个 leaf 独立重放；禁止跨 arm 借用 store identity</text>

  <text x="1080" y="150" class="h">2  组合证明</text>
  <rect x="1060" y="170" width="485" height="500" rx="8" fill="#fff" filter="url(#s)"/>
  <rect x="1100" y="215" width="405" height="74" rx="7" fill="#e8eef6"/><circle cx="1136" cy="252" r="21" fill="#385170"/><text x="1136" y="259" class="n w" text-anchor="middle">A</text><text x="1172" y="245" class="n">seed → root</text><text x="1172" y="270" class="sm">store / initial closure</text>
  <rect x="1100" y="315" width="405" height="74" rx="7" fill="#fff3d7"/><circle cx="1136" cy="352" r="21" fill="#d99b1d"/><text x="1136" y="359" class="n w" text-anchor="middle">B</text><text x="1172" y="345" class="n">merge edge → join</text><text x="1172" y="370" class="sm">carry-only prefix</text>
  <rect x="1100" y="415" width="405" height="74" rx="7" fill="#e4f5ef"/><circle cx="1136" cy="452" r="21" fill="#13866f"/><text x="1136" y="459" class="n w" text-anchor="middle">C</text><text x="1172" y="445" class="n">3 × leaf edge → branch</text><text x="1172" y="470" class="sm">route-specific boundary</text>
  <path d="M1302 515V570" class="pr"/><rect x="1100" y="575" width="405" height="56" rx="7" fill="#e4f5ef"/><text x="1302" y="600" class="n" text-anchor="middle">A ∧ B ∧ C</text><text x="1302" y="621" class="sm" text-anchor="middle">三条可重放 writer paths，无 join 猜测</text>

  <text x="70" y="730" class="h">3  准入与研究边界</text>
  <rect x="55" y="750" width="1490" height="180" rx="8" fill="#fff" filter="url(#s)"/>
  <rect x="90" y="785" width="330" height="105" rx="7" fill="#e8eef6"/><text x="120" y="817" class="n">地址 / 顺序</text><text x="120" y="846" class="b">首个覆盖 store 精确匹配</text><text x="120" y="873" class="sm">ID、offset、width 漂移拒绝</text>
  <rect x="450" y="785" width="330" height="105" rx="7" fill="#e4f5ef"/><text x="480" y="817" class="n">CFG / 预算</text><text x="480" y="846" class="b">唯一前驱，writer path ≤ 64</text><text x="480" y="873" class="sm">forwarded corridor ≤ 16</text>
  <rect x="810" y="785" width="330" height="105" rx="7" fill="#fff3d7"/><text x="840" y="817" class="n">能力 / Poison</text><text x="840" y="846" class="b">capability ⇔ marker</text><text x="840" y="873" class="sm">graph store sidecar 精确同源</text>
  <rect x="1170" y="785" width="335" height="105" rx="7" fill="#fff0ea"/><text x="1200" y="817" class="n">未覆盖</text><text x="1200" y="846" class="b">recursive tree / general SCC</text><text x="1200" y="873" class="sm">符号指针、并发内存、通用 MemorySSA</text>
  <text x="70" y="971" class="sm">F389 是机制正确性证据，不据此声明 coverage、吞吐、求解速度或漏洞发现提升。</text>
</svg>
