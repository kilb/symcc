<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">F401 persistent live-state multiple minimum path-cover scheduling</title>
  <desc id="desc">Program graph construction, frontier-generation coverage projection, checkpoint-compatible cover scoring, and transactional claim flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #52606d; }
      .section { font: 700 21px Arial, sans-serif; fill: #17212b; }
      .label { font: 700 17px Arial, sans-serif; fill: #17212b; }
      .body { font: 400 15px Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px Arial, sans-serif; fill: #52606d; }
      .mono { font: 600 14px Consolas, monospace; fill: #17212b; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#f8fafc"/>
  <rect x="52" y="42" width="1696" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="52" y="42" width="14" height="92" fill="#0f766e"/>
  <text class="title" x="88" y="83">F401 · Persistent Empc-style Live-State Path-Cover Scheduling</text>
  <text class="subtitle" x="88" y="112">Function-local SCC DAG · bounded multiple minimum covers · restart-exact frontier claim</text>

  <text class="section" x="72" y="181">A · Deterministic program-derived plan</text>
  <rect x="70" y="203" width="300" height="170" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text class="label" x="94" y="238">CAS live program</text>
  <text class="body" x="94" y="272">branch / jump / exception edges</text>
  <text class="body" x="94" y="298">call edges retained for distance only</text>
  <text class="mono" x="94" y="334">program_root = SHA-256(...)</text>

  <path class="edge" d="M370 288 H432"/>
  <rect x="438" y="203" width="306" height="170" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text class="label" x="462" y="238">Function-local CFG</text>
  <circle cx="498" cy="302" r="16" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <circle cx="590" cy="274" r="16" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <circle cx="590" cy="330" r="16" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <circle cx="682" cy="302" r="16" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <path class="thin" d="M516 298 L570 280"/>
  <path class="thin" d="M516 306 L570 324"/>
  <path class="thin" d="M608 280 L663 298"/>
  <path class="thin" d="M608 324 L663 306"/>
  <text class="small" x="462" y="356">No synthetic static return edge</text>

  <path class="edge" d="M744 288 H806"/>
  <rect x="812" y="203" width="306" height="170" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text class="label" x="836" y="238">Iterative SCC condensation</text>
  <ellipse cx="874" cy="302" rx="31" ry="24" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <ellipse cx="965" cy="274" rx="31" ry="24" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <ellipse cx="965" cy="330" rx="31" ry="24" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <ellipse cx="1056" cy="302" rx="31" ry="24" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <path class="thin" d="M905 298 L934 282"/>
  <path class="thin" d="M905 306 L934 322"/>
  <path class="thin" d="M996 282 L1025 298"/>
  <path class="thin" d="M996 322 L1025 306"/>
  <text class="small" x="836" y="356">Loop bodies become one DAG node</text>

  <path class="edge" d="M1118 288 H1180"/>
  <rect x="1186" y="203" width="542" height="170" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text class="label" x="1210" y="238">Bounded multiple minimum path covers</text>
  <text class="mono" x="1210" y="272">cover size = |V| − |maximum matching|</text>
  <path d="M1228 316 H1370 H1512 H1654" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
  <path d="M1228 342 H1370" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <path d="M1512 342 H1654" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <circle cx="1228" cy="316" r="7" fill="#ffffff" stroke="#17212b" stroke-width="2"/>
  <circle cx="1370" cy="316" r="7" fill="#ffffff" stroke="#17212b" stroke-width="2"/>
  <circle cx="1512" cy="316" r="7" fill="#ffffff" stroke="#17212b" stroke-width="2"/>
  <circle cx="1654" cy="316" r="7" fill="#ffffff" stroke="#17212b" stroke-width="2"/>
  <text class="small" x="1210" y="363">Iterative matching · bounded edge exclusion · cached by program + bounds</text>

  <text class="section" x="72" y="435">B · One precomputation per frontier generation</text>
  <rect x="70" y="456" width="394" height="192" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text class="label" x="94" y="491">Durable search snapshot v3</text>
  <text class="body" x="94" y="525">covered live-interpreter locations</text>
  <text class="body" x="94" y="553">MPC bounds: covers + function nodes</text>
  <text class="body" x="94" y="581">selection/outcome counters from F400</text>
  <rect x="94" y="599" width="336" height="28" rx="5" fill="#f1f5f9"/>
  <text class="mono" x="107" y="618">generation g · exact configuration</text>

  <path class="edge" d="M464 552 H536"/>
  <rect x="542" y="456" width="474" height="192" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text class="label" x="566" y="491">Coverage projection context</text>
  <text class="body" x="566" y="525">1 · location → function-local SCC</text>
  <text class="body" x="566" y="553">2 · covered component set per function</text>
  <text class="body" x="566" y="581">3 · reverse uncovered suffix ratio</text>
  <text class="mono" x="566" y="617">O(L + K·V), once for generation g</text>

  <path class="dash" d="M1457 373 V420 H779 V450"/>
  <rect x="1094" y="456" width="634" height="192" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text class="label" x="1118" y="491">Precomputed immutable lookup</text>
  <text class="body" x="1118" y="525">token → set(function, source SCC, target SCC)</text>
  <text class="body" x="1118" y="553">cover → matching edges + component suffix index</text>
  <text class="body" x="1118" y="581">generation → uncovered suffix ratios</text>
  <text class="small" x="1118" y="617">Ambiguous token never removes a cover</text>
  <path class="edge" d="M1016 552 H1088"/>

  <text class="section" x="72" y="710">C · Candidate scoring and fenced claim</text>
  <rect x="70" y="733" width="326" height="210" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text class="label" x="94" y="768">Ready checkpoint</text>
  <text class="body" x="94" y="802">current function + SCC</text>
  <text class="body" x="94" y="830">≤ 256 persisted branch tokens</text>
  <text class="body" x="94" y="858">content-addressed identity</text>
  <text class="small" x="94" y="903">Unknown / collision / cross-function</text>
  <text class="small" x="94" y="924">=&gt; preserve active covers</text>

  <path class="edge" d="M396 838 H468"/>
  <rect x="474" y="733" width="400" height="210" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text class="label" x="498" y="768">Compatible-cover filter</text>
  <text class="mono" x="498" y="806">matched = active ∩ support(edge)</text>
  <text class="mono" x="498" y="836">active = matched  if matched ≠ ∅</text>
  <text class="body" x="498" y="876">No match never empties the state space</text>
  <text class="body" x="498" y="905">SCC-internal edges preserve the set</text>

  <path class="edge" d="M874 838 H946"/>
  <rect x="952" y="733" width="414" height="210" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text class="label" x="976" y="768">Deterministic path-cover score</text>
  <text class="mono" x="976" y="808">0.40 support</text>
  <text class="mono" x="976" y="838">+ 0.45 uncovered suffix</text>
  <text class="mono" x="976" y="868">+ 0.15 current novelty</text>
  <text class="body" x="976" y="906">Argmax · identity tie-break · 0 RNG</text>

  <path class="edge" d="M1366 838 H1438"/>
  <rect x="1444" y="733" width="284" height="210" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text class="label" x="1468" y="768">Frontier claim</text>
  <text class="body" x="1468" y="806">exactly one attempt</text>
  <text class="body" x="1468" y="836">generation CAS</text>
  <text class="body" x="1468" y="866">lease-token fencing</text>
  <text class="body" x="1468" y="896">success/failure feedback</text>
  <text class="small" x="1468" y="925">No plan =&gt; BFS fallback</text>

  <rect x="70" y="987" width="1658" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="small" x="94" y="1019">Correctness boundary: scheduling only · no SAT/UNSAT inference · no state deletion · no AFL bitmap write · no public-target coverage or speedup claim</text>
</svg>
