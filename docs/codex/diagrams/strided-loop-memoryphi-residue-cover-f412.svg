<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">F412 strided loop MemoryPhi residue-class lane cover</title>
  <desc id="desc">A four-stage schematic showing the canonical loop, reachable writer residue classes, proof-carrying lane witnesses, and runtime byte bitmap validation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #cbd5e1; }
      .section { font: 700 20px Arial, sans-serif; fill: #172033; }
      .body { font: 400 15px Arial, sans-serif; fill: #334155; }
      .small { font: 600 13px Arial, sans-serif; fill: #475569; }
      .mono { font: 600 14px 'DejaVu Sans Mono', monospace; fill: #172033; }
      .white { fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f3f6f8"/>
  <rect width="1440" height="132" fill="#172033"/>
  <rect x="0" y="126" width="1440" height="6" fill="#14b8a6"/>
  <text class="title" x="64" y="58">F412  Strided MemoryPhi Residue-Class Cover</text>
  <text class="subtitle" x="64" y="94">Static potential-writer proof, dynamic byte-definedness authority</text>
  <rect x="1180" y="35" width="196" height="54" rx="6" fill="#f59e0b"/>
  <text x="1278" y="57" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#172033">PROOF-CARRYING</text>
  <text x="1278" y="77" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#172033">FAIL-CLOSED</text>

  <rect class="panel" x="48" y="174" width="304" height="596" rx="6"/>
  <rect x="48" y="174" width="304" height="58" rx="6" fill="#dbeafe"/>
  <text class="section" x="72" y="210">1. Canonical loop</text>
  <text class="mono" x="76" y="273">iv = phi(0, next)</text>
  <text class="mono" x="76" y="309">guard: iv &lt;u bound</text>
  <text class="mono" x="76" y="345">store W bytes at</text>
  <text class="mono" x="76" y="369">base + scale * iv</text>
  <text class="mono" x="76" y="405">next = iv + step</text>
  <path d="M108 455 H292 V616 H108 Z" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="133" y="477" width="134" height="42" rx="4" fill="#ffffff" stroke="#6366f1"/>
  <text class="small" x="200" y="503" text-anchor="middle">MemoryPhi</text>
  <rect x="84" y="553" width="108" height="42" rx="4" fill="#ffffff" stroke="#64748b"/>
  <text class="small" x="138" y="579" text-anchor="middle">liveOnEntry</text>
  <rect x="208" y="553" width="108" height="42" rx="4" fill="#ffffff" stroke="#0f766e"/>
  <text class="small" x="262" y="579" text-anchor="middle">writer Def</text>
  <path d="M138 553 L174 519" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M262 553 L226 519" stroke="#0f766e" stroke-width="2" fill="none"/>
  <path d="M292 616 C330 616 330 455 292 455" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text class="body" x="76" y="677">Required: one preheader, latch,</text>
  <text class="body" x="76" y="700">exit, writer MemoryDef, no extra</text>
  <text class="body" x="76" y="723">memory effect, and no wrap.</text>

  <path class="arrow" d="M368 470 H414"/>

  <rect class="panel" x="430" y="174" width="360" height="596" rx="6"/>
  <rect x="430" y="174" width="360" height="58" rx="6" fill="#ccfbf1"/>
  <text class="section" x="454" y="210">2. Reachable writer classes</text>
  <text class="mono" x="458" y="267">step = 2, scale = 1, W = 2</text>
  <text class="body" x="458" y="296">All aliases are retained; recurrence filters</text>
  <text class="body" x="458" y="318">the reachable subset by iv mod step.</text>

  <text class="small" x="458" y="365">Object byte lanes</text>
  <g transform="translate(458 384)">
    <rect x="0" y="0" width="38" height="50" fill="#0f766e" stroke="#ffffff"/>
    <rect x="38" y="0" width="38" height="50" fill="#14b8a6" stroke="#ffffff"/>
    <rect x="76" y="0" width="38" height="50" fill="#0f766e" stroke="#ffffff"/>
    <rect x="114" y="0" width="38" height="50" fill="#14b8a6" stroke="#ffffff"/>
    <rect x="152" y="0" width="38" height="50" fill="#0f766e" stroke="#ffffff"/>
    <rect x="190" y="0" width="38" height="50" fill="#14b8a6" stroke="#ffffff"/>
    <rect x="228" y="0" width="38" height="50" fill="#0f766e" stroke="#ffffff"/>
    <rect x="266" y="0" width="38" height="50" fill="#14b8a6" stroke="#ffffff"/>
    <g class="white" font-family="Arial" font-size="14" font-weight="700" text-anchor="middle">
      <text x="19" y="31">0</text><text x="57" y="31">1</text>
      <text x="95" y="31">2</text><text x="133" y="31">3</text>
      <text x="171" y="31">4</text><text x="209" y="31">5</text>
      <text x="247" y="31">6</text><text x="285" y="31">7</text>
    </g>
  </g>
  <g font-family="Arial" font-size="13" fill="#334155" text-anchor="middle">
    <text x="496" y="458">iv=0</text>
    <text x="572" y="458">iv=2</text>
    <text x="648" y="458">iv=4</text>
    <text x="724" y="458">iv=6</text>
  </g>
  <path d="M477 469 H515 M553 469 H591 M629 469 H667 M705 469 H743" stroke="#f59e0b" stroke-width="5"/>
  <text class="mono" x="458" y="518">address_stride = step * scale</text>
  <text class="mono" x="458" y="548">covered residues = [0, W)</text>
  <rect x="458" y="584" width="304" height="118" rx="5" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text class="small" x="478" y="613">Admission invariants</text>
  <text class="body" x="478" y="640">W &lt;= address_stride (no overlap)</text>
  <text class="body" x="478" y="664">bound max &lt;= 2^bits - step (no wrap)</text>
  <text class="body" x="478" y="688">every requested lane has one owner</text>

  <path class="arrow" d="M806 470 H852"/>

  <rect class="panel" x="868" y="174" width="524" height="280" rx="6"/>
  <rect x="868" y="174" width="524" height="58" rx="6" fill="#fef3c7"/>
  <text class="section" x="892" y="210">3. Proof-carrying v2 witness</text>
  <text class="mono" x="896" y="267">load byte 3  -&gt;  writer start 2</text>
  <text class="mono" x="896" y="300">writer_lane = 1, induction = 2</text>
  <path d="M902 334 H1352" stroke="#cbd5e1" stroke-width="2"/>
  <text class="body" x="896" y="363">Consumer independently replays:</text>
  <text class="body" x="916" y="390">CFG + PHI edge copies + guard + recurrence</text>
  <text class="body" x="916" y="416">pointer_offset + alias domain + residue map</text>

  <path class="arrow" d="M1130 470 V516"/>

  <rect class="panel" x="868" y="532" width="524" height="238" rx="6"/>
  <rect x="868" y="532" width="524" height="58" rx="6" fill="#fee2e2"/>
  <text class="section" x="892" y="568">4. Runtime remains authoritative</text>
  <g transform="translate(900 620)">
    <rect x="0" y="0" width="46" height="46" fill="#16a34a" stroke="#ffffff"/>
    <rect x="46" y="0" width="46" height="46" fill="#16a34a" stroke="#ffffff"/>
    <rect x="92" y="0" width="46" height="46" fill="#16a34a" stroke="#ffffff"/>
    <rect x="138" y="0" width="46" height="46" fill="#16a34a" stroke="#ffffff"/>
    <rect x="184" y="0" width="46" height="46" fill="#e2e8f0" stroke="#ffffff"/>
    <rect x="230" y="0" width="46" height="46" fill="#e2e8f0" stroke="#ffffff"/>
    <rect x="276" y="0" width="46" height="46" fill="#e2e8f0" stroke="#ffffff"/>
    <rect x="322" y="0" width="46" height="46" fill="#e2e8f0" stroke="#ffffff"/>
    <g font-family="Arial" font-size="14" font-weight="700" text-anchor="middle">
      <text x="23" y="29" fill="#fff">1</text><text x="69" y="29" fill="#fff">1</text>
      <text x="115" y="29" fill="#fff">1</text><text x="161" y="29" fill="#fff">1</text>
      <text x="207" y="29" fill="#64748b">0</text><text x="253" y="29" fill="#64748b">0</text>
      <text x="299" y="29" fill="#64748b">0</text><text x="345" y="29" fill="#64748b">0</text>
    </g>
  </g>
  <text class="body" x="900" y="704">count = 4 initializes bytes [0,4); later lanes stay false.</text>
  <text class="body" x="900" y="730">A static witness never turns an unwritten byte into initialized.</text>

  <rect x="48" y="808" width="1344" height="54" rx="6" fill="#172033"/>
  <text x="720" y="842" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#f8fafc">Potential cover is static.  Actual initializedness is path-local.  Unsupported shapes fail closed.</text>
</svg>
