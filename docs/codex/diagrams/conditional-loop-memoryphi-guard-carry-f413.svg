<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">F413 conditional loop MemoryPhi guard-carry certificate</title>
  <desc id="desc">Four-panel schematic showing the canonical conditional loop CFG, nested MemoryPhi equations, guarded byte-lane witnesses, and runtime bitmap authority.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#087f8c"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Inter, Arial, sans-serif; fill: #526077; }
      .panel-title { font: 700 20px Inter, Arial, sans-serif; fill: #172033; }
      .panel-kicker { font: 700 12px Inter, Arial, sans-serif; fill: #087f8c; }
      .node-title { font: 700 15px Inter, Arial, sans-serif; fill: #172033; }
      .node-copy { font: 400 13px Inter, Arial, sans-serif; fill: #526077; }
      .small { font: 500 12px Inter, Arial, sans-serif; fill: #526077; }
      .mono { font: 600 13px "DejaVu Sans Mono", monospace; fill: #172033; }
      .formula { font: 600 16px "DejaVu Sans Mono", monospace; fill: #172033; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-teal { fill: none; stroke: #087f8c; stroke-width: 2.5; marker-end: url(#arrowTeal); }
      .edge-dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f7f9fc"/>
  <rect x="48" y="42" width="8" height="76" fill="#087f8c"/>
  <text class="title" x="76" y="76">F413  Conditional Loop MemoryPhi Guard Carry</text>
  <text class="subtitle" x="76" y="107">Static potential provenance + exact branch polarity + path-local byte initialization</text>
  <rect x="1135" y="54" width="252" height="44" rx="6" fill="#172033"/>
  <text x="1261" y="82" text-anchor="middle" style="font:700 14px Inter,Arial,sans-serif;fill:#ffffff">PROOF-CARRYING v3</text>

  <!-- Panel 1: CFG -->
  <rect x="48" y="146" width="655" height="436" rx="8" fill="#ffffff" stroke="#d6deea" stroke-width="1.5"/>
  <text class="panel-kicker" x="76" y="177">01 / CANONICAL CONTROL FLOW</text>
  <text class="panel-title" x="76" y="205">One decision, two exclusive arms, one latch</text>

  <rect x="292" y="226" width="168" height="48" rx="6" fill="#e9f5f5" stroke="#087f8c" stroke-width="2"/>
  <text class="node-title" x="376" y="247" text-anchor="middle">header</text>
  <text class="small" x="376" y="265" text-anchor="middle">iv &lt; bound ?</text>

  <rect x="292" y="312" width="168" height="58" rx="6" fill="#fff6dc" stroke="#d6a419" stroke-width="2"/>
  <text class="node-title" x="376" y="335" text-anchor="middle">decision</text>
  <text class="small" x="376" y="355" text-anchor="middle">g = icmp(left, right)</text>

  <rect x="100" y="416" width="170" height="66" rx="6" fill="#e8f5ed" stroke="#27864d" stroke-width="2"/>
  <text class="node-title" x="185" y="441" text-anchor="middle">writer arm</text>
  <text class="small" x="185" y="462" text-anchor="middle">MemoryDef: store</text>

  <rect x="482" y="416" width="170" height="66" rx="6" fill="#f1f4f8" stroke="#64748b" stroke-width="2"/>
  <text class="node-title" x="567" y="441" text-anchor="middle">skip arm</text>
  <text class="small" x="567" y="462" text-anchor="middle">carry header memory</text>

  <rect x="292" y="516" width="168" height="46" rx="6" fill="#eef0fb" stroke="#5965a8" stroke-width="2"/>
  <text class="node-title" x="376" y="544" text-anchor="middle">latch / iv += step</text>

  <rect x="520" y="226" width="132" height="48" rx="6" fill="#fcecea" stroke="#c6534b" stroke-width="2"/>
  <text class="node-title" x="586" y="255" text-anchor="middle">exit + load</text>

  <path class="edge" d="M376 274 L376 311"/>
  <path class="edge-teal" d="M313 370 C270 390,230 399,203 415"/>
  <path class="edge" d="M439 370 C482 390,522 399,549 415"/>
  <path class="edge" d="M185 482 C213 510,255 527,291 536"/>
  <path class="edge" d="M567 482 C539 510,497 527,461 536"/>
  <path class="edge-dash" d="M292 539 C241 532,220 296,291 252"/>
  <path class="edge" d="M460 250 L519 250"/>
  <text class="small" x="227" y="399">g = writer_when</text>
  <text class="small" x="492" y="399">g != writer_when</text>
  <text class="small" x="474" y="239">loop false</text>
  <text class="small" x="225" y="506">MemoryDef</text>
  <text class="small" x="492" y="506">pass-through</text>

  <!-- Panel 2: MemorySSA -->
  <rect x="737" y="146" width="655" height="206" rx="8" fill="#ffffff" stroke="#d6deea" stroke-width="1.5"/>
  <text class="panel-kicker" x="765" y="177">02 / NESTED MEMORY VERSION</text>
  <text class="panel-title" x="765" y="205">MemoryPhi is may-reach, never must-initialize</text>
  <rect x="765" y="226" width="286" height="84" rx="6" fill="#e9f5f5" stroke="#087f8c" stroke-width="1.5"/>
  <text class="formula" x="787" y="255">H = phi(liveOnEntry, L)</text>
  <text class="node-copy" x="787" y="280">Header selects entry or prior latch state.</text>
  <rect x="1071" y="226" width="293" height="84" rx="6" fill="#eef0fb" stroke="#5965a8" stroke-width="1.5"/>
  <text class="formula" x="1093" y="255">L = phi(W(H), H)</text>
  <text class="node-copy" x="1093" y="280">Writer and skip are alternative edges.</text>
  <path class="edge-teal" d="M1051 268 L1070 268"/>
  <text class="small" x="1061" y="324" text-anchor="middle">No ordinal composition across arms</text>

  <!-- Panel 3: witness -->
  <rect x="737" y="376" width="655" height="206" rx="8" fill="#ffffff" stroke="#d6deea" stroke-width="1.5"/>
  <text class="panel-kicker" x="765" y="407">03 / GUARDED BYTE-LANE WITNESS</text>
  <text class="panel-title" x="765" y="435">Every lane names an address owner and its path condition</text>
  <rect x="765" y="458" width="599" height="82" rx="6" fill="#fffaf0" stroke="#d6a419" stroke-width="1.5"/>
  <text class="formula" x="792" y="488">(a, lane) -&gt; (writer_start, writer_lane, iv)</text>
  <text class="formula" x="792" y="518">required: writer_guard == writer_when</text>
  <rect x="1134" y="552" width="230" height="22" rx="4" fill="#e8f5ed"/>
  <text x="1249" y="568" text-anchor="middle" style="font:700 11px Inter,Arial,sans-serif;fill:#27864d">TRUE AND FALSE EDGES SUPPORTED</text>

  <!-- Bottom runtime flow -->
  <rect x="48" y="618" width="1344" height="234" rx="8" fill="#172033"/>
  <text x="76" y="652" style="font:700 12px Inter,Arial,sans-serif;fill:#71d5d8">04 / RUNTIME AUTHORITY</text>
  <text x="76" y="682" style="font:700 20px Inter,Arial,sans-serif;fill:#ffffff">Certificate identifies a possible writer; execution decides whether bytes exist</text>

  <rect x="76" y="712" width="254" height="94" rx="6" fill="#25324a" stroke="#64748b"/>
  <text x="203" y="739" text-anchor="middle" style="font:700 15px Inter,Arial,sans-serif;fill:#ffffff">Evaluate actual branch</text>
  <text x="203" y="765" text-anchor="middle" style="font:500 13px Inter,Arial,sans-serif;fill:#c9d3e2">g == writer_when ?</text>
  <text x="203" y="787" text-anchor="middle" style="font:500 12px Inter,Arial,sans-serif;fill:#8fa0b8">current state, current iteration</text>

  <rect x="418" y="704" width="294" height="48" rx="6" fill="#214b3b" stroke="#5dbd82"/>
  <text x="565" y="724" text-anchor="middle" style="font:700 14px Inter,Arial,sans-serif;fill:#ffffff">Writer edge executes</text>
  <text x="565" y="744" text-anchor="middle" style="font:600 12px 'DejaVu Sans Mono',monospace;fill:#b8efd0">I[writer bytes] := true</text>

  <rect x="418" y="766" width="294" height="48" rx="6" fill="#493a2a" stroke="#d6a419"/>
  <text x="565" y="786" text-anchor="middle" style="font:700 14px Inter,Arial,sans-serif;fill:#ffffff">Skip / zero-trip / short prefix</text>
  <text x="565" y="806" text-anchor="middle" style="font:600 12px 'DejaVu Sans Mono',monospace;fill:#f6dc93">I remains unchanged</text>

  <rect x="1018" y="712" width="346" height="94" rx="6" fill="#4a2e35" stroke="#db7b75"/>
  <text x="1191" y="739" text-anchor="middle" style="font:700 15px Inter,Arial,sans-serif;fill:#ffffff">Load checks every requested lane</text>
  <text x="1191" y="765" text-anchor="middle" style="font:600 13px 'DejaVu Sans Mono',monospace;fill:#ffd0cc">all I[a + lane] == true</text>
  <text x="1191" y="787" text-anchor="middle" style="font:500 12px Inter,Arial,sans-serif;fill:#e6b4b0">otherwise the state is infeasible</text>

  <path d="M330 749 C360 728,380 724,417 728" fill="none" stroke="#71d5d8" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <path d="M330 775 C360 796,380 798,417 790" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M712 728 C820 728,900 742,1017 750" fill="none" stroke="#71d5d8" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <path d="M712 790 C820 790,900 777,1017 769" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="367" y="718" text-anchor="middle" style="font:700 11px Inter,Arial,sans-serif;fill:#71d5d8">TRUE</text>
  <text x="367" y="817" text-anchor="middle" style="font:700 11px Inter,Arial,sans-serif;fill:#a9b5c7">FALSE</text>

  <text x="48" y="882" style="font:500 12px Inter,Arial,sans-serif;fill:#65748a">Supported: exact 5-block, single-latch, one integer-icmp guard, one writer. Multi-latch SCC continuation: F414.</text>
</svg>
