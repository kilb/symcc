<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620" role="img" aria-labelledby="title desc">
  <title id="title">F308 Directed Edge-Utility Replay Scheduler</title>
  <desc id="desc">A schematic showing branch trace observations converted into edge rows, target branch queues, utility scoring, and targeted replay jobs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .band { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .score { fill: #fef9c3; stroke: #ca8a04; stroke-width: 2; filter: url(#shadow); }
      .state { fill: #ecfdf5; stroke: #059669; stroke-width: 2; filter: url(#shadow); }
      .worker { fill: #f1f5f9; stroke: #475569; stroke-width: 2; filter: url(#shadow); }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .small { font: 16px Arial, sans-serif; fill: #334155; }
      .tiny { font: 14px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #059669; stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1320" height="620"/>
  <rect class="band" x="34" y="34" width="1252" height="92" rx="10"/>
  <text class="title" x="62" y="82">F308 Directed Edge-Utility Replay Scheduler</text>
  <text class="small" x="62" y="110">Seed-level replay is refined into branch-targeted work using local edge-dependence, directed distance, reward/cost feedback, and terminal-failure memory.</text>

  <rect class="box" x="54" y="188" width="192" height="126" rx="10"/>
  <text class="label" x="82" y="226">Solver Telemetry</text>
  <text class="small" x="82" y="258">branch_trace</text>
  <text class="tiny" x="82" y="284">(actual, opposite,</text>
  <text class="tiny" x="82" y="304">site, taken)</text>

  <rect class="box" x="306" y="188" width="194" height="126" rx="10"/>
  <text class="label" x="336" y="226">Edge Rows</text>
  <text class="small" x="336" y="258">hash(site,taken)</text>
  <text class="tiny" x="336" y="284">co-occurrence cells</text>
  <text class="tiny" x="336" y="304">local corpus paths</text>

  <rect class="state" x="560" y="188" width="200" height="126" rx="10"/>
  <text class="label" x="590" y="226">Target Queue</text>
  <text class="small" x="590" y="258">opposite branch IDs</text>
  <text class="tiny" x="590" y="284">round-robin cursor</text>
  <text class="tiny" x="590" y="304">SAT/UNSAT retire</text>

  <rect class="score" x="820" y="170" width="232" height="162" rx="10"/>
  <text class="label" x="850" y="212">Utility Ranking</text>
  <text class="small" x="850" y="244">distance(site)</text>
  <text class="small" x="850" y="270">reward_ema / cost</text>
  <text class="small" x="850" y="296">novel cells + age</text>
  <text class="tiny" x="850" y="318">minus terminal failures</text>

  <rect class="box" x="1110" y="188" width="164" height="126" rx="10"/>
  <text class="label" x="1138" y="226">ReplayJob</text>
  <text class="small" x="1138" y="258">path</text>
  <text class="small" x="1138" y="284">target_branch</text>

  <path class="arrow" d="M 246 251 L 296 251"/>
  <path class="arrow" d="M 500 251 L 550 251"/>
  <path class="arrow" d="M 760 251 L 810 251"/>
  <path class="arrow" d="M 1052 251 L 1100 251"/>

  <rect class="worker" x="422" y="412" width="478" height="112" rx="10"/>
  <text class="label" x="450" y="452">Worker Execution Loop</text>
  <text class="small" x="450" y="484">select_strategy(target_branch) -> targeted concolic run -> new telemetry</text>
  <text class="tiny" x="450" y="510">normal corpus admission is still decided by AFL edge/data coverage oracles.</text>
  <path class="dashed" d="M 1192 314 C 1192 410 1030 468 910 468"/>
  <path class="dashed" d="M 422 468 C 250 468 150 402 150 324"/>

  <rect class="state" x="54" y="412" width="270" height="112" rx="10"/>
  <text class="label" x="82" y="452">Persistent State</text>
  <text class="small" x="82" y="484">snapshot schema 13</text>
  <text class="tiny" x="82" y="510">targets, reward, cost, failures</text>

  <path class="dashed" d="M 660 314 L 660 392"/>
  <path class="dashed" d="M 560 468 L 334 468"/>
</svg>
