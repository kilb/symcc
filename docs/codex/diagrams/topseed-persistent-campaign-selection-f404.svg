<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <marker id="feedback" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      text { font-family: "WenQuanYi Zen Hei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; letter-spacing: 0; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .lane { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .inverted { fill: #ffffff; }
      .subinverted { fill: #cbd5e1; }
      .head { font-size: 22px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #475569; }
      .metric { font-size: 17px; font-weight: 700; }
      .box { stroke-width: 2; filter: url(#shadow); }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #0f766e; stroke-width: 3.5; marker-end: url(#feedback); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1920" height="118" fill="#172033"/>
  <text x="64" y="56" class="title inverted">F404 · TopSeed 式持久化跨运行种子选择</text>
  <text x="64" y="91" class="subtitle subinverted">AFL 特征分组 → Explore / Exploit → 事务派发 → retained-output 学习；不替代求解器与覆盖准入</text>

  <rect x="38" y="145" width="40" height="570" fill="#2563eb" rx="5"/>
  <text class="lane" transform="translate(65 630) rotate(-90)">提议平面 · 可学习但不可信</text>
  <rect x="38" y="744" width="40" height="270" fill="#0f766e" rx="5"/>
  <text class="lane" transform="translate(65 972) rotate(-90)">正确性平面</text>

  <g>
    <rect class="box" x="112" y="158" width="320" height="234" rx="8" fill="#ffffff" stroke="#2563eb"/>
    <rect x="112" y="158" width="320" height="48" rx="8" fill="#dbeafe"/>
    <text x="136" y="190" class="head">1 · 候选输入画像</text>
    <text x="136" y="235" class="body">内容 SHA-256 + 稳定对象路径</text>
    <text x="136" y="268" class="body">有界 afl-showmap 冷画像</text>
    <text x="136" y="301" class="small">bucket-bit = (map_index × 8) + bit</text>
    <text x="136" y="334" class="body">相同特征集合形成 exact group</text>
    <text x="136" y="369" class="small">空画像 / 超限 / I/O 失败：保持原调度顺序</text>
  </g>

  <path class="arrow" d="M432 275 H505"/>

  <g>
    <rect class="box" x="505" y="145" width="520" height="296" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <rect x="505" y="145" width="520" height="50" rx="8" fill="#ede9fe"/>
    <text x="531" y="178" class="head">2A · Explore（默认概率 0.75）</text>
    <text x="531" y="224" class="body">组特征 π(G)：</text>
    <text x="557" y="257" class="body">① coverage　② Σ 1 / branch-frequency</text>
    <text x="557" y="290" class="body">③ 新颖性　④ bug proxy　⑤ group size</text>
    <rect x="531" y="312" width="468" height="48" rx="5" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="551" y="343" class="metric">Score(G,w) = π(G) · w</text>
    <text x="531" y="395" class="body">组内策略：unique / long / short / random</text>
    <text x="531" y="424" class="small">仅考虑尚未使用的 exact coverage group</text>
  </g>

  <g>
    <rect class="box" x="505" y="474" width="520" height="226" rx="8" fill="#ffffff" stroke="#d97706"/>
    <rect x="505" y="474" width="520" height="50" rx="8" fill="#ffedd5"/>
    <text x="531" y="507" class="head">2B · Exploit（默认概率 0.25）</text>
    <text x="531" y="554" class="body">复用已有运行反馈的候选</text>
    <text x="531" y="589" class="body">reward(seed) = Σ 1 / generated-feature-frequency</text>
    <text x="531" y="624" class="body">全局最优一维 k=2 划分，选择高分簇</text>
    <text x="531" y="661" class="small">同一组内仍复用四种 path-condition 策略</text>
  </g>

  <path class="arrow" d="M1025 292 H1094"/>
  <path class="arrow" d="M1025 585 H1060 Q1094 585 1094 551 V370"/>

  <g>
    <rect class="box" x="1094" y="182" width="300" height="232" rx="8" fill="#ffffff" stroke="#dc2626"/>
    <rect x="1094" y="182" width="300" height="50" rx="8" fill="#fee2e2"/>
    <text x="1120" y="215" class="head">3 · Proposal</text>
    <text x="1120" y="263" class="body">稳定 RNG 采样 mode / policy / w</text>
    <text x="1120" y="298" class="body">生成 run token，但不更新学习历史</text>
    <text x="1120" y="333" class="body">MPI send 失败或准入拒绝：discard</text>
    <text x="1120" y="373" class="small">边界：先提议，派发成功后才 commit</text>
  </g>

  <path class="arrow" d="M1394 297 H1450"/>

  <g>
    <rect class="box" x="1450" y="145" width="400" height="304" rx="8" fill="#ffffff" stroke="#0f766e"/>
    <rect x="1450" y="145" width="400" height="50" rx="8" fill="#ccfbf1"/>
    <text x="1476" y="178" class="head">4 · Fenced MPI 执行</text>
    <text x="1476" y="225" class="body">send 成功 → commit(candidate, token)</text>
    <text x="1476" y="260" class="body">worker concolic run + streaming showmap</text>
    <text x="1476" y="295" class="body">只回传预算内、worker 保留的输出</text>
    <text x="1476" y="330" class="body">lease / worker-rank / run-token 关联结果</text>
    <text x="1476" y="365" class="body">超时、stale、重启孤儿 → failed outcome</text>
    <rect x="1476" y="386" width="348" height="38" rx="5" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="1494" y="411" class="small">晚到或重复结果不能二次学习</text>
  </g>

  <path class="flow" d="M1650 449 V570 Q1650 605 1615 605 H1125"/>

  <g>
    <rect class="box" x="1094" y="510" width="540" height="190" rx="8" fill="#ffffff" stroke="#0f766e"/>
    <rect x="1094" y="510" width="540" height="50" rx="8" fill="#ccfbf1"/>
    <text x="1120" y="543" class="head">5 · Observe / Learn（默认每 20 次）</text>
    <text x="1120" y="591" class="body">聚合 retained outputs 的 AFL bucket-bit union</text>
    <text x="1120" y="626" class="body">更新候选 generated coverage 与 path-condition proxy</text>
    <text x="1120" y="661" class="body">高/低簇 → 截断正态权重；四策略齐备后更新概率</text>
    <path class="flow" d="M1094 676 H1054 Q1038 676 1038 660 V604 H1025"/>
  </g>

  <g>
    <rect class="box" x="112" y="760" width="520" height="230" rx="8" fill="#ffffff" stroke="#0f766e"/>
    <rect x="112" y="760" width="520" height="50" rx="8" fill="#ccfbf1"/>
    <text x="138" y="793" class="head">持久化与恢复合同</text>
    <text x="138" y="839" class="body">program context = SHA-256(target argv</text>
    <text x="138" y="870" class="body">+ executable identity)</text>
    <text x="138" y="901" class="body">canonical JSON + SplitMix64；唯一临时文件</text>
    <text x="138" y="932" class="body">fsync + atomic replace；load 使用 O_NOFOLLOW</text>
    <text x="138" y="963" class="small">上下文漂移 / 损坏：重置；未完成 run：失败退休</text>
  </g>

  <path class="dash" d="M632 875 H740"/>

  <g>
    <rect class="box" x="740" y="760" width="1110" height="230" rx="8" fill="#ffffff" stroke="#334155"/>
    <rect x="740" y="760" width="1110" height="50" rx="8" fill="#e2e8f0"/>
    <text x="766" y="793" class="head">不变量：TopSeed 只决定“先尝试哪个输入”</text>
    <text x="766" y="841" class="body">AFL corpus novelty bitmap</text>
    <text x="1045" y="841" class="body">继续决定是否进入 queue</text>
    <text x="766" y="878" class="body">QSYM / solver 约束与 concrete replay</text>
    <text x="1105" y="878" class="body">继续决定可满足性与结果正确性</text>
    <text x="766" y="915" class="body">失败开放</text>
    <text x="1045" y="915" class="body">画像、学习、快照失败不删除普通调度候选</text>
    <rect x="766" y="940" width="1058" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="787" y="961" class="small">机制实验 ≠ 公共 benchmark：无端到端覆盖率、solver throughput、bug-yield 或总体加速声明</text>
  </g>

  <path class="dash" d="M1340 700 V744"/>
</svg>
