<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">F447 cross-node elastic ULFM architecture</title>
  <desc id="desc">Two compute nodes share a global recovery communicator, generation-scoped master-worker groups, and a durable transactional data plane.</desc>
  <defs>
    <style>
      .bg { fill:#f7f9fc; }
      .panel { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; }
      .node { fill:#eef6ff; stroke:#2f6f9f; stroke-width:2; }
      .rank { fill:#ffffff; stroke:#6d8ca4; stroke-width:1.5; }
      .master { fill:#d9ecff; stroke:#1f6ea5; stroke-width:2; }
      .worker { fill:#e9f7ee; stroke:#43805a; stroke-width:1.5; }
      .spare { fill:#fff3d7; stroke:#a56b19; stroke-width:1.5; stroke-dasharray:7 5; }
      .recovery { fill:#e8f1ff; stroke:#315f96; stroke-width:2; }
      .durable { fill:#fff8e8; stroke:#9b7227; stroke-width:2; }
      .commit { fill:#eaf8f3; stroke:#28735b; stroke-width:2; }
      .failure { fill:#fff0f0; stroke:#b44a4a; stroke-width:2; }
      .title { font:700 30px "WenQuanYi Zen Hei", "Microsoft YaHei", Arial, sans-serif; fill:#172033; }
      .section { font:700 21px "WenQuanYi Zen Hei", "Microsoft YaHei", Arial, sans-serif; fill:#26364d; }
      .label { font:600 17px "WenQuanYi Zen Hei", "Microsoft YaHei", Arial, sans-serif; fill:#26364d; }
      .small { font:400 14px "WenQuanYi Zen Hei", "Microsoft YaHei", Arial, sans-serif; fill:#48566a; }
      .tiny { font:400 12px "WenQuanYi Zen Hei", "Microsoft YaHei", Arial, sans-serif; fill:#536174; }
      .step { font:700 15px "WenQuanYi Zen Hei", "Microsoft YaHei", Arial, sans-serif; fill:#ffffff; }
      .flow { fill:none; stroke:#316b94; stroke-width:3; marker-end:url(#arrow-blue); }
      .data { fill:none; stroke:#2d785d; stroke-width:3; marker-end:url(#arrow-green); }
      .write { fill:none; stroke:#a06f22; stroke-width:3; marker-end:url(#arrow-gold); }
      .fault { fill:none; stroke:#b44a4a; stroke-width:3; stroke-dasharray:8 6; marker-end:url(#arrow-red); }
      .thin { fill:none; stroke:#718096; stroke-width:2; marker-end:url(#arrow-gray); }
    </style>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#316b94"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2d785d"/></marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#a06f22"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b44a4a"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#718096"/></marker>
  </defs>

  <rect class="bg" width="1600" height="1040"/>
  <text class="title" x="60" y="54">F447 跨节点弹性并行符号执行架构</text>
  <text class="small" x="60" y="82">稳定 endpoint 身份 + 每代 communicator 重建 + 可重放持久事务</text>

  <text class="section" x="60" y="126">计算与通信平面</text>
  <rect class="panel" x="40" y="142" width="1520" height="470" rx="8"/>

  <rect class="node" x="70" y="170" width="610" height="196" rx="8"/>
  <text class="section" x="96" y="204">节点 A · cuda-ke</text>
  <text class="small" x="96" y="229">全局 communicator 的本地成员</text>
  <rect class="master" x="100" y="253" width="150" height="82" rx="6"/>
  <text class="label" x="175" y="283" text-anchor="middle">Master 0</text>
  <text class="tiny" x="175" y="307" text-anchor="middle">稳定 endpoint</text>
  <rect class="worker" x="274" y="253" width="112" height="82" rx="6"/>
  <text class="label" x="330" y="283" text-anchor="middle">Worker</text>
  <text class="tiny" x="330" y="307" text-anchor="middle">active endpoint</text>
  <rect class="worker" x="410" y="253" width="112" height="82" rx="6"/>
  <text class="label" x="466" y="283" text-anchor="middle">Worker</text>
  <text class="tiny" x="466" y="307" text-anchor="middle">active endpoint</text>
  <rect class="spare" x="546" y="253" width="104" height="82" rx="6"/>
  <text class="label" x="598" y="283" text-anchor="middle">Spare</text>
  <text class="tiny" x="598" y="307" text-anchor="middle">warm endpoint</text>

  <rect class="node" x="920" y="170" width="610" height="196" rx="8"/>
  <text class="section" x="946" y="204">节点 B · f447-vultr</text>
  <text class="small" x="946" y="229">跨主机 survivor 与备用进程（角色为示意）</text>
  <rect class="master" x="950" y="253" width="150" height="82" rx="6"/>
  <text class="label" x="1025" y="283" text-anchor="middle">Master 1</text>
  <text class="tiny" x="1025" y="307" text-anchor="middle">稳定 endpoint</text>
  <rect class="worker" x="1124" y="253" width="112" height="82" rx="6"/>
  <text class="label" x="1180" y="283" text-anchor="middle">Worker</text>
  <text class="tiny" x="1180" y="307" text-anchor="middle">active endpoint</text>
  <rect class="spare" x="1260" y="253" width="104" height="82" rx="6"/>
  <text class="label" x="1312" y="283" text-anchor="middle">Spare</text>
  <text class="tiny" x="1312" y="307" text-anchor="middle">warm endpoint</text>
  <rect class="worker" x="1388" y="253" width="112" height="82" rx="6"/>
  <text class="label" x="1444" y="283" text-anchor="middle">Worker</text>
  <text class="tiny" x="1444" y="307" text-anchor="middle">survivor</text>

  <rect class="recovery" x="330" y="402" width="940" height="74" rx="8"/>
  <text class="label" x="800" y="432" text-anchor="middle">全局恢复 communicator · active + standby survivors</text>
  <text class="small" x="800" y="458" text-anchor="middle">Revoke / Shrink · 稳定身份 Iallgather · Agree · generation receipt</text>
  <path class="flow" d="M375 366 L490 402"/>
  <path class="flow" d="M1225 366 L1110 402"/>

  <rect class="panel" x="100" y="507" width="630" height="78" rx="7"/>
  <text class="label" x="415" y="538" text-anchor="middle">Generation g · Group 0</text>
  <text class="small" x="415" y="564" text-anchor="middle">Master 0 &lt;-&gt; READY / WORK / RESULT / STOP &lt;-&gt; 本组 workers</text>
  <rect class="panel" x="870" y="507" width="630" height="78" rx="7"/>
  <text class="label" x="1185" y="538" text-anchor="middle">Generation g · Group 1</text>
  <text class="small" x="1185" y="564" text-anchor="middle">Master 1 &lt;-&gt; READY / WORK / RESULT / STOP &lt;-&gt; 本组 workers</text>
  <path class="thin" d="M730 546 L870 546"/>
  <text class="tiny" x="800" y="534" text-anchor="middle">master comm</text>

  <text class="section" x="60" y="656">故障恢复次序</text>
  <rect class="panel" x="40" y="672" width="1520" height="126" rx="8"/>
  <rect class="failure" x="68" y="702" width="194" height="64" rx="7"/>
  <circle cx="91" cy="734" r="15" fill="#b44a4a"/><text class="step" x="91" y="739" text-anchor="middle">1</text>
  <text class="label" x="116" y="728">物理进程退出</text><text class="tiny" x="116" y="750">MPI 错误 / sentinel</text>
  <rect class="recovery" x="303" y="702" width="242" height="64" rx="7"/>
  <circle cx="326" cy="734" r="15" fill="#315f96"/><text class="step" x="326" y="739" text-anchor="middle">2</text>
  <text class="label" x="351" y="728">Revoke → Shrink</text><text class="tiny" x="351" y="750">先形成 survivor 集</text>
  <rect class="recovery" x="586" y="702" width="292" height="64" rx="7"/>
  <circle cx="609" cy="734" r="15" fill="#315f96"/><text class="step" x="609" y="739" text-anchor="middle">3</text>
  <text class="label" x="634" y="728">交换稳定 endpoint</text><text class="tiny" x="634" y="750">集合差得到一致 missing set</text>
  <rect class="durable" x="919" y="702" width="262" height="64" rx="7"/>
  <circle cx="942" cy="734" r="15" fill="#9b7227"/><text class="step" x="942" y="739" text-anchor="middle">4</text>
  <text class="label" x="967" y="728">持久 prepare / receipt</text><text class="tiny" x="967" y="750">generation g → g+1</text>
  <rect class="commit" x="1222" y="702" width="304" height="64" rx="7"/>
  <circle cx="1245" cy="734" r="15" fill="#28735b"/><text class="step" x="1245" y="739" text-anchor="middle">5</text>
  <text class="label" x="1270" y="728">晋升 spare 并重新 Split</text><text class="tiny" x="1270" y="750">新 group 恢复 WAL 后继续</text>
  <path class="fault" d="M262 734 L303 734"/><path class="flow" d="M545 734 L586 734"/><path class="flow" d="M878 734 L919 734"/><path class="flow" d="M1181 734 L1222 734"/>

  <text class="section" x="60" y="844">共享持久化与提交平面</text>
  <rect class="panel" x="40" y="860" width="1520" height="144" rx="8"/>
  <rect class="durable" x="70" y="892" width="250" height="80" rx="7"/>
  <text class="label" x="195" y="923" text-anchor="middle">全局成员快照</text>
  <text class="small" x="195" y="950" text-anchor="middle">generation · layout · receipt</text>
  <rect class="durable" x="370" y="892" width="270" height="80" rx="7"/>
  <text class="label" x="505" y="923" text-anchor="middle">分组 QueryStore</text>
  <text class="small" x="505" y="950" text-anchor="middle">master / generation 隔离</text>
  <rect class="durable" x="690" y="892" width="220" height="80" rx="7"/>
  <text class="label" x="800" y="923" text-anchor="middle">共享 Work WAL</text>
  <text class="small" x="800" y="950" text-anchor="middle">lease · commit manifest</text>
  <rect class="commit" x="960" y="892" width="240" height="80" rx="7"/>
  <text class="label" x="1080" y="923" text-anchor="middle">锁内提交事务</text>
  <text class="small" x="1080" y="950" text-anchor="middle">校验 → 发布 → done</text>
  <rect class="commit" x="1250" y="892" width="270" height="80" rx="7"/>
  <text class="label" x="1385" y="923" text-anchor="middle">公共内容寻址 Corpus</text>
  <text class="small" x="1385" y="950" text-anchor="middle">文件名 = SHA-256(content)</text>
  <path class="write" d="M320 932 L370 932"/><path class="write" d="M640 932 L690 932"/><path class="write" d="M910 932 L960 932"/><path class="data" d="M1200 932 L1250 932"/>
  <path class="write" d="M800 585 C800 720 800 790 800 892"/>
  <text class="tiny" x="817" y="834">所有 master 共享，旧 generation fence 被拒绝</text>
</svg>
