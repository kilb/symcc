<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1400" viewBox="0 0 1900 1400" role="img" aria-labelledby="title desc">
  <title id="title">F343 有界流式模拟变异</title>
  <desc id="desc">对比旧式整文件三份内存与新的预算预检、稳定源、固定窗口扇出、临时文件及原子发布机制，并展示八和三十二 MiB 的实测内存与耗时。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #14213d; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #52606d; }
      .panel-title { font: 700 26px Arial, sans-serif; fill: #14213d; }
      .box-title { font: 700 20px Arial, sans-serif; fill: #14213d; }
      .body { font: 400 17px Arial, sans-serif; fill: #334155; }
      .small { font: 400 15px Arial, sans-serif; fill: #52606d; }
      .metric { font: 700 27px Arial, sans-serif; fill: #14213d; }
      .metric-label { font: 600 16px Arial, sans-serif; fill: #52606d; }
      .badge { font: 700 15px Arial, sans-serif; }
      .axis { font: 400 14px Arial, sans-serif; fill: #64748b; }
      .line { stroke: #52606d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1900" height="1400" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1900" height="14" fill="#0f766e"/>
  <text x="70" y="78" class="title">F343  有界流式模拟变异</text>
  <text x="70" y="113" class="subtitle">相同 RNG 与逐字节结果，更低内存、更早拒绝、更清晰的失败边界</text>
  <rect x="1578" y="46" width="252" height="52" rx="8" fill="#dff4ef" stroke="#0f766e" stroke-width="2"/>
  <text x="1704" y="78" text-anchor="middle" class="badge" fill="#0f5f59">F00–F343 · I/T/E</text>

  <!-- Legacy panel -->
  <rect x="70" y="150" width="700" height="470" rx="8" fill="#ffffff" stroke="#ef9a9a" stroke-width="2"/>
  <rect x="70" y="150" width="700" height="58" rx="8" fill="#fff1f0"/>
  <rect x="70" y="200" width="700" height="8" fill="#fff1f0"/>
  <text x="102" y="187" class="panel-title">旧路径：整文件复制链</text>
  <rect x="594" y="166" width="142" height="30" rx="8" fill="#b42318"/>
  <text x="665" y="187" text-anchor="middle" class="badge" fill="#ffffff">峰值约 3B</text>

  <rect x="112" y="248" width="168" height="92" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="196" y="282" text-anchor="middle" class="box-title">input.read()</text>
  <text x="196" y="312" text-anchor="middle" class="body">bytes · B</text>
  <path d="M280 294 H340" class="line"/>

  <rect x="350" y="248" width="168" height="92" rx="8" fill="#fff1f0" stroke="#ef4444" stroke-width="2"/>
  <text x="434" y="282" text-anchor="middle" class="box-title">bytearray</text>
  <text x="434" y="312" text-anchor="middle" class="body">完整复制 · +B</text>
  <path d="M518 294 H578" class="line"/>

  <rect x="588" y="248" width="140" height="92" rx="8" fill="#fff1f0" stroke="#ef4444" stroke-width="2"/>
  <text x="658" y="282" text-anchor="middle" class="box-title">bytes()</text>
  <text x="658" y="312" text-anchor="middle" class="body">再复制 · +B</text>

  <path d="M196 340 V394 H658 V360" class="line"/>
  <rect x="112" y="410" width="616" height="74" rx="8" fill="#fff8f7" stroke="#f4b4ae"/>
  <text x="140" y="441" class="box-title">先落盘，后检查预算</text>
  <text x="140" y="468" class="body">N×B 已写完才由目录扫描拒绝；第 k 次失败会留下可见前缀</text>

  <rect x="112" y="510" width="188" height="78" rx="8" fill="#fef2f2"/>
  <text x="206" y="541" text-anchor="middle" class="metric">100.67 MB</text>
  <text x="206" y="568" text-anchor="middle" class="metric-label">32 MiB traced peak</text>
  <rect x="320" y="510" width="188" height="78" rx="8" fill="#fef2f2"/>
  <text x="414" y="541" text-anchor="middle" class="metric">133,868 KiB</text>
  <text x="414" y="568" text-anchor="middle" class="metric-label">32 MiB RSS median</text>
  <rect x="528" y="510" width="200" height="78" rx="8" fill="#fef2f2"/>
  <text x="628" y="541" text-anchor="middle" class="metric">138.96 ms</text>
  <text x="628" y="568" text-anchor="middle" class="metric-label">32 MiB elapsed</text>

  <!-- F343 panel -->
  <rect x="800" y="150" width="1030" height="470" rx="8" fill="#ffffff" stroke="#5bb8ae" stroke-width="2"/>
  <rect x="800" y="150" width="1030" height="58" rx="8" fill="#eaf7f4"/>
  <rect x="800" y="200" width="1030" height="8" fill="#eaf7f4"/>
  <text x="832" y="187" class="panel-title">F343：预算先行的固定窗口事务</text>
  <rect x="1623" y="166" width="173" height="30" rx="8" fill="#0f766e"/>
  <text x="1709" y="187" text-anchor="middle" class="badge" fill="#ffffff">O(C + N) heap</text>

  <rect x="842" y="244" width="176" height="96" rx="8" fill="#fffbeb" stroke="#eab308" stroke-width="2"/>
  <text x="930" y="277" text-anchor="middle" class="box-title">预算预检</text>
  <text x="930" y="305" text-anchor="middle" class="body">N ≤ Omax</text>
  <text x="930" y="330" text-anchor="middle" class="body">N×B ≤ Rmax</text>
  <path d="M1018 292 H1066" class="line"/>

  <rect x="1076" y="244" width="176" height="96" rx="8" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="1164" y="277" text-anchor="middle" class="box-title">稳定源 fd</text>
  <text x="1164" y="305" text-anchor="middle" class="body">O_NOFOLLOW</text>
  <text x="1164" y="330" text-anchor="middle" class="body">inode identity</text>
  <path d="M1252 292 H1300" class="line"/>

  <rect x="1310" y="244" width="176" height="96" rx="8" fill="#f3f0ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1398" y="277" text-anchor="middle" class="box-title">微型计划</text>
  <text x="1398" y="305" text-anchor="middle" class="body">同一 RNG 次序</text>
  <text x="1398" y="330" text-anchor="middle" class="body">≤3 pair / output</text>
  <path d="M1486 292 H1534" class="line"/>

  <rect x="1544" y="244" width="244" height="96" rx="8" fill="#edf9f6" stroke="#0f766e" stroke-width="2"/>
  <text x="1666" y="277" text-anchor="middle" class="box-title">1 MiB chunk 扇出</text>
  <text x="1666" y="305" text-anchor="middle" class="body">最多 32 个输出 fd</text>
  <text x="1666" y="330" text-anchor="middle" class="body">一次只建一个 bytearray</text>

  <path d="M1666 340 V366 H985 V380" class="line"/>
  <rect x="842" y="388" width="286" height="88" rx="8" fill="#f0fdfa" stroke="#2aa198" stroke-width="2"/>
  <text x="985" y="421" text-anchor="middle" class="box-title">private .sim.*.tmp</text>
  <text x="985" y="450" text-anchor="middle" class="body">O_EXCL · 0600 · 不可见</text>
  <path d="M1128 432 H1194" class="line"/>

  <rect x="1204" y="388" width="252" height="88" rx="8" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="1330" y="421" text-anchor="middle" class="box-title">源身份复验</text>
  <text x="1330" y="450" text-anchor="middle" class="body">fd-before = fd-after = path</text>
  <path d="M1456 432 H1522" class="line"/>

  <rect x="1532" y="388" width="256" height="88" rx="8" fill="#edf9f6" stroke="#0f766e" stroke-width="2"/>
  <text x="1660" y="421" text-anchor="middle" class="box-title">link → sim_NNNN</text>
  <text x="1660" y="450" text-anchor="middle" class="body">no-clobber · 失败回滚</text>

  <rect x="842" y="510" width="286" height="78" rx="8" fill="#eaf7f4"/>
  <text x="985" y="541" text-anchor="middle" class="metric">3.153 MB</text>
  <text x="985" y="568" text-anchor="middle" class="metric-label">32 MiB traced peak</text>
  <rect x="1150" y="510" width="286" height="78" rx="8" fill="#eaf7f4"/>
  <text x="1293" y="541" text-anchor="middle" class="metric">39,866 KiB</text>
  <text x="1293" y="568" text-anchor="middle" class="metric-label">32 MiB RSS median</text>
  <rect x="1458" y="510" width="330" height="78" rx="8" fill="#eaf7f4"/>
  <text x="1623" y="541" text-anchor="middle" class="metric">28.82 ms · 4.821×</text>
  <text x="1623" y="568" text-anchor="middle" class="metric-label">32 MiB elapsed · old/new</text>

  <!-- Invariants -->
  <rect x="70" y="650" width="1760" height="232" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="102" y="694" class="panel-title">成功与失败边界</text>
  <line x1="950" y1="718" x2="950" y2="850" stroke="#d8dee7" stroke-width="2"/>

  <circle cx="124" cy="748" r="18" fill="#0f766e"/>
  <path d="M115 748 l7 7 l13 -16" stroke="#ffffff" stroke-width="4" fill="none"/>
  <text x="158" y="742" class="box-title">成功返回</text>
  <text x="158" y="770" class="body">N 个最终文件 · 每个大小 B · ordered hash vector 与旧算法一致</text>
  <text x="158" y="800" class="body">无 temporary name · 源 inode/path identity 保持稳定</text>
  <text x="158" y="830" class="small">默认 N=5&lt;32：源只读一遍；输出必要 I/O 仍为 N×B</text>

  <circle cx="1004" cy="748" r="18" fill="#b42318"/>
  <path d="M995 739 l18 18 M1013 739 l-18 18" stroke="#ffffff" stroke-width="4"/>
  <text x="1038" y="742" class="box-title">异常退出</text>
  <text x="1038" y="770" class="body">删除所有 temporary · 回滚本次已发布名称</text>
  <text x="1038" y="800" class="body">预占或竞态目标返回 EEXIST，既有内容不被覆盖</text>
  <text x="1038" y="830" class="small">worker-private 边界：原子可见性，不宣称掉电持久性</text>

  <!-- Measurements -->
  <rect x="70" y="912" width="1760" height="408" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="102" y="958" class="panel-title">Fresh-process 机制基准 · 2 warm-up + 10 retained / mechanism / scale</text>
  <text x="102" y="989" class="small">固定 RNG 0xF343；全部 40 个 retained samples 的 count、bytes、ordered output digest 相同</text>

  <text x="112" y="1040" class="box-title">Python traced peak（MB）</text>
  <text x="112" y="1085" class="body">8 MiB 输入</text>
  <rect x="260" y="1062" width="176" height="30" rx="6" fill="#ef6b62"/>
  <text x="447" y="1084" class="body">旧 25.18</text>
  <rect x="260" y="1102" width="22" height="30" rx="6" fill="#159b8c"/>
  <text x="294" y="1124" class="body">新 3.15 · 7.985×</text>

  <text x="112" y="1180" class="body">32 MiB 输入</text>
  <rect x="260" y="1157" width="704" height="30" rx="6" fill="#ef6b62"/>
  <text x="975" y="1179" class="body">旧 100.67</text>
  <rect x="260" y="1197" width="22" height="30" rx="6" fill="#159b8c"/>
  <text x="294" y="1219" class="body">新 3.15 · 31.930×</text>
  <line x1="260" y1="1250" x2="964" y2="1250" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="1274" text-anchor="middle" class="axis">0</text>
  <text x="436" y="1274" text-anchor="middle" class="axis">25</text>
  <text x="612" y="1274" text-anchor="middle" class="axis">50</text>
  <text x="788" y="1274" text-anchor="middle" class="axis">75</text>
  <text x="964" y="1274" text-anchor="middle" class="axis">100 MB</text>

  <line x1="1040" y1="1020" x2="1040" y2="1278" stroke="#d8dee7" stroke-width="2"/>
  <text x="1080" y="1040" class="box-title">关键结论</text>
  <rect x="1080" y="1065" width="320" height="90" rx="8" fill="#edf9f6"/>
  <text x="1240" y="1101" text-anchor="middle" class="metric">1.000013×</text>
  <text x="1240" y="1131" text-anchor="middle" class="metric-label">4× 输入下新 heap 增长</text>
  <rect x="1420" y="1065" width="340" height="90" rx="8" fill="#eef6ff"/>
  <text x="1590" y="1101" text-anchor="middle" class="metric">2.146× / 4.821×</text>
  <text x="1590" y="1131" text-anchor="middle" class="metric-label">8 / 32 MiB 本机机制加速</text>

  <rect x="1080" y="1178" width="680" height="74" rx="8" fill="#fffbeb" stroke="#e9c46a"/>
  <text x="1106" y="1208" class="box-title">证据边界</text>
  <text x="1106" y="1236" class="body">机制结果 ≠ solver、coverage、campaign、漏洞或 LAVA-M 提升</text>
  <text x="1080" y="1291" class="small">真实 MPI：2 ranks · 6 public objects · each executed once · ACK 1/1 · stage residue 0 · exit 0</text>

  <text x="70" y="1360" class="small">SymCC parallel concolic execution · F343 · 2026-08-10</text>
  <text x="1830" y="1360" text-anchor="end" class="small">C=1 MiB · D=32 · default N=5</text>
</svg>
