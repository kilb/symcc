<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">F351 identity-closed cluster lock qualification</title>
  <desc id="desc">A mechanism schematic contrasting the old content-only lock proof with descriptor-anchored root and leaf identity closure across every master.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>
  <rect x="0" y="0" width="1600" height="100" fill="#102a43"/>
  <text x="64" y="48" fill="#ffffff" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700">F351  身份闭合的跨节点锁资格协议</text>
  <text x="64" y="78" fill="#cfe8f3" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="17">从“某个 inode 上的锁行为通过”提升为“公开 root/leaf 仍指向被测试对象”的分布式提交证明</text>
  <rect x="1300" y="28" width="236" height="45" rx="6" fill="#0e7490"/>
  <text x="1418" y="57" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">scope: cross-host-mpi-lock-v2</text>

  <!-- Old gap -->
  <g filter="url(#shadow)">
    <rect x="48" y="130" width="470" height="302" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  </g>
  <rect x="48" y="130" width="470" height="46" rx="8" fill="#fee4e2"/>
  <path d="M48 168 H518" stroke="#b42318" stroke-width="2"/>
  <text x="70" y="160" fill="#7a271a" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700">旧证明缺口：内容相同，不代表锁域相同</text>

  <rect x="82" y="205" width="176" height="88" rx="6" fill="#edf6ff" stroke="#2e90fa" stroke-width="2"/>
  <text x="170" y="235" text-anchor="middle" fill="#1849a9" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">inode A</text>
  <text x="170" y="261" text-anchor="middle" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">token = T</text>
  <text x="170" y="282" text-anchor="middle" fill="#027a48" font-family="DejaVu Sans, sans-serif" font-size="14">lock rounds pass</text>

  <path d="M268 249 H319" stroke="#b42318" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>
  <text x="294" y="226" text-anchor="middle" fill="#b42318" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="14">同字节替换</text>

  <rect x="329" y="205" width="154" height="88" rx="6" fill="#fff7ed" stroke="#f79009" stroke-width="2"/>
  <text x="406" y="235" text-anchor="middle" fill="#b54708" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">inode B</text>
  <text x="406" y="261" text-anchor="middle" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">token = T</text>
  <text x="406" y="282" text-anchor="middle" fill="#b42318" font-family="DejaVu Sans, sans-serif" font-size="12">unqualified lock domain</text>

  <rect x="82" y="324" width="401" height="75" rx="6" fill="#fff1f0" stroke="#f04438"/>
  <text x="102" y="349" fill="#7a271a" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700">content-only reopen：</text>
  <text x="102" y="376" fill="#475467" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="15">regular OK   token bytes OK   但 identity(A) ≠ identity(B)</text>
  <text x="102" y="396" fill="#b42318" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="14">行为证据与公开名称之间没有提交闭环</text>

  <!-- New proof stack -->
  <g filter="url(#shadow)">
    <rect x="548" y="130" width="1004" height="302" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  </g>
  <rect x="548" y="130" width="1004" height="46" rx="8" fill="#dff7f3"/>
  <path d="M548 168 H1552" stroke="#087e8b" stroke-width="2"/>
  <text x="570" y="160" fill="#065f67" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700">F351：双层绑定 + 每 master 身份闭合</text>

  <rect x="578" y="204" width="206" height="166" rx="6" fill="#f0f9ff" stroke="#0e7490" stroke-width="2"/>
  <circle cx="606" cy="232" r="14" fill="#0e7490"/>
  <text x="606" y="238" text-anchor="middle" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">1</text>
  <text x="630" y="238" fill="#155e75" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700">能力绑定复核</text>
  <text x="600" y="276" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">state: dev + fsid</text>
  <text x="600" y="302" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">publication: dev + fsid</text>
  <rect x="600" y="326" width="160" height="26" rx="4" fill="#dcfae6"/>
  <text x="680" y="344" text-anchor="middle" fill="#027a48" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700">before membership</text>

  <path d="M794 287 H828" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="838" y="204" width="224" height="166" rx="6" fill="#f5f3ff" stroke="#7f56d9" stroke-width="2"/>
  <circle cx="866" cy="232" r="14" fill="#7f56d9"/>
  <text x="866" y="238" text-anchor="middle" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">2</text>
  <text x="890" y="238" fill="#5925dc" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700">保持能力锚点</text>
  <rect x="866" y="264" width="168" height="34" rx="5" fill="#ffffff" stroke="#bdb4fe"/>
  <text x="950" y="286" text-anchor="middle" fill="#344054" font-family="DejaVu Sans, sans-serif" font-size="15">Ri = root directory fd</text>
  <rect x="866" y="310" width="168" height="34" rx="5" fill="#ffffff" stroke="#bdb4fe"/>
  <text x="950" y="332" text-anchor="middle" fill="#344054" font-family="DejaVu Sans, sans-serif" font-size="15">Li = lock regular fd</text>

  <path d="M1072 287 H1106" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1116" y="204" width="190" height="166" rx="6" fill="#fff7ed" stroke="#f79009" stroke-width="2"/>
  <circle cx="1144" cy="232" r="14" fill="#f79009"/>
  <text x="1144" y="238" text-anchor="middle" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">3</text>
  <text x="1168" y="238" fill="#b54708" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700">锁语义轮转</text>
  <text x="1211" y="274" text-anchor="middle" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="14">H holder rounds</text>
  <text x="1211" y="300" text-anchor="middle" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="14">H × (M−1) exclusions</text>
  <text x="1211" y="326" text-anchor="middle" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="14">H close-release checks</text>
  <text x="1211" y="350" text-anchor="middle" fill="#b54708" font-family="DejaVu Sans, sans-serif" font-size="13">all openat(Ri, leaf)</text>

  <path d="M1316 287 H1350" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1360" y="204" width="162" height="166" rx="6" fill="#ecfdf3" stroke="#12b76a" stroke-width="2"/>
  <circle cx="1388" cy="232" r="14" fill="#12b76a"/>
  <text x="1388" y="238" text-anchor="middle" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">4</text>
  <text x="1412" y="238" fill="#027a48" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700">提交闭环</text>
  <text x="1441" y="272" text-anchor="middle" fill="#344054" font-family="DejaVu Sans, sans-serif" font-size="14">reopen root = Ri</text>
  <text x="1441" y="298" text-anchor="middle" fill="#344054" font-family="DejaVu Sans, sans-serif" font-size="14">reopen leaf = Li</text>
  <text x="1441" y="324" text-anchor="middle" fill="#344054" font-family="DejaVu Sans, sans-serif" font-size="14">exact token bytes</text>
  <rect x="1374" y="336" width="134" height="24" rx="4" fill="#027a48"/>
  <text x="1441" y="353" text-anchor="middle" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700">identity checks = M</text>

  <rect x="578" y="386" width="944" height="28" rx="4" fill="#eef2f6"/>
  <text x="1050" y="405" text-anchor="middle" fill="#475467" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="14">任一 rank 失败 → namespace-identity-closed MPI phase → 全体 clean=false / verified=false</text>

  <!-- Timeline -->
  <g filter="url(#shadow)">
    <rect x="48" y="462" width="1504" height="300" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  </g>
  <text x="72" y="498" fill="#102a43" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700">一次资格事务的时序与线性证据</text>

  <text x="78" y="550" fill="#475467" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Master 0 / node A</text>
  <text x="78" y="622" fill="#475467" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Master 1 / node B</text>
  <text x="78" y="694" fill="#475467" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">MPI control plane</text>
  <line x1="235" y1="544" x2="1508" y2="544" stroke="#94a3b8" stroke-width="2"/>
  <line x1="235" y1="616" x2="1508" y2="616" stroke="#94a3b8" stroke-width="2"/>
  <line x1="235" y1="688" x2="1508" y2="688" stroke="#94a3b8" stroke-width="2"/>

  <g font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle">
    <rect x="258" y="520" width="142" height="48" rx="5" fill="#dff7f3" stroke="#0e7490"/><text x="329" y="540" fill="#065f67">复核 dev/fsid</text><text x="329" y="559" fill="#065f67">打开 R0</text>
    <rect x="258" y="592" width="142" height="48" rx="5" fill="#dff7f3" stroke="#0e7490"/><text x="329" y="612" fill="#065f67">复核 dev/fsid</text><text x="329" y="631" fill="#065f67">打开 R1</text>
    <rect x="430" y="664" width="145" height="48" rx="5" fill="#eef2f6" stroke="#667085"/><text x="502" y="684" fill="#344054">membership</text><text x="502" y="703" fill="#344054">全 rank clean</text>

    <rect x="607" y="520" width="150" height="48" rx="5" fill="#f5f3ff" stroke="#7f56d9"/><text x="682" y="540" fill="#5925dc">prepare at R0</text><text x="682" y="559" fill="#5925dc">保持 L0</text>
    <rect x="607" y="592" width="150" height="48" rx="5" fill="#f5f3ff" stroke="#7f56d9"/><text x="682" y="612" fill="#5925dc">verify at R1</text><text x="682" y="631" fill="#5925dc">保持 L1</text>
    <rect x="786" y="664" width="150" height="48" rx="5" fill="#eef2f6" stroke="#667085"/><text x="861" y="684" fill="#344054">anchor-open</text><text x="861" y="703" fill="#344054">全 rank ready</text>

    <rect x="968" y="520" width="166" height="48" rx="5" fill="#fff7ed" stroke="#f79009"/><text x="1051" y="540" fill="#b54708">holder A / release</text><text x="1051" y="559" fill="#b54708">then contend B</text>
    <rect x="968" y="592" width="166" height="48" rx="5" fill="#fff7ed" stroke="#f79009"/><text x="1051" y="612" fill="#b54708">contend A</text><text x="1051" y="631" fill="#b54708">holder B / release</text>
    <rect x="1162" y="664" width="130" height="48" rx="5" fill="#eef2f6" stroke="#667085"/><text x="1227" y="684" fill="#344054">5-phase × H</text><text x="1227" y="703" fill="#344054">计数闭合</text>

    <rect x="1320" y="520" width="166" height="48" rx="5" fill="#ecfdf3" stroke="#12b76a"/><text x="1403" y="540" fill="#027a48">reopen = R0/L0</text><text x="1403" y="559" fill="#027a48">identity OK</text>
    <rect x="1320" y="592" width="166" height="48" rx="5" fill="#ecfdf3" stroke="#12b76a"/><text x="1403" y="612" fill="#027a48">reopen = R1/L1</text><text x="1403" y="631" fill="#027a48">identity OK</text>
    <rect x="1320" y="664" width="166" height="48" rx="5" fill="#027a48"/><text x="1403" y="684" fill="#fff">identity-closed</text><text x="1403" y="703" fill="#fff">commit v3</text>
  </g>
  <path d="M400 544 H600" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 616 H600" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M575 688 H779" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M757 544 H960" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M757 616 H960" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M936 688 H1155" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1134 544 H1312" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1134 616 H1312" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1292 688 H1312" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Results and boundaries -->
  <rect x="48" y="792" width="770" height="160" rx="8" fill="#ecfdf3" stroke="#12b76a" stroke-width="2"/>
  <text x="72" y="826" fill="#027a48" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700">已验证机制</text>
  <text x="72" y="857" fill="#344054" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="15">正常：M=3，H=2 → rounds 2 / contention 4 / release 2 / identity 3</text>
  <text x="72" y="884" fill="#344054" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="15">同内容替换：SHA-256相同、inode不同 → 两方完成轮转后仍一致失败</text>
  <text x="72" y="911" fill="#344054" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="15">过期 state/publication 绑定在 round 0 拒绝；legacy v1 renewal 计为 failure</text>
  <rect x="72" y="925" width="286" height="20" rx="4" fill="#027a48"/><text x="215" y="940" text-anchor="middle" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700">8 / 8 mechanism checks passed</text>

  <rect x="842" y="792" width="710" height="160" rx="8" fill="#fff7ed" stroke="#f79009" stroke-width="2"/>
  <text x="866" y="826" fill="#b54708" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700">证据边界</text>
  <text x="866" y="857" fill="#344054" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="15">当前集成：本地 overlayfs + 线程控制面 + 合成 processor name</text>
  <text x="866" y="884" fill="#344054" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="15">未测试：真实多机 MPI、NFS/Lustre/CephFS、mount/网络分区、server failover</text>
  <text x="866" y="911" fill="#344054" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="15">不推导：求解吞吐、coverage、bug discovery 或 LAVA-M 提升</text>
  <text x="866" y="938" fill="#b54708" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700">commit-time closure, not Byzantine storage or complete ABA history</text>

  <text x="800" y="983" text-anchor="middle" fill="#667085" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" font-size="13">SymCC parallel concolic execution · F351 · 2026-08-10 · descriptor capability + MPI evidence cardinality</text>
</svg>
