<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">F367 sealed query artifact descriptor handoff</title>
  <desc id="desc">QueryStore verifies three content-addressed SMT2 objects, copies them into sealed memfd snapshots before lease commit, and supplies stable descriptors to one-shot and persistent solvers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="dangerArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 19px Arial, sans-serif; fill: #475569; }
      .band-title { font: 700 18px Arial, sans-serif; fill: #334155; }
      .node-title { font: 700 21px Arial, sans-serif; fill: #111827; }
      .body { font: 400 16px Arial, sans-serif; fill: #334155; }
      .small { font: 400 14px Arial, sans-serif; fill: #475569; }
      .footer-body { font: 400 16px Arial, sans-serif; fill: #f8fafc; }
      .footer-small { font: 400 14px Arial, sans-serif; fill: #cbd5e1; }
      .mono { font: 600 14px Consolas, monospace; fill: #1f2937; }
      .pill { font: 700 13px Arial, sans-serif; letter-spacing: 0; }
      .line { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#f8fafc"/>
  <rect x="0" y="0" width="1600" height="116" fill="#ffffff"/>
  <rect x="0" y="113" width="1600" height="3" fill="#0f766e"/>
  <text x="70" y="58" class="title">F367 | Sealed Query Artifact FD Handoff</text>
  <text x="70" y="91" class="subtitle">From verified digest paths to immutable solver-consumed snapshots</text>
  <rect x="1328" y="38" width="202" height="42" rx="5" fill="#dcfce7" stroke="#15803d"/>
  <text x="1429" y="64" text-anchor="middle" class="pill" fill="#166534">LEASE-TO-SOLVE CLOSED</text>

  <text x="70" y="153" class="band-title">THE REPRODUCED GAP</text>
  <rect x="70" y="170" width="1460" height="128" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <rect x="94" y="194" width="352" height="78" rx="5" fill="#ffffff" stroke="#fdba74"/>
  <text x="118" y="224" class="node-title">1 | Claim verifies CAS path</text>
  <text x="118" y="251" class="mono">SHA256(path bytes) = expected</text>
  <path d="M 446 233 H 606" class="line"/>
  <rect x="606" y="194" width="358" height="78" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="630" y="224" class="node-title">2 | Path is replaced</text>
  <text x="630" y="251" class="mono">rename(new inode, digest path)</text>
  <path d="M 964 233 H 1124" fill="none" stroke="#b42318" stroke-width="3" marker-end="url(#dangerArrow)"/>
  <rect x="1124" y="194" width="378" height="78" rx="5" fill="#ffffff" stroke="#fca5a5"/>
  <text x="1148" y="224" class="node-title">3 | Old worker opens wrong bytes</text>
  <text x="1148" y="251" class="mono">expected 614fe2... | read 69b0c4...</text>

  <text x="70" y="344" class="band-title">PRE-LEASE SNAPSHOT TRANSACTION</text>
  <rect x="70" y="362" width="260" height="238" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="94" y="399" class="node-title">SQLite claim</text>
  <text x="94" y="431" class="mono">BEGIN IMMEDIATE</text>
  <text x="94" y="466" class="body">Select pending query</text>
  <text x="94" y="494" class="body">Read canonical digests</text>
  <text x="94" y="522" class="body">No token mutation yet</text>
  <rect x="94" y="548" width="205" height="30" rx="4" fill="#e0f2fe"/>
  <text x="196" y="568" text-anchor="middle" class="pill" fill="#075985">FAILURE-ATOMIC</text>

  <path d="M 330 480 H 392" class="line"/>
  <rect x="392" y="362" width="312" height="238" rx="7" fill="#ecfeff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
  <text x="416" y="399" class="node-title">Descriptor-anchored CAS</text>
  <text x="416" y="435" class="mono">full | prefix | target</text>
  <text x="416" y="472" class="body">no-follow stable snapshot</text>
  <text x="416" y="500" class="body">regular file + 128 MiB bound</text>
  <text x="416" y="528" class="body">SHA-256 equals database id</text>
  <text x="416" y="556" class="body">canonical kind/path mapping</text>

  <path d="M 704 480 H 766" class="line"/>
  <rect x="766" y="342" width="364" height="278" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="382" class="node-title">Immutable lease snapshots</text>
  <rect x="790" y="406" width="316" height="42" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="810" y="432" class="mono">memfd(full)   SHA = Q</text>
  <rect x="790" y="458" width="316" height="42" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="810" y="484" class="mono">memfd(prefix) SHA = P</text>
  <rect x="790" y="510" width="316" height="42" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="810" y="536" class="mono">memfd(target) SHA = T</text>
  <text x="790" y="580" class="small">WRITE / GROW / SHRINK are blocked</text>
  <text x="790" y="603" class="small">F_SEAL_SEAL makes the policy irreversible</text>

  <path d="M 1130 480 H 1192" class="line"/>
  <rect x="1192" y="362" width="338" height="238" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
  <text x="1216" y="399" class="node-title">Lease commit</text>
  <text x="1216" y="435" class="mono">pending → leased(token + 1)</text>
  <text x="1216" y="472" class="body">attempts increment once</text>
  <text x="1216" y="500" class="body">bundle owns three memfds</text>
  <text x="1216" y="528" class="body">dup is thread-safe</text>
  <text x="1216" y="556" class="body">close is idempotent</text>

  <text x="70" y="670" class="band-title">TWO SOLVER DATA PLANES</text>
  <path d="M 948 620 V 668 H 420 V 704" class="dash"/>
  <path d="M 948 620 V 668 H 1172 V 704" class="dash"/>

  <rect x="70" y="704" width="700" height="238" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="704" width="700" height="48" rx="7" fill="#dbeafe"/>
  <text x="94" y="735" class="node-title">One-shot SubprocessSolver</text>
  <rect x="94" y="780" width="190" height="108" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="112" y="810" class="mono">dup(full_fd)</text>
  <text x="112" y="840" class="mono">pass_fds=(fd,)</text>
  <text x="112" y="870" class="mono">/proc/self/fd/N</text>
  <path d="M 284 835 H 364" class="line"/>
  <rect x="364" y="780" width="374" height="108" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="388" y="812" class="node-title">Solver helper process</text>
  <text x="388" y="842" class="body">opens inherited sealed object</text>
  <text x="388" y="870" class="body">CAS pathname is never consulted</text>
  <text x="94" y="922" class="small">Child inheritance preserves the immutable object across exec.</text>

  <rect x="830" y="704" width="700" height="238" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <rect x="830" y="704" width="700" height="48" rx="7" fill="#ede9fe"/>
  <text x="854" y="735" class="node-title">Persistent prefix-cache helper</text>
  <rect x="854" y="780" width="228" height="108" rx="5" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="872" y="810" class="mono">SOCK_SEQPACKET</text>
  <text x="872" y="840" class="mono">sendmsg(SCM_RIGHTS)</text>
  <text x="872" y="870" class="mono">payload = query_id</text>
  <path d="M 1082 835 H 1154" class="line"/>
  <rect x="1154" y="772" width="352" height="124" rx="5" fill="#fafafa" stroke="#a78bfa"/>
  <text x="1178" y="804" class="node-title">C++ query solver</text>
  <text x="1178" y="834" class="body">bind ID | require 2 regular sealed fds</text>
  <text x="1178" y="862" class="body">bounded pread | identity check</text>
  <text x="1178" y="888" class="mono">solver.from_string(snapshot)</text>
  <text x="854" y="922" class="small">Prefix cache reuses parsed constraints; each target still arrives by fd.</text>

  <rect x="70" y="982" width="1460" height="72" rx="7" fill="#111827"/>
  <text x="96" y="1013" class="pill" fill="#5eead4">PROVEN INVARIANT</text>
  <text x="250" y="1014" class="footer-body">solver bytes = sealed lease bytes = SHA-verified artifact bytes at claim time</text>
  <text x="96" y="1042" class="footer-small">complete / fail closes bundle | allocation failure closes partial snapshots and preserves pending, attempts = 0</text>
</svg>
