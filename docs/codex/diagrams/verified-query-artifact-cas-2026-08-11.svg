<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">F366 Verified Query Artifact CAS and pre-lease admission</title>
  <desc id="desc">Comparison between existence-only artifact admission and descriptor-anchored content verification before lease commit.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, "Noto Sans CJK SC", Arial, sans-serif; fill: #101828; }
      .subtitle { font: 400 19px Inter, "Noto Sans CJK SC", Arial, sans-serif; fill: #475467; }
      .lane { font: 700 24px Inter, "Noto Sans CJK SC", Arial, sans-serif; fill: #101828; }
      .box-title { font: 700 20px Inter, "Noto Sans CJK SC", Arial, sans-serif; fill: #101828; }
      .body { font: 400 16px Inter, "Noto Sans CJK SC", Arial, sans-serif; fill: #344054; }
      .mono { font: 600 15px "DejaVu Sans Mono", monospace; fill: #344054; }
      .small { font: 500 14px Inter, "Noto Sans CJK SC", Arial, sans-serif; fill: #475467; }
      .metric { font: 700 22px Inter, "Noto Sans CJK SC", Arial, sans-serif; }
      .arrow { stroke: #344054; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 8 8; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#f8fafc"/>
  <rect x="54" y="42" width="1492" height="996" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="2"/>
  <text x="100" y="105" class="title">F366 · Verified Query Artifact CAS</text>
  <text x="100" y="143" class="subtitle">Binding SMT2 content identity to QueryStore publication and lease commit</text>

  <rect x="100" y="185" width="1400" height="220" rx="8" fill="#fff7ed" stroke="#f79009" stroke-width="2"/>
  <text x="130" y="225" class="lane">LEGACY · Existence-only admission</text>
  <rect x="130" y="255" width="250" height="105" rx="6" fill="#ffffff" stroke="#f79009" stroke-width="2"/>
  <text x="155" y="290" class="box-title">Digest-named path</text>
  <text x="155" y="322" class="mono">path = H(content)</text>
  <text x="155" y="347" class="small">Name is not content proof</text>
  <path d="M 380 307 L 455 307" class="arrow"/>
  <rect x="455" y="255" width="275" height="105" rx="6" fill="#ffffff" stroke="#f79009" stroke-width="2"/>
  <text x="480" y="290" class="box-title">Path.exists()</text>
  <text x="480" y="322" class="body">Existing leaf → skip write</text>
  <text x="480" y="347" class="small">regular / symlink / FIFO accepted</text>
  <path d="M 730 307 L 805 307" class="arrow"/>
  <rect x="805" y="255" width="260" height="105" rx="6" fill="#ffffff" stroke="#f79009" stroke-width="2"/>
  <text x="830" y="290" class="box-title">SQLite index</text>
  <text x="830" y="322" class="body">Register expected digest</text>
  <text x="830" y="347" class="small">No binding to inode bytes</text>
  <path d="M 1065 307 L 1140 307" class="arrow"/>
  <rect x="1140" y="245" width="320" height="125" rx="6" fill="#fef3f2" stroke="#d92d20" stroke-width="3"/>
  <text x="1165" y="282" class="box-title" fill="#b42318">Silent semantic split</text>
  <text x="1165" y="316" class="mono">DB hash ≠ SHA256(bytes)</text>
  <text x="1165" y="344" class="body">Worker solves another formula</text>

  <text x="100" y="465" class="lane">PRODUCTION · Prove content before publication</text>
  <rect x="100" y="495" width="275" height="145" rx="6" fill="#ecfdf3" stroke="#12b76a" stroke-width="2"/>
  <text x="125" y="532" class="box-title">1 · Put / Repair</text>
  <text x="125" y="566" class="body">descriptor-relative temp</text>
  <text x="125" y="594" class="body">full write · fsync · replace</text>
  <text x="125" y="622" class="small">corrupt / symlink / FIFO repaired</text>
  <path d="M 375 566 L 430 566" class="arrow"/>
  <rect x="430" y="495" width="275" height="145" rx="6" fill="#eff8ff" stroke="#2e90fa" stroke-width="2"/>
  <text x="455" y="532" class="box-title">2 · Identity Proof</text>
  <text x="455" y="566" class="body">regular + no-follow</text>
  <text x="455" y="594" class="body">root / shard / leaf stable</text>
  <text x="455" y="622" class="mono">SHA256(bytes) = H</text>
  <path d="M 705 566 L 760 566" class="arrow"/>
  <rect x="760" y="495" width="275" height="145" rx="6" fill="#f4f3ff" stroke="#7f56d9" stroke-width="2"/>
  <text x="785" y="532" class="box-title">3 · Canonical Index</text>
  <text x="785" y="566" class="mono">kind / H[0:2] / H.smt2</text>
  <text x="785" y="594" class="body">SQLite UPSERT</text>
  <text x="785" y="622" class="small">Index cannot redirect namespace</text>
  <path d="M 1035 566 L 1090 566" class="arrow"/>
  <rect x="1090" y="495" width="370" height="145" rx="6" fill="#ecfdf3" stroke="#12b76a" stroke-width="2"/>
  <text x="1115" y="532" class="box-title">4 · Verified QueryStore</text>
  <text x="1115" y="566" class="body">Index identity matches bytes</text>
  <text x="1115" y="594" class="body">Concurrent writers converge</text>
  <text x="1115" y="622" class="small">8 writers → 1 digest / 1 row</text>

  <path d="M 800 660 L 800 710" class="arrow"/>
  <rect x="100" y="710" width="1360" height="205" rx="8" fill="#f9fafb" stroke="#667085" stroke-width="2"/>
  <text x="130" y="750" class="lane">Pre-Lease Admission Transaction</text>
  <rect x="130" y="785" width="190" height="82" rx="6" fill="#ffffff" stroke="#667085"/>
  <text x="155" y="818" class="box-title">SELECT pending</text>
  <text x="155" y="846" class="small">BEGIN IMMEDIATE</text>
  <path d="M 320 826 L 375 826" class="arrow"/>
  <rect x="375" y="785" width="310" height="82" rx="6" fill="#eff8ff" stroke="#2e90fa" stroke-width="2"/>
  <text x="400" y="818" class="box-title">Verify 3 Artifacts</text>
  <text x="400" y="846" class="small">query · prefix · target SMT2</text>
  <path d="M 685 826 L 750 826" class="arrow"/>
  <rect x="750" y="775" width="300" height="102" rx="6" fill="#ecfdf3" stroke="#12b76a" stroke-width="2"/>
  <text x="775" y="811" class="box-title">Success → Commit</text>
  <text x="775" y="840" class="mono">token+1 · attempts+1</text>
  <text x="775" y="864" class="small">Return verified WorkLease</text>
  <path d="M 530 867 L 530 900 L 1100 900 L 1100 866" class="dash"/>
  <rect x="1100" y="775" width="330" height="102" rx="6" fill="#fef3f2" stroke="#d92d20" stroke-width="2"/>
  <text x="1125" y="811" class="box-title">Failure → Rollback</text>
  <text x="1125" y="840" class="mono">pending · attempts=0</text>
  <text x="1125" y="864" class="small">Solver never receives bad path</text>

  <rect x="100" y="948" width="1360" height="60" rx="6" fill="#101828"/>
  <text x="130" y="986" class="metric" fill="#ffffff">787 passed + 127 subtests</text>
  <text x="545" y="986" class="metric" fill="#6ce9a6">16 capabilities · 0 missing</text>
  <text x="1040" y="986" class="metric" fill="#84caff">0 identity drift</text>
</svg>
