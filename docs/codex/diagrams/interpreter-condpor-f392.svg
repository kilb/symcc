<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">F392 bounded interpreter-level ConDPOR architecture</title>
  <desc id="desc">A closed concurrent IR is replayed from execution graphs. Read, constraint, and write events enumerate read-from, outcomes, coherence, and backward revisits before SC and Z3 checks produce terminal certificates.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#16324f" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#36566f"/>
    </marker>
    <style>
      .title { font: 700 36px 'DejaVu Sans', sans-serif; fill: #152a3a; letter-spacing: 0; }
      .subtitle { font: 400 18px 'DejaVu Sans', sans-serif; fill: #526979; letter-spacing: 0; }
      .h { font: 700 20px 'DejaVu Sans', sans-serif; fill: #173247; letter-spacing: 0; }
      .t { font: 400 16px 'DejaVu Sans', sans-serif; fill: #3c5668; letter-spacing: 0; }
      .small { font: 600 14px 'DejaVu Sans', sans-serif; fill: #496272; letter-spacing: 0; }
      .whiteh { font: 700 20px 'DejaVu Sans', sans-serif; fill: #ffffff; letter-spacing: 0; }
      .whitet { font: 400 15px 'DejaVu Sans', sans-serif; fill: #f4fbff; letter-spacing: 0; }
      .edge { fill: none; stroke: #36566f; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #7b8e9b; stroke-width: 2.5; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#f7fafb"/>
  <rect x="0" y="0" width="1600" height="112" fill="#ffffff"/>
  <rect x="0" y="110" width="1600" height="2" fill="#d9e4e9"/>
  <text x="70" y="57" class="title">F392  Interpreter-Level ConDPOR</text>
  <text x="70" y="88" class="subtitle">Executable event generation, graph replay, SC consistency, and deterministic QF_BV witnesses</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="1460" height="88" rx="6" fill="#ffffff" stroke="#cedbe1" stroke-width="2"/>
  </g>
  <rect x="92" y="167" width="12" height="44" rx="4" fill="#df7a32"/>
  <text x="125" y="181" class="h">Semantic boundary</text>
  <text x="125" y="207" class="t">Finite threads · closed scalar IR · 1–64 bit QF_BV · sequential consistency · explicit graph/event/solver bounds</text>
  <rect x="1190" y="166" width="306" height="46" rx="5" fill="#fff4e9" stroke="#e9b17f"/>
  <text x="1343" y="186" text-anchor="middle" class="small">No native / weak-memory /</text>
  <text x="1343" y="204" text-anchor="middle" class="small">unbounded optimality claim</text>

  <g filter="url(#shadow)">
    <rect x="70" y="283" width="260" height="128" rx="6" fill="#ffffff" stroke="#9bb7c5" stroke-width="2"/>
  </g>
  <rect x="70" y="283" width="260" height="38" rx="6" fill="#226a78"/>
  <rect x="70" y="315" width="260" height="6" fill="#226a78"/>
  <text x="200" y="309" text-anchor="middle" class="whiteh">Closed Program IR</text>
  <text x="94" y="349" class="t">Strict schema + labels</text>
  <text x="94" y="376" class="t">R / W / A / C events</text>
  <text x="94" y="397" class="t">Typed expression AST</text>

  <g filter="url(#shadow)">
    <rect x="390" y="272" width="330" height="150" rx="6" fill="#ffffff" stroke="#6d9abb" stroke-width="2.5"/>
  </g>
  <rect x="390" y="272" width="330" height="45" rx="6" fill="#2d638c"/>
  <rect x="390" y="311" width="330" height="6" fill="#2d638c"/>
  <text x="555" y="301" text-anchor="middle" class="whiteh">Replay oracle next_P(G)</text>
  <text x="414" y="348" class="t">Rebuild PC, locals, and symbols</text>
  <text x="414" y="375" class="t">Resolve reads through selected rf</text>
  <text x="414" y="402" class="t">Regenerate path-dependent events</text>

  <g filter="url(#shadow)">
    <rect x="790" y="272" width="310" height="150" rx="6" fill="#ffffff" stroke="#849c63" stroke-width="2.5"/>
  </g>
  <rect x="790" y="272" width="310" height="45" rx="6" fill="#617f3d"/>
  <rect x="790" y="311" width="310" height="6" fill="#617f3d"/>
  <text x="945" y="301" text-anchor="middle" class="whiteh">Add One Event</text>
  <text x="814" y="348" class="t">Stable (thread, index, PC)</text>
  <text x="814" y="375" class="t">Deterministic thread choice</text>
  <text x="814" y="402" class="t">Content-addressed graph state</text>

  <g filter="url(#shadow)">
    <rect x="1170" y="283" width="360" height="128" rx="6" fill="#ffffff" stroke="#9bb7c5" stroke-width="2"/>
  </g>
  <rect x="1170" y="283" width="360" height="38" rx="6" fill="#3e596d"/>
  <rect x="1170" y="315" width="360" height="6" fill="#3e596d"/>
  <text x="1350" y="309" text-anchor="middle" class="whiteh">Visited / Worklist</text>
  <text x="1194" y="349" class="t">Canonical SHA-256 identity</text>
  <text x="1194" y="376" class="t">Duplicate suppression</text>
  <text x="1194" y="397" class="t">Explicit truncation reasons</text>

  <path d="M330 347 L390 347" class="edge"/>
  <path d="M720 347 L790 347" class="edge"/>
  <path d="M1100 347 L1170 347" class="edge"/>
  <path d="M1350 411 L1350 454 L555 454 L555 422" class="dash"/>

  <g filter="url(#shadow)">
    <rect x="110" y="520" width="390" height="170" rx="6" fill="#ffffff" stroke="#5c95b7" stroke-width="2"/>
  </g>
  <rect x="110" y="520" width="390" height="42" rx="6" fill="#e7f4fa"/>
  <text x="135" y="548" class="h">R · Read choice</text>
  <circle cx="151" cy="589" r="8" fill="#2f7ea5"/>
  <text x="173" y="595" class="t">Enumerate same-location current writes</text>
  <circle cx="151" cy="626" r="8" fill="#2f7ea5"/>
  <text x="173" y="632" class="t">Set total rf, including init write</text>
  <circle cx="151" cy="663" r="8" fill="#2f7ea5"/>
  <text x="173" y="669" class="t">Read value becomes symbolic write term</text>

  <g filter="url(#shadow)">
    <rect x="605" y="520" width="390" height="170" rx="6" fill="#ffffff" stroke="#a178ab" stroke-width="2"/>
  </g>
  <rect x="605" y="520" width="390" height="42" rx="6" fill="#f4ebf6"/>
  <text x="630" y="548" class="h">C · Constraint choice</text>
  <circle cx="646" cy="589" r="8" fill="#8c5a98"/>
  <text x="668" y="595" class="t">Enumerate Boolean outcomes</text>
  <circle cx="646" cy="626" r="8" fill="#8c5a98"/>
  <text x="668" y="632" class="t">Conjoin path predicates in QF_BV</text>
  <circle cx="646" cy="663" r="8" fill="#8c5a98"/>
  <text x="668" y="669" class="t">Prune UNSAT; preserve assert failure</text>

  <g filter="url(#shadow)">
    <rect x="1100" y="500" width="390" height="210" rx="6" fill="#ffffff" stroke="#d08a55" stroke-width="2.5"/>
  </g>
  <rect x="1100" y="500" width="390" height="42" rx="6" fill="#fff0e5"/>
  <text x="1125" y="528" class="h">W · Write choice + revisit</text>
  <circle cx="1141" cy="569" r="8" fill="#c56e2f"/>
  <text x="1163" y="575" class="t">Insert at every coherence position</text>
  <circle cx="1141" cy="606" r="8" fill="#c56e2f"/>
  <text x="1163" y="612" class="t">Find older non-causal same-loc reads</text>
  <circle cx="1141" cy="643" r="8" fill="#c56e2f"/>
  <text x="1163" y="649" class="t">Delete non-required later events</text>
  <circle cx="1141" cy="680" r="8" fill="#c56e2f"/>
  <text x="1163" y="686" class="t">Set rf := new W, then replay</text>

  <path d="M870 422 L305 520" class="edge"/>
  <path d="M945 422 L800 520" class="edge"/>
  <path d="M1020 422 L1295 500" class="edge"/>

  <g filter="url(#shadow)">
    <rect x="110" y="780" width="610" height="175" rx="6" fill="#ffffff" stroke="#466c83" stroke-width="2.5"/>
  </g>
  <rect x="110" y="780" width="610" height="44" rx="6" fill="#284d64"/>
  <rect x="110" y="818" width="610" height="6" fill="#284d64"/>
  <text x="415" y="810" text-anchor="middle" class="whiteh">Admission: graph + path consistency</text>
  <text x="142" y="858" class="t">SC graph: acyclic( po ∪ rf ∪ co ∪ fr )</text>
  <text x="142" y="889" class="t">Path: Z3 SAT over write equalities and C outcomes</text>
  <text x="142" y="920" class="t">Failures are classified: SC cycle · UNSAT · stale event · bound</text>

  <g filter="url(#shadow)">
    <rect x="880" y="780" width="610" height="175" rx="6" fill="#ffffff" stroke="#4a8a72" stroke-width="2.5"/>
  </g>
  <rect x="880" y="780" width="610" height="44" rx="6" fill="#35745e"/>
  <rect x="880" y="818" width="610" height="6" fill="#35745e"/>
  <text x="1185" y="810" text-anchor="middle" class="whiteh">Terminal evidence</text>
  <text x="912" y="858" class="t">Complete execution or assertion-failure witness</text>
  <text x="912" y="889" class="t">Lexicographically minimal unsigned symbolic model</text>
  <text x="912" y="920" class="t">Recomputable SHA-256 certificate + exact claim scope</text>

  <path d="M305 690 L305 780" class="edge"/>
  <path d="M800 690 L620 780" class="edge"/>
  <path d="M1295 710 L1295 745 L650 745 L650 780" class="edge"/>
  <path d="M720 868 L880 868" class="edge"/>
  <path d="M415 780 L415 735 L1350 735 L1350 710" class="dash"/>

  <text x="70" y="1010" class="small">Key advance over F57: the replay oracle owns program semantics, so deleted control-dependent events are regenerated instead of copied from an observed trace.</text>
</svg>
