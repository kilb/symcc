<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="并行混合符号执行系统架构图">
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 800 28px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif; fill: #17202a; }
      .subtitle { font: 500 15px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif; fill: #5d6b7a; }
      .panel-title { font: 800 20px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif; fill: #17202a; }
      .node-title { font: 800 17px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif; fill: #17202a; }
      .text { font: 500 14px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif; fill: #5d6b7a; }
      .small { font: 500 13px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif; fill: #637489; }
      .panel-blue { fill: #eef5ff; stroke: #b9cff8; stroke-width: 2; }
      .panel-green { fill: #edf8f2; stroke: #b8dfc8; stroke-width: 2; }
      .panel-amber { fill: #fff7e8; stroke: #edd49d; stroke-width: 2; }
      .panel-violet { fill: #f4f1ff; stroke: #cfc4f6; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #c8d3e1; stroke-width: 2; }
      .node-strong { fill: #ffffff; stroke: #1f6feb; stroke-width: 2.5; }
      .main-flow { stroke: #1f6feb; stroke-width: 3.2; fill: none; marker-end: url(#arrowBlue); }
      .feedback-flow { stroke: #168a58; stroke-width: 3; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowGreen); }
      .evidence-flow { stroke: #7257c8; stroke-width: 2.6; fill: none; stroke-dasharray: 4 6; marker-end: url(#arrowViolet); }
      .badge { fill: #1f6feb; }
      .badge-text { font: 800 13px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif; fill: #ffffff; }
      .legend-label { font: 700 13px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif; fill: #29415a; }
    </style>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f6feb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#168a58"/>
    </marker>
    <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7257c8"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="48" y="52">并行混合符号执行系统架构</text>
  <text class="subtitle" x="48" y="80">核心关系：AFL++ 产生输入，Master 统一调度和覆盖准入，SymCC workers 并行求解；覆盖反馈反向影响下一轮调度。</text>

  <rect class="panel-blue" x="48" y="125" width="286" height="350" rx="16"/>
  <text class="panel-title" x="78" y="162">AFL++ Fuzzing 层</text>
  <rect class="node" x="82" y="190" width="218" height="66" rx="10"/>
  <text class="node-title" x="108" y="218">Mutation Execution</text>
  <text class="text" x="108" y="242">高速变异并执行目标程序</text>
  <rect class="node-strong" x="82" y="286" width="218" height="70" rx="10"/>
  <text class="node-title" x="108" y="315">AFL Queue</text>
  <text class="text" x="108" y="340">Master 从这里读取新输入</text>
  <rect class="node" x="82" y="388" width="218" height="56" rx="10"/>
  <text class="node-title" x="108" y="422">AFL Sync Corpus</text>

  <rect class="panel-green" x="400" y="125" width="320" height="350" rx="16"/>
  <text class="panel-title" x="430" y="162">MPI Master 调度层</text>
  <rect class="node-strong" x="435" y="190" width="250" height="76" rx="10"/>
  <text class="node-title" x="462" y="220">任务合并与优先级评分</text>
  <text class="text" x="462" y="244">输入 / 目标分支 / 前缀 / 状态</text>
  <rect class="node" x="435" y="296" width="250" height="76" rx="10"/>
  <text class="node-title" x="462" y="326">Worker 派发与租约</text>
  <text class="text" x="462" y="350">READY 后下发 WORK，结果带 token</text>
  <rect class="node-strong" x="435" y="402" width="250" height="46" rx="10"/>
  <text class="node-title" x="462" y="431">覆盖准入 Triage</text>

  <rect class="panel-amber" x="786" y="125" width="310" height="350" rx="16"/>
  <text class="panel-title" x="816" y="162">SymCC Worker Pool</text>
  <rect class="node" x="824" y="190" width="112" height="78" rx="10"/>
  <text class="node-title" x="846" y="222">Worker</text>
  <text class="text" x="846" y="246">路径约束</text>
  <rect class="node" x="958" y="190" width="112" height="78" rx="10"/>
  <text class="node-title" x="980" y="222">Worker</text>
  <text class="text" x="980" y="246">候选输入</text>
  <rect class="node" x="824" y="302" width="246" height="70" rx="10"/>
  <text class="node-title" x="850" y="331">Solver Portfolio</text>
  <text class="text" x="850" y="355">快速求解 / Z3 / context cache</text>
  <rect class="node" x="824" y="402" width="246" height="46" rx="10"/>
  <text class="node-title" x="850" y="431">返回候选输入与 profile</text>

  <rect class="panel-violet" x="48" y="530" width="1048" height="150" rx="16"/>
  <text class="panel-title" x="78" y="567">覆盖反馈与证据中心</text>
  <rect class="node-strong" x="82" y="592" width="284" height="60" rx="10"/>
  <text class="node-title" x="106" y="619">AFL Edge Bitmap</text>
  <text class="text" x="106" y="641">覆盖准入账本：决定输入是否保留</text>
  <rect class="node" x="400" y="592" width="292" height="60" rx="10"/>
  <text class="node-title" x="424" y="619">AFL Data Map</text>
  <text class="text" x="424" y="641">比较距离提示：指导变异和任务评分</text>
  <rect class="node" x="728" y="592" width="322" height="60" rx="10"/>
  <text class="node-title" x="752" y="619">Evidence Files</text>
  <text class="text" x="752" y="641">CSV / JSON / profile：用于复盘，不参与准入</text>

  <rect class="node" x="1130" y="138" width="112" height="122" rx="10"/>
  <text class="legend-label" x="1152" y="166">图例</text>
  <path class="main-flow" d="M1148 188 L1210 188"/>
  <text class="small" x="1150" y="210">主执行流</text>
  <path class="feedback-flow" d="M1148 226 L1210 226"/>
  <text class="small" x="1150" y="248">反馈信号</text>

  <path class="main-flow" d="M300 321 L435 228"/>
  <path class="main-flow" d="M685 334 L824 229"/>
  <path class="main-flow" d="M824 425 C760 465 700 460 685 425"/>
  <path class="main-flow" d="M435 425 C330 474 266 463 191 444"/>
  <path class="main-flow" d="M191 388 L191 356"/>

  <path class="feedback-flow" d="M224 592 C250 510 376 436 435 425"/>
  <path class="feedback-flow" d="M546 592 C558 520 560 486 560 448"/>
  <path class="feedback-flow" d="M546 592 C380 535 258 472 191 444"/>

  <path class="evidence-flow" d="M560 448 C610 512 726 566 832 592"/>
  <path class="evidence-flow" d="M947 448 C951 515 920 552 890 592"/>

  <circle class="badge" cx="348" cy="287" r="15"/><text class="badge-text" x="344" y="292">1</text>
  <circle class="badge" cx="748" cy="282" r="15"/><text class="badge-text" x="744" y="287">2</text>
  <circle class="badge" cx="745" cy="437" r="15"/><text class="badge-text" x="741" y="442">3</text>
  <circle class="badge" cx="327" cy="462" r="15"/><text class="badge-text" x="323" y="467">4</text>

  <text class="small" x="78" y="716">说明：Edge Bitmap 是最终覆盖准入口径；Data Map 是比较距离反馈；Evidence 只用于实验记录与汇报复核，不反向影响调度。</text>
</svg>
