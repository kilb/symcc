<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Elastic multi-master ULFM architecture</title>
  <desc id="desc">A global recovery plane rebuilds generation-local master worker groups while a durable work plane preserves exact work and result publication.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;letter-spacing:0;fill:#172033}.h{font-size:24px;font-weight:700}.t{font-size:17px;font-weight:650}.s{font-size:14px}.note{font-size:13px;fill:#526078}.box{stroke-width:2}.a{fill:#e7f5f2;stroke:#0f766e}.b{fill:#fff4e5;stroke:#c2410c}.c{fill:#eef2ff;stroke:#4f46e5}.d{fill:#f8fafc;stroke:#64748b}.line{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:1.8;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}.bus{stroke:#64748b;stroke-width:1.8;stroke-dasharray:7 6;fill:none}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="54" y="48" class="h">F446 elastic recovery: persistent global identity, disposable execution groups</text>

  <rect x="44" y="78" width="1192" height="152" rx="6" class="box c"/>
  <text x="68" y="110" class="t">Global recovery plane (all surviving ranks)</text>
  <rect x="76" y="132" width="230" height="68" rx="5" class="box d"/>
  <text x="191" y="158" text-anchor="middle" class="t">Failure observation</text>
  <text x="191" y="182" text-anchor="middle" class="s">Ack/Get_failed + Revoke</text>
  <rect x="388" y="132" width="230" height="68" rx="5" class="box c"/>
  <text x="503" y="158" text-anchor="middle" class="t">Durable membership</text>
  <text x="503" y="182" text-anchor="middle" class="s">prepare / receipt / generation</text>
  <rect x="700" y="132" width="230" height="68" rx="5" class="box c"/>
  <text x="815" y="158" text-anchor="middle" class="t">Shrink + attestation</text>
  <text x="815" y="182" text-anchor="middle" class="s">stable endpoint identities</text>
  <rect x="1012" y="132" width="190" height="68" rx="5" class="box a"/>
  <text x="1107" y="158" text-anchor="middle" class="t">Generation g+1</text>
  <text x="1107" y="182" text-anchor="middle" class="s">sealed role layout</text>
  <path d="M306 166H388M618 166H700M930 166H1012" class="line"/>

  <rect x="44" y="256" width="1192" height="246" rx="6" class="box a"/>
  <text x="68" y="290" class="t">Generation-local execution plane (rebuilt after each shrink)</text>
  <rect x="76" y="318" width="220" height="120" rx="5" class="box b"/>
  <text x="186" y="348" text-anchor="middle" class="t">Master group A</text>
  <text x="186" y="377" text-anchor="middle" class="s">master + workers</text>
  <text x="186" y="404" text-anchor="middle" class="note">READY / WORK / RESULT</text>
  <rect x="390" y="318" width="220" height="120" rx="5" class="box b"/>
  <text x="500" y="348" text-anchor="middle" class="t">Master group B</text>
  <text x="500" y="377" text-anchor="middle" class="s">master + workers</text>
  <text x="500" y="404" text-anchor="middle" class="note">independent data traffic</text>
  <rect x="704" y="318" width="220" height="120" rx="5" class="box d"/>
  <text x="814" y="348" text-anchor="middle" class="t">Warm standby</text>
  <text x="814" y="377" text-anchor="middle" class="s">global recovery only</text>
  <text x="814" y="404" text-anchor="middle" class="note">promoted by stable order</text>
  <rect x="1018" y="318" width="184" height="120" rx="5" class="box c"/>
  <text x="1110" y="348" text-anchor="middle" class="t">Master control</text>
  <text x="1110" y="377" text-anchor="middle" class="s">fresh communicator</text>
  <text x="1110" y="404" text-anchor="middle" class="note">filesystem requalified</text>
  <path d="M1107 200V240H186" class="bus"/>
  <path d="M186 240V318M500 240V318M814 240V318M1110 240V318" class="dash"/>

  <rect x="44" y="528" width="1192" height="146" rx="6" class="box d"/>
  <text x="68" y="560" class="t">Durable work and evidence plane (shared across generations)</text>
  <rect x="76" y="582" width="250" height="62" rx="5" class="box d"/>
  <text x="201" y="608" text-anchor="middle" class="t">Shared work WAL</text>
  <text x="201" y="631" text-anchor="middle" class="s">leased / committing / done</text>
  <rect x="394" y="582" width="250" height="62" rx="5" class="box d"/>
  <text x="519" y="608" text-anchor="middle" class="t">Global QueryStore</text>
  <text x="519" y="631" text-anchor="middle" class="s">membership + receipts + layouts</text>
  <rect x="712" y="582" width="206" height="62" rx="5" class="box d"/>
  <text x="815" y="608" text-anchor="middle" class="t">Staged results</text>
  <text x="815" y="631" text-anchor="middle" class="s">private until commit</text>
  <rect x="986" y="582" width="216" height="62" rx="5" class="box d"/>
  <text x="1094" y="608" text-anchor="middle" class="t">Public corpus</text>
  <text x="1094" y="631" text-anchor="middle" class="s">content-addressed objects</text>
  <path d="M326 613H394M644 613H712M918 613H986" class="line"/>
  <path d="M186 438V520H519M500 438V520" class="bus"/>
  <path d="M201 520V582M519 520V582" class="dash"/>
</svg>
