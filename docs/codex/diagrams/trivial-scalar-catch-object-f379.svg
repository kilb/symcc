<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <style>
      .title { font: 700 38px 'WenQuanYi Zen Hei', sans-serif; fill: #172033; }
      .subtitle { font: 400 19px 'WenQuanYi Zen Hei', sans-serif; fill: #526078; }
      .lane { font: 700 18px 'WenQuanYi Zen Hei', sans-serif; fill: #fff; }
      .head { font: 700 23px 'WenQuanYi Zen Hei', sans-serif; fill: #172033; }
      .body { font: 400 17px 'WenQuanYi Zen Hei', sans-serif; fill: #354158; }
      .small { font: 400 15px 'WenQuanYi Zen Hei', sans-serif; fill: #526078; }
      .mono { font: 600 16px 'WenQuanYi Zen Hei Mono', monospace; fill: #253148; }
      .inverse { fill: #edf3fa; }
      .arrow { stroke: #62738b; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .good { stroke: #137c6b; stroke-width: 4; fill: none; marker-end: url(#good-arrow); }
      .bad { stroke: #b44b4b; stroke-width: 3; fill: none; marker-end: url(#bad-arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#62738b"/></marker>
    <marker id="good-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#137c6b"/></marker>
    <marker id="bad-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b44b4b"/></marker>
  </defs>
  <rect width="1800" height="1100" fill="#f7f9fc"/>
  <rect width="1800" height="112" fill="#fff"/><rect y="110" width="1800" height="2" fill="#d9e0ea"/>
  <text x="70" y="57" class="title">F379 平凡标量 catch 对象：值投影，而非地址模拟</text>
  <text x="70" y="88" class="subtitle">精确 LLVM use-set 准入 · caught-phase 位宽证明 · CAS 跨进程恢复 · 失败关闭对象边界</text>

  <rect x="60" y="150" width="440" height="292" rx="8" fill="#fff" stroke="#aebbd0" stroke-width="2"/>
  <rect x="60" y="150" width="440" height="50" rx="8" fill="#315b88"/><rect x="60" y="192" width="440" height="8" fill="#315b88"/>
  <text x="84" y="183" class="lane">1  LLVM / Itanium-style catch</text>
  <text x="88" y="242" class="mono">%lp = landingpad {ptr,i32}</text>
  <text x="88" y="278" class="mono">%tok = extractvalue %lp, 0</text>
  <text x="88" y="314" class="mono">%obj = __cxa_begin_catch(%tok)</text>
  <rect x="83" y="337" width="390" height="45" rx="6" fill="#e9f6f2" stroke="#218b78" stroke-width="2"/>
  <text x="103" y="366" class="mono">%v = load i64, ptr %obj</text>
  <text x="88" y="414" class="mono">__cxa_end_catch()</text>

  <rect x="680" y="150" width="440" height="292" rx="8" fill="#fff" stroke="#aebbd0" stroke-width="2"/>
  <rect x="680" y="150" width="440" height="50" rx="8" fill="#4c657f"/><rect x="680" y="192" width="440" height="8" fill="#4c657f"/>
  <text x="704" y="183" class="lane">2  Lowering 证明门</text>
  <text x="710" y="239" class="body">全部 uses 都是 begin 上的直接 load</text>
  <text x="710" y="274" class="body">整数 1–64 bit、fixed size ≤ 8 byte</text>
  <text x="710" y="309" class="body">非 atomic、非 volatile、默认地址空间</text>
  <text x="710" y="344" class="body">token provenance + typed catch + lifecycle</text>
  <rect x="705" y="371" width="390" height="47" rx="6" fill="#eef3fb" stroke="#315b88" stroke-width="2"/>
  <text x="727" y="401" class="mono">exception_value(dst=v,bits=64)</text>

  <rect x="1300" y="150" width="440" height="292" rx="8" fill="#fff" stroke="#aebbd0" stroke-width="2"/>
  <rect x="1300" y="150" width="440" height="50" rx="8" fill="#137c6b"/><rect x="1300" y="192" width="440" height="8" fill="#137c6b"/>
  <text x="1324" y="183" class="lane">3  Executor 精确值投影</text>
  <text x="1330" y="239" class="mono">phase == caught (2)</text>
  <text x="1330" y="274" class="mono">catch_depth == frame_depth</text>
  <text x="1330" y="309" class="mono">payload.bits == load.bits</text>
  <rect x="1325" y="337" width="390" height="45" rx="6" fill="#e9f6f2" stroke="#218b78" stroke-width="2"/>
  <text x="1347" y="366" class="mono">local[v] := @exception:value</text>
  <text x="1330" y="414" class="body">复用 symbolic digest；不创建对象地址</text>

  <path d="M500 295 H670" class="arrow"/><path d="M1120 295 H1290" class="good"/>

  <text x="70" y="510" class="head">可迁移数据流与失败关闭边界</text>
  <rect x="65" y="545" width="790" height="235" rx="8" fill="#fff" stroke="#aebbd0" stroke-width="2"/>
  <text x="95" y="590" class="head">CAS checkpoint 中保存什么</text>
  <text x="95" y="631" class="mono">phase=2 · payload expression digest · type · token</text>
  <text x="95" y="670" class="mono">handler-depth · catch-depth · stack · memory · solver</text>
  <text x="95" y="714" class="body">另一 executor 恢复后，在相同 frame 执行 exception_value</text>
  <text x="95" y="749" class="small">地址、exception header、宿主 allocator 状态均不进入 checkpoint</text>

  <rect x="945" y="545" width="790" height="235" rx="8" fill="#fff" stroke="#c79494" stroke-width="2"/>
  <text x="975" y="590" class="head">明确拒绝，不能被误报为完整对象支持</text>
  <text x="975" y="631" class="body">GEP / cast / PHI / select / return / pointer load</text>
  <text x="975" y="670" class="body">store / atomic / volatile / float / vector / aggregate</text>
  <text x="975" y="709" class="body">payload 位宽不一致 / begin 前 / end 后 / 错误 frame</text>
  <text x="975" y="748" class="small">需要 exception arena、布局、所有权、析构与 RTTI 证明后才能扩展</text>

  <path d="M855 660 H935" class="bad"/>

  <rect x="65" y="835" width="1670" height="205" rx="8" fill="#172033"/>
  <text x="95" y="882" class="lane">能力闭包与结论</text>
  <text x="95" y="925" class="mono inverse">cleanup-unwind → typed-matching → catch-lifecycle → trivial-scalar-catch-object</text>
  <text x="95" y="970" class="body inverse">正例：normal=7，throw/catch=42；checkpoint 恢复保持同一符号值。</text>
  <text x="95" y="1007" class="body inverse">结论仅覆盖机制正确性与失败关闭；不声称完整 C++ ABI，也不推导 coverage/性能提升。</text>
</svg>
