<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">F373 report-only QueryStore artifact reachability audit</title>
  <desc id="desc">A schematic showing the database-only blind spot, publication-fenced SQLite and physical CAS observation, typed reachability classification, and fail-closed incomplete scans.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17232c" flood-opacity="0.13"/></filter>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#286f8e"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bd4b4b"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2b7b5d"/></marker>
    <style>
      .bg{fill:#f4f6f7}.panel{fill:#fff;stroke:#c8d0d5;stroke-width:2;filter:url(#shadow)}.blueBox{fill:#eef5fa;stroke:#78a5bd;stroke-width:2}.redBox{fill:#fff2f1;stroke:#dc8e88;stroke-width:2}.amber{fill:#fff8e5;stroke:#d2ad52;stroke-width:2}.greenBox{fill:#edf8f2;stroke:#71a78e;stroke-width:2}.neutral{fill:#f1f3f4;stroke:#929da5;stroke-width:2}
      .title{font:700 38px Arial,sans-serif;fill:#18232d}.subtitle{font:400 18px Arial,sans-serif;fill:#53616b}.section{font:700 24px Arial,sans-serif;fill:#25343e}.label{font:700 18px Arial,sans-serif;fill:#24323c}.body{font:400 16px Arial,sans-serif;fill:#354650}.small{font:400 14px Arial,sans-serif;fill:#56636c}.mono{font:600 15px 'DejaVu Sans Mono',monospace;fill:#26343e}.redText{fill:#a83c3c}.greenText{fill:#216e54}.blueText{fill:#245f7d}
      .line{fill:none;stroke:#286f8e;stroke-width:4;marker-end:url(#blue)}.lineRed{fill:none;stroke:#bd4b4b;stroke-width:4;marker-end:url(#red)}.lineGreen{fill:none;stroke:#2b7b5d;stroke-width:4;marker-end:url(#green)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1100"/>
  <text class="title" x="70" y="67">F373 · Report-Only Query Artifact Reachability Audit</text>
  <text class="subtitle" x="70" y="101">Freeze publication · join SQLite roots with physical CAS · classify uncertainty · delete nothing</text>

  <rect class="panel" x="60" y="132" width="1480" height="220" rx="8"/>
  <text class="section redText" x="90" y="174">Counterexample: a database-only view cannot describe the object namespace</text>
  <rect class="blueBox" x="92" y="205" width="305" height="110" rx="6"/>
  <text class="label" x="118" y="239">SQLite view</text><text class="mono" x="118" y="270">4 artifact rows · 3 roots</text><text class="small" x="118" y="296">finds 1 indexed orphan</text>
  <rect class="redBox" x="515" y="205" width="350" height="110" rx="6"/>
  <text class="label redText" x="541" y="239">Physical namespace</text><text class="mono redText" x="541" y="270">5 canonical objects</text><text class="small" x="541" y="296">includes 1 object with no row</text>
  <rect class="redBox" x="983" y="205" width="285" height="110" rx="6"/>
  <text class="label redText" x="1009" y="239">Namespace anomaly</text><text class="mono redText" x="1009" y="270">not-a-shard</text><text class="small" x="1009" y="296">not visible in SQL</text>
  <rect class="amber" x="1360" y="205" width="135" height="110" rx="6"/>
  <text class="label" x="1381" y="239">Blind</text><text class="mono" x="1381" y="270">2 gaps</text><text class="small" x="1381" y="296">no sweep</text>
  <path class="lineRed" d="M397 260H505"/><path class="lineRed" d="M865 260H973"/><path class="lineRed" d="M1268 260H1350"/>

  <rect class="panel" x="60" y="387" width="1480" height="500" rx="8"/>
  <text class="section blueText" x="90" y="431">One cooperative publication boundary, two independently observed domains</text>
  <rect class="amber" x="92" y="470" width="290" height="135" rx="6"/>
  <text class="label" x="118" y="505">Publication / audit lock</text><text class="mono" x="118" y="536">bounded exclusive flock</text><text class="body" x="118" y="567">ingest: CAS → row → query</text><text class="small" x="118" y="591">audit blocks new publication</text>

  <rect class="blueBox" x="465" y="462" width="315" height="150" rx="6"/>
  <text class="label" x="491" y="497">SQLite snapshot: MARK roots</text><text class="body" x="491" y="529">queries.{full,prefix,target}</text><text class="body" x="491" y="557">artifact row kind/path/size</text><text class="mono" x="491" y="586">UNION distinct digests</text>
  <rect class="blueBox" x="465" y="655" width="315" height="150" rx="6"/>
  <text class="label" x="491" y="690">Physical CAS inventory</text><text class="body" x="491" y="722">3 no-follow anchored roots</text><text class="body" x="491" y="750">regular canonical leaves only</text><text class="mono" x="491" y="779">global entry budget</text>

  <rect class="neutral" x="875" y="475" width="300" height="315" rx="6"/>
  <text class="label" x="901" y="510">Typed relational join</text>
  <text class="body" x="901" y="548">reachable primary</text><text class="body" x="901" y="581">reachable duplicate</text><text class="body" x="901" y="614">unreferenced row</text><text class="body" x="901" y="647">unindexed object</text><text class="body" x="901" y="680">dangling reference</text><text class="body" x="901" y="713">invalid row / missing primary</text><text class="body" x="901" y="746">noncanonical entry</text>
  <rect class="greenBox" x="1260" y="475" width="235" height="130" rx="6"/>
  <text class="label greenText" x="1286" y="510">Complete report</text><text class="mono greenText" x="1286" y="542">scan.complete=true</text><text class="small" x="1286" y="570">absence may be stated</text><text class="small" x="1286" y="591">objects still preserved</text>
  <rect class="redBox" x="1260" y="660" width="235" height="130" rx="6"/>
  <text class="label redText" x="1286" y="695">Budget exhausted</text><text class="mono redText" x="1286" y="727">missing = null</text><text class="small" x="1286" y="755">exit 2 · no absence claim</text><text class="small" x="1286" y="776">objects still preserved</text>

  <path class="line" d="M382 537H455"/><path class="line" d="M382 570H420V730H455"/>
  <path class="line" d="M780 537H865"/><path class="line" d="M780 730H865"/>
  <path class="lineGreen" d="M1175 550H1250"/><path class="lineRed" d="M1175 725H1250"/>
  <text class="small blueText" x="398" y="520">one lock</text>
  <rect class="neutral" x="92" y="827" width="1403" height="38" rx="6"/>
  <text class="mono" x="118" y="852">Invariant: mode=report-only · safe_to_sweep=false · content_digests_verified=false · sweep_authorized=false</text>

  <rect class="panel" x="60" y="922" width="1480" height="120" rx="8"/>
  <text class="section greenText" x="90" y="962">Measured mechanism evidence</text>
  <text class="body" x="90" y="995">Production: 1 indexed orphan + 1 unindexed physical orphan + 1 namespace anomaly, all preserved</text>
  <text class="body" x="90" y="1023">Bounded scan: 1 entry → incomplete + null absence · Publication fence: audit sees 3 roots, next ingest commits afterward</text>
</svg>
