<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1400" viewBox="0 0 1900 1400" role="img" aria-labelledby="title desc">
  <title id="title">F338 完整预验证的流式有界内存 retired-root 发现</title>
  <desc id="desc">展示 shared root 单遍扫描、reserved name 和 no-follow 类型验证、容量为 L 的反序堆、F337 三预算删除，以及旧新算法复杂度和实验结果。</desc>
  <style>
    text { font-family: "WenQuanYi Zen Hei", Arial, sans-serif; letter-spacing: 0; fill: #172033; }
    .title { font-size: 48px; font-weight: 700; }
    .subtitle { font-size: 23px; fill: #4b5565; }
    .section { font-size: 27px; font-weight: 700; }
    .label { font-size: 22px; font-weight: 700; }
    .body { font-size: 20px; }
    .small { font-size: 17px; fill: #4b5565; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 18px; }
    .panel { fill: #ffffff; stroke: #c8d0dc; stroke-width: 2; rx: 8; }
    .blue { fill: #eaf3ff; stroke: #3983c6; stroke-width: 2.5; rx: 8; }
    .green { fill: #e9f7ef; stroke: #2f8f5b; stroke-width: 2.5; rx: 8; }
    .amber { fill: #fff4dc; stroke: #c58417; stroke-width: 2.5; rx: 8; }
    .red { fill: #fff0ef; stroke: #c64b43; stroke-width: 2.5; rx: 8; }
    .dark { fill: #263247; stroke: #263247; stroke-width: 2; rx: 8; }
    .darktext { fill: #ffffff; }
    .arrow { stroke: #59677c; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    .thin { stroke: #8793a5; stroke-width: 2; fill: none; }
    .dash { stroke: #8793a5; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#59677c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1900" height="1400" fill="#f5f7fa"/>
  <rect x="0" y="0" width="1900" height="12" fill="#2f8f5b"/>
  <text x="70" y="78" class="title">F338  流式、有界内存的 Retired-Root 发现</text>
  <text x="72" y="118" class="subtitle">完整 reserved namespace 预验证不变；只保存词法最小 L 个候选；发现与删除遥测分离</text>

  <text x="70" y="177" class="section">生产执行流</text>

  <rect x="70" y="205" width="290" height="250" class="blue"/>
  <text x="95" y="245" class="label">Shared root：N 个条目</text>
  <rect x="100" y="273" width="230" height="34" fill="#ffffff" stroke="#3983c6" rx="4"/>
  <text x="115" y="297" class="mono">corpus / lock / active</text>
  <rect x="100" y="319" width="230" height="34" fill="#dcecff" stroke="#3983c6" rx="4"/>
  <text x="115" y="343" class="mono">retired-...-0003</text>
  <rect x="100" y="365" width="230" height="34" fill="#dcecff" stroke="#3983c6" rx="4"/>
  <text x="115" y="389" class="mono">retired-...-0011</text>
  <text x="100" y="428" class="small">枚举顺序任意；不假定到达顺序</text>

  <path d="M360 330 L430 330" class="arrow"/>

  <rect x="430" y="205" width="300" height="250" class="green"/>
  <text x="455" y="245" class="label">单遍流式扫描</text>
  <text x="455" y="285" class="body">1. with os.scandir(shared)</text>
  <text x="455" y="321" class="body">2. 精确解析 reserved name</text>
  <text x="455" y="357" class="body">3. is_dir(follow_symlinks=False)</text>
  <text x="455" y="393" class="body">4. 每个 DirEntry 用后即释放</text>
  <text x="455" y="429" class="small">畸形名 / symlink / I/O 错误：删除前失败</text>

  <path d="M730 330 L800 330" class="arrow"/>

  <rect x="800" y="205" width="360" height="250" class="amber"/>
  <text x="825" y="245" class="label">容量 ≤ L 的反序 min-heap</text>
  <text x="825" y="280" class="small">heap[0] = 当前保留集合中的最大名称</text>
  <g transform="translate(840,305)">
    <rect x="0" y="0" width="58" height="48" fill="#ffffff" stroke="#c58417" rx="4"/><text x="16" y="31" class="mono">03</text>
    <rect x="68" y="0" width="58" height="48" fill="#ffffff" stroke="#c58417" rx="4"/><text x="84" y="31" class="mono">01</text>
    <rect x="136" y="0" width="58" height="48" fill="#ffffff" stroke="#c58417" rx="4"/><text x="152" y="31" class="mono">02</text>
    <rect x="204" y="0" width="58" height="48" fill="#ffffff" stroke="#c58417" rx="4"/><text x="220" y="31" class="mono">00</text>
  </g>
  <text x="825" y="385" class="body">x &lt; heap[0] → heapreplace(x)</text>
  <text x="825" y="421" class="body">否则丢弃；扫描完再排序 ≤ L 项</text>

  <path d="M1160 330 L1230 330" class="arrow"/>

  <rect x="1230" y="205" width="310" height="250" class="green"/>
  <text x="1255" y="245" class="label">F337 三预算删除</text>
  <text x="1255" y="288" class="body">root limit：L</text>
  <text x="1255" y="324" class="body">entry mutation budget</text>
  <text x="1255" y="360" class="body">cooperative time budget</text>
  <text x="1255" y="400" class="small">descriptor-relative / no-follow</text>
  <text x="1255" y="427" class="small">部分树可跨启动恢复</text>

  <path d="M1540 330 L1610 330" class="arrow"/>

  <rect x="1610" y="205" width="220" height="250" class="dark"/>
  <text x="1635" y="245" class="label darktext">结构化遥测</text>
  <text x="1635" y="288" class="body darktext">scanned = N</text>
  <text x="1635" y="324" class="body darktext">candidates = R</text>
  <text x="1635" y="360" class="body darktext">selected ≤ L</text>
  <text x="1635" y="396" class="body darktext">removed entries</text>
  <text x="1635" y="429" class="small darktext">stop reason / partial root</text>

  <rect x="70" y="500" width="1760" height="122" class="panel"/>
  <text x="95" y="540" class="label">循环不变量</text>
  <text x="290" y="540" class="mono">H_k = smallest_L(P_k)</text>
  <text x="650" y="540" class="body">且</text>
  <text x="700" y="540" class="mono">|H_k| = min(k, L)</text>
  <path d="M95 565 L1800 565" class="thin"/>
  <text x="95" y="596" class="body">扫描完整结束之前不进入删除阶段，因此任意位置的畸形 reserved 对象仍会在首次 mutation 前阻断启动。</text>

  <text x="70" y="683" class="section">复杂度与资源形态</text>
  <rect x="70" y="710" width="540" height="315" class="red"/>
  <text x="100" y="752" class="label">F337：全量物化 + 全排序</text>
  <text x="100" y="792" class="mono">tuple(scandir) → candidates → sorted</text>
  <text x="100" y="840" class="body">保留状态：O(N + R)</text>
  <text x="100" y="877" class="body">选择工作：O(R log R)</text>
  <rect x="100" y="914" width="450" height="38" fill="#d95c52" rx="4"/>
  <text x="115" y="940" class="small darktext">N 个 DirEntry + R 个候选名称</text>
  <text x="100" y="988" class="small">完整预验证正确，但 Python 峰值随 namespace 增长</text>

  <rect x="650" y="710" width="540" height="315" class="green"/>
  <text x="680" y="752" class="label">F338：单遍验证 + 固定 Top-K</text>
  <text x="680" y="792" class="mono">scandir stream → heap(capacity=L)</text>
  <text x="680" y="840" class="body">保留状态：O(min(R, L))</text>
  <text x="680" y="877" class="body">选择工作：O(R log min(R,L))</text>
  <rect x="680" y="914" width="72" height="38" fill="#3ca66b" rx="4"/>
  <text x="692" y="940" class="small darktext">≤ L</text>
  <path d="M765 933 L1120 933" class="dash"/>
  <text x="680" y="988" class="small">完整预验证保持；目录读取与类型检查仍为 O(N)</text>

  <rect x="1230" y="710" width="600" height="315" class="blue"/>
  <text x="1260" y="752" class="label">4096 候选，L=8，本机 overlayfs</text>
  <text x="1260" y="798" class="body">Python traced peak</text>
  <rect x="1465" y="777" width="315" height="30" fill="#d95c52" rx="3"/>
  <text x="1475" y="799" class="small darktext">旧 1,995,370 B</text>
  <rect x="1465" y="817" width="18" height="30" fill="#3ca66b" rx="3"/>
  <text x="1495" y="839" class="small">新 3,652 B（546.38x）</text>
  <text x="1260" y="889" class="body">选择时间中位</text>
  <rect x="1465" y="868" width="287" height="30" fill="#d95c52" rx="3"/>
  <text x="1475" y="890" class="small darktext">旧 9,245.085 us</text>
  <rect x="1465" y="908" width="290" height="30" fill="#3ca66b" rx="3"/>
  <text x="1475" y="930" class="small darktext">新 9,356.031 us</text>
  <text x="1260" y="978" class="small">内存显著下降；时间慢 1.20%，不宣称 speedup</text>

  <text x="70" y="1087" class="section">可执行证据与严格边界</text>
  <rect x="70" y="1115" width="540" height="205" class="panel"/>
  <text x="100" y="1155" class="label">自动化回归</text>
  <text x="100" y="1194" class="body">205 passed + 43 subtests（定向）</text>
  <text x="100" y="1230" class="body">322 passed + 51 subtests（关联）</text>
  <text x="100" y="1266" class="body">718 passed + 71 subtests（完整）</text>

  <rect x="650" y="1115" width="540" height="205" class="panel"/>
  <text x="680" y="1155" class="label">真实 Open MPI，同机</text>
  <text x="680" y="1194" class="body">7 ranks / 2 masters / 5 workers</text>
  <text x="680" y="1230" class="body">scan 19 / candidate 17 / selected 4</text>
  <text x="680" y="1266" class="body">根守恒 17 - 4 + 1 = 14；exit 0</text>

  <rect x="1230" y="1115" width="600" height="205" class="amber"/>
  <text x="1260" y="1155" class="label">尚未解决</text>
  <text x="1260" y="1194" class="body">- 完整 getdents / type validation 时延仍为 O(N)</text>
  <text x="1260" y="1230" class="body">- 词法顺序不是到达时间公平</text>
  <text x="1260" y="1266" class="body">- 无真实多机存储、DSE/coverage/LAVA-M 收益结论</text>

  <text x="70" y="1370" class="small">F338 evidence scope: implementation + tests + same-host real MPI + local timing/tracemalloc; no hard scan-time or campaign uplift claim.</text>
</svg>
