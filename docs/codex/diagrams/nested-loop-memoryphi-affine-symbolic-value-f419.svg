<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">F419 nested-loop MemoryPhi affine symbolic value summary</title>
  <desc id="desc">Producer, proof certificate, strict consumer, last-writer selection, and runtime authority boundary.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px "WenQuanYi Zen Hei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px "WenQuanYi Zen Hei", sans-serif; fill: #475569; }
      .h { font: 700 21px "WenQuanYi Zen Hei", sans-serif; fill: #0f172a; }
      .t { font: 400 16px "WenQuanYi Zen Hei", sans-serif; fill: #1e293b; }
      .s { font: 400 14px "WenQuanYi Zen Hei", sans-serif; fill: #475569; }
      .mono { font: 600 16px "WenQuanYi Zen Hei Mono", monospace; fill: #172554; }
      .white { fill: #ffffff; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <rect x="0" y="0" width="1600" height="94" fill="#0f172a"/>
  <text x="70" y="51" class="title white">F419  Affine Symbolic Writer-Value Summary</text>
  <text x="70" y="78" class="subtitle" fill="#cbd5e1">二维地址实例 + 有限位向量值 + 可独立重建的 proof-carrying last-write</text>

  <rect x="55" y="132" width="360" height="285" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="91" cy="169" r="18" fill="#2563eb"/>
  <text x="85" y="176" class="h white">1</text>
  <text x="122" y="176" class="h">LLVM producer 证明域</text>
  <text x="83" y="218" class="t">- 两层 natural loop / 双 MemoryPhi</text>
  <text x="83" y="250" class="t">- ordered simple-store MemoryDef chain</text>
  <text x="83" y="282" class="t">- 有限 outer x inner 最大实例域</text>
  <text x="83" y="314" class="t">- pointer alias / object / byte width 闭合</text>
  <rect x="83" y="342" width="304" height="50" rx="4" fill="#ffffff" stroke="#93c5fd"/>
  <text x="101" y="372" class="mono">addr = base + p(c + ao*o + ai*i)</text>

  <rect x="475" y="132" width="650" height="285" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="511" cy="169" r="18" fill="#16a34a"/>
  <text x="505" y="176" class="h white">2</text>
  <text x="542" y="176" class="h">SSA value 归一化与语义隔离</text>
  <text x="505" y="218" class="t">同位宽叶：ConstantInt、outer IV、inner IV、至多一个入口 integer argument</text>
  <text x="505" y="250" class="t">组合：add 或“直接正常量 x 子表达式”；深度不超过 4；系数均有界</text>
  <rect x="505" y="276" width="590" height="55" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="531" y="310" class="mono">V(o,i,x) = c_v + a_o*o + a_i*i + a_x*x  (mod 2^w)</text>
  <text x="505" y="360" class="s">普通 add/mul：LLVM modulo 2^w 位向量语义</text>
  <text x="505" y="388" class="s" fill="#b91c1c">nuw/nsw、sub、多个输入、跨块/过深 DAG：producer fail closed</text>

  <rect x="1185" y="132" width="360" height="285" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1221" cy="169" r="18" fill="#ea580c"/>
  <text x="1215" y="176" class="h white">3</text>
  <text x="1252" y="176" class="h">入口 ABI 绑定</text>
  <text x="1213" y="218" class="t">input byte offset 连续且唯一</text>
  <text x="1213" y="250" class="t">zext / shl / or 按 little-endian 拼接</text>
  <text x="1213" y="282" class="t">最终 identity 绑定真实 argument SSA</text>
  <rect x="1213" y="316" width="304" height="76" rx="4" fill="#ffffff" stroke="#fdba74"/>
  <text x="1231" y="346" class="mono">arg3 &lt;- input[3..4]</text>
  <text x="1231" y="374" class="s">证书记录 variable / offset / bytes</text>

  <path d="M415 274 L465 274" class="arrow"/>
  <path d="M1125 274 L1175 274" class="arrow"/>

  <rect x="235" y="475" width="1130" height="190" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
  <text x="270" y="517" class="h" fill="#6d28d9">v9 proof certificate</text>
  <line x1="270" y1="535" x2="1330" y2="535" stroke="#ddd6fe" stroke-width="2"/>
  <text x="275" y="573" class="t">writer.stored_value</text>
  <text x="275" y="603" class="mono">{ bits, c_v, a_o, a_i, a_x, input binding, modulo-2^bits }</text>
  <text x="850" y="573" class="t">last_write_case</text>
  <text x="850" y="603" class="mono">{ min Bo, min Bi, extract-byte(low_bit) }</text>
  <text x="275" y="638" class="s">case order：outer desc，inner desc，writer ordinal desc；无命中 = uninitialized</text>
  <text x="1040" y="638" class="s" fill="#6d28d9">capability dependency closed</text>

  <path d="M800 417 L800 465" class="arrow"/>
  <path d="M1365 275 C1430 330 1440 420 1345 470" class="arrow"/>

  <rect x="55" y="730" width="690" height="190" rx="6" fill="#fef3c7" stroke="#ca8a04" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="91" cy="767" r="18" fill="#ca8a04"/>
  <text x="85" y="774" class="h white">4</text>
  <text x="122" y="774" class="h">strict consumer 独立重建</text>
  <text x="83" y="815" class="t">重新解析 CFG、PHI edge、dominance、pointer/store 与 bound 域</text>
  <text x="83" y="847" class="t">重新解析入口字节拼接和 store SSA 公式；重算实例、顺序与 byte extract</text>
  <text x="83" y="879" class="t">字段、公式、IR、capability 任一不同均在执行前拒绝</text>

  <rect x="855" y="730" width="690" height="190" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="891" cy="767" r="18" fill="#475569"/>
  <text x="885" y="774" class="h white">5</text>
  <text x="922" y="774" class="h">runtime 权威边界</text>
  <text x="883" y="815" class="t">当前仍执行真实循环与真实 store，不以证书跳过循环</text>
  <text x="883" y="847" class="t">path-local byte-init bitmap 决定具体输入下的 definedness</text>
  <text x="883" y="879" class="t">v9 是可验证分析事实，不等同于已测得 coverage / solver speedup</text>

  <path d="M600 665 L425 720" class="arrow"/>
  <path d="M1000 665 L1175 720" class="arrow"/>
  <path d="M745 825 L845 825" class="arrow"/>
  <path d="M1175 920 C1175 952 425 952 425 930" class="dash"/>
  <text x="675" y="968" class="s">concrete execution feedback / regression oracle</text>
</svg>
