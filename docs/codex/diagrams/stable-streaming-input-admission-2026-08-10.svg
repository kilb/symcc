<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1400" viewBox="0 0 1900 1400" role="img" aria-labelledby="title desc">
  <title id="title">F341 stable streaming input admission</title>
  <desc id="desc">Stable external seed snapshot, bounded content-addressed publication, one-pass worker copy, failure boundaries, and honest corpus accounting.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#334155"/>
    </marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#b42318"/>
    </marker>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#102a43}.subtitle{font:22px Arial,sans-serif;fill:#486581}
      .section{font:700 25px Arial,sans-serif;fill:#102a43}.head{font:700 21px Arial,sans-serif;fill:#102a43}
      .body{font:18px Arial,sans-serif;fill:#243b53}.small{font:16px Arial,sans-serif;fill:#486581}
      .mono{font:17px 'DejaVu Sans Mono',monospace;fill:#102a43}.metric{font:700 20px Arial,sans-serif;fill:#102a43}
      .box{fill:#fff;stroke:#9fb3c8;stroke-width:2}.blue{fill:#e8f1fb;stroke:#2878b5;stroke-width:2.5}
      .green{fill:#e9f7ef;stroke:#2f855a;stroke-width:2.5}.amber{fill:#fff6df;stroke:#b7791f;stroke-width:2.5}
      .red{fill:#fff0ef;stroke:#b42318;stroke-width:2.5}.slate{fill:#f2f5f8;stroke:#627d98;stroke-width:2}
      .flow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
      .fail{fill:none;stroke:#b42318;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#redArrow)}
    </style>
  </defs>
  <rect width="1900" height="1400" fill="#f8fafc"/>
  <rect x="0" y="0" width="1900" height="118" fill="#dce9f5"/>
  <text id="diagram-title" x="70" y="57" class="title">F341 · Stable Streaming Input Admission</text>
  <text x="70" y="91" class="subtitle">将外部 seed、公共 corpus 与 worker 私有输入统一到稳定 inode 身份、固定窗口和显式预算</text>

  <rect x="55" y="150" width="420" height="360" rx="8" class="red"/>
  <text x="82" y="190" class="section">审查发现的旧路径</text>
  <text x="82" y="232" class="head">1  无界 Python 内容对象</text>
  <text x="102" y="263" class="mono">content = f.read()</text>
  <text x="102" y="291" class="small">峰值内存随单个 seed 大小线性增长</text>
  <text x="82" y="335" class="head">2  类型检查与打开分离</text>
  <text x="102" y="366" class="body">is_file(no-follow) → open(follow)</text>
  <text x="102" y="394" class="small">替换窗口可令被哈希 inode 与路径身份漂移</text>
  <text x="82" y="438" class="head">3  统计并非 corpus 语义</text>
  <text x="102" y="469" class="body">listdir + isfile + startup seed count</text>
  <text x="102" y="497" class="small">元数据、链接与晚到外部输入会污染结果</text>

  <rect x="515" y="150" width="1330" height="690" rx="8" class="box"/>
  <text x="550" y="194" class="section">Master：两阶段稳定准入</text>

  <rect x="555" y="235" width="245" height="150" rx="7" class="blue"/>
  <text x="580" y="271" class="head">外部 queue entry</text>
  <text x="580" y="304" class="body">name + no-follow stat</text>
  <text x="580" y="333" class="small">缓存完整 identity，</text>
  <text x="580" y="357" class="small">而非只缓存 filename</text>

  <rect x="860" y="215" width="350" height="190" rx="7" class="green"/>
  <text x="885" y="251" class="head">阶段 A：稳定摘要快照</text>
  <text x="885" y="285" class="mono">open(O_NOFOLLOW)</text>
  <text x="885" y="315" class="body">fstat-before → 1 MiB hash stream</text>
  <text x="885" y="345" class="body">fstat-after + no-follow path stat</text>
  <text x="885" y="375" class="small">dev/ino/size/mtime/ctime 全部一致</text>

  <rect x="1270" y="235" width="245" height="150" rx="7" class="amber"/>
  <text x="1295" y="271" class="head">内容级 rendezvous</text>
  <text x="1295" y="305" class="mono">owner = HRW(hash)</text>
  <text x="1295" y="335" class="small">所有 master 得到同一</text>
  <text x="1295" y="359" class="small">SHA-256 与外部 provenance</text>

  <rect x="1570" y="215" width="235" height="190" rx="7" class="green"/>
  <text x="1595" y="251" class="head">阶段 B：owner 发布</text>
  <text x="1595" y="285" class="body">按阶段 A identity 重开</text>
  <text x="1595" y="315" class="body">固定窗口 copy + hash</text>
  <text x="1595" y="345" class="body">file fsync → atomic rename</text>
  <text x="1595" y="375" class="small">目标名 = 内容 SHA-256</text>

  <path d="M800 310 H850" class="flow"/>
  <path d="M1210 310 H1260" class="flow"/>
  <path d="M1515 310 H1560" class="flow"/>

  <rect x="655" y="470" width="325" height="135" rx="7" class="red"/>
  <text x="680" y="507" class="head">身份变化 / 读取不稳定</text>
  <text x="680" y="540" class="body">不记录该 filename identity</text>
  <text x="680" y="570" class="metric">下一次扫描可重试</text>
  <path d="M1035 405 C1035 445 935 445 900 462" class="fail"/>

  <rect x="1050" y="470" width="325" height="135" rx="7" class="red"/>
  <text x="1075" y="507" class="head">observed bytes &gt; input limit</text>
  <text x="1075" y="540" class="body">不发布、不派发、不确定性重试</text>
  <text x="1075" y="570" class="metric">bounded shutdown → Abort(70)</text>
  <path d="M1160 405 C1160 440 1200 445 1205 462" class="fail"/>

  <rect x="550" y="665" width="1255" height="125" rx="7" class="slate"/>
  <text x="580" y="703" class="head">配置不变量</text>
  <text x="580" y="739" class="mono">RESULT_MAX_BYTES ≤ INPUT_MAX_BYTES</text>
  <text x="1005" y="739" class="body">⇒ 每个已准入 child 均可成为下一代输入</text>
  <text x="580" y="769" class="small">rank 0 严格解析并广播；非法值或不一致组合在 shared-state 初始化前 Abort(68)</text>

  <rect x="55" y="870" width="880" height="300" rx="8" class="blue"/>
  <text x="85" y="914" class="section">Worker：一次复制同时完成身份校验</text>
  <rect x="95" y="965" width="220" height="120" rx="7" class="box"/>
  <text x="120" y="1002" class="head">public/{hash}</text>
  <text x="120" y="1035" class="small">no-follow regular fd</text>
  <text x="120" y="1063" class="small">expected SHA-256</text>
  <rect x="365" y="945" width="280" height="160" rx="7" class="green"/>
  <text x="390" y="982" class="head">固定 1 MiB stream</text>
  <text x="390" y="1017" class="body">copy + SHA-256 同一字节流</text>
  <text x="390" y="1048" class="body">稳定 identity + byte limit</text>
  <text x="390" y="1078" class="small">替代 copy2 后的第二次 digest read</text>
  <rect x="695" y="965" width="200" height="120" rx="7" class="box"/>
  <text x="720" y="1002" class="head">private input</text>
  <text x="720" y="1035" class="small">fsync-backed replace</text>
  <text x="720" y="1063" class="small">随后执行 target</text>
  <path d="M315 1025 H355" class="flow"/>
  <path d="M645 1025 H685" class="flow"/>

  <rect x="965" y="870" width="880" height="300" rx="8" class="amber"/>
  <text x="995" y="914" class="section">关闭统计：只报告可解释的 corpus 增长</text>
  <text x="1010" y="968" class="body">context-managed scandir，只接收 64-hex + no-follow regular</text>
  <text x="1010" y="1012" class="mono">new_interesting = canonical_public − all_external_hashes</text>
  <text x="1010" y="1054" class="body">同名替换后的新内容仍属于 external；notes、工作目录与 symlink 不计数</text>
  <text x="1010" y="1097" class="small">保留 corpus-sized filename/identity/hash metadata；不是全局 O(1) 内存</text>

  <rect x="55" y="1200" width="1790" height="145" rx="8" class="slate"/>
  <text x="85" y="1239" class="section">当前证据边界</text>
  <text x="85" y="1277" class="metric">真实 MPI：同名 replacement 2/2 执行、external=2、new=0、exit 0；17 B &gt; 16 B 在 target 前 exit 70</text>
  <text x="85" y="1313" class="body">32 MiB：tracemalloc 峰值 35,653,392 → 2,099,834 B（16.98×），RSS 67,538 → 35,264 KiB（1.92×），时间 +11.04%</text>
  <text x="85" y="1338" class="small">同机 local overlayfs 机制证据；不代表真实多机、solver、coverage、campaign、漏洞或 LAVA-M 提升</text>
</svg>
