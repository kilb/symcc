<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">F355 Total Cluster-Lock Qualification Boundary</title>
  <desc id="desc">The previous producer-side exception escape, the public qualification totalization boundary, normalized outcomes, and startup and renewal consumers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#38566f"/>
    </marker>
    <style>
      .bg { fill: #f7f9fb; }
      .title { font: 700 36px Inter, Arial, sans-serif; fill: #142433; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #40566a; }
      .section { font: 700 23px Inter, Arial, sans-serif; fill: #142433; }
      .label { font: 700 18px Inter, Arial, sans-serif; fill: #20384c; }
      .body { font: 400 16px Inter, Arial, sans-serif; fill: #314b60; }
      .small { font: 400 14px Inter, Arial, sans-serif; fill: #486176; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #243b50; }
      .panel { fill: #ffffff; stroke: #cbd7e1; stroke-width: 2; }
      .old { fill: #fff3f1; stroke: #ce6158; stroke-width: 2; }
      .core { fill: #edf5fa; stroke: #38769d; stroke-width: 2; }
      .good { fill: #edf8f0; stroke: #39845a; stroke-width: 2; }
      .warn { fill: #fff8e7; stroke: #b68020; stroke-width: 2; }
      .signal { fill: #f3eff8; stroke: #735a91; stroke-width: 2; }
      .line { fill: none; stroke: #38566f; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #a04c45; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1080"/>
  <text class="title" x="70" y="66">F355 - Total Cluster-Lock Qualification Boundary</text>
  <text class="subtitle" x="70" y="101">Close producer-side exception escape before startup abort and renewal admission</text>

  <rect class="old" x="70" y="145" width="430" height="330" rx="8"/>
  <text class="section" x="100" y="185">Before: partial catch lists</text>
  <rect class="panel" x="105" y="217" width="360" height="66" rx="6"/>
  <text class="label" x="130" y="246">comm.Get_rank()</text>
  <text class="small" x="130" y="269">Adapter may raise an ordinary error</text>
  <path class="dash" d="M285 283 L285 326"/>
  <rect class="old" x="105" y="327" width="360" height="64" rx="6"/>
  <text class="mono" x="130" y="356">LookupError escapes</text>
  <text class="small" x="130" y="379">Not present in the local type tuple</text>
  <path class="dash" d="M285 391 L285 425"/>
  <text class="label" x="130" y="445">No qualification result</text>
  <text class="small" x="130" y="468">Abort/fatal-control consumers are bypassed</text>

  <rect class="core" x="555" y="145" width="975" height="330" rx="8"/>
  <text class="section" x="585" y="185">After: one public producer boundary</text>
  <rect class="panel" x="590" y="219" width="320" height="100" rx="6"/>
  <text class="label" x="615" y="250">Protocol implementation</text>
  <text class="mono" x="615" y="278">_qualify_mpi_...()</text>
  <text class="small" x="615" y="302">Membership / lock / identity / transcript</text>
  <path class="line" d="M910 269 L980 269"/>
  <rect class="core" x="985" y="207" width="500" height="124" rx="6"/>
  <text class="label" x="1015" y="240">qualify_mpi_cluster_advisory_lock()</text>
  <text class="body" x="1015" y="270">Return successful protocol results unchanged</text>
  <text class="body" x="1015" y="295">Catch Exception and synthesize a failed result</text>
  <text class="small" x="1015" y="317">Do not catch process-control BaseException</text>

  <path class="line" d="M1235 331 L1235 368"/>
  <rect class="good" x="590" y="369" width="272" height="78" rx="6"/>
  <text class="mono" x="615" y="400">protocol result</text>
  <text class="small" x="615" y="426">Exact existing success semantics</text>
  <rect class="warn" x="884" y="369" width="300" height="78" rx="6"/>
  <text class="mono" x="909" y="400">clean=False</text>
  <text class="small" x="909" y="426">Ordinary error becomes a value</text>
  <rect class="signal" x="1206" y="369" width="279" height="78" rx="6"/>
  <text class="mono" x="1231" y="400">BaseException</text>
  <text class="small" x="1231" y="426">Propagate interrupt / exit</text>

  <text class="section" x="70" y="540">Normalized failure result</text>
  <rect class="panel" x="70" y="570" width="950" height="245" rx="8"/>
  <line x1="545" y1="570" x2="545" y2="815" stroke="#d8e1e8" stroke-width="2"/>
  <text class="label" x="105" y="610">Proof state: fail closed</text>
  <text class="mono" x="105" y="646">clean = verified = False</text>
  <text class="mono" x="105" y="679">members = representatives = ()</text>
  <text class="mono" x="105" y="712">all proof counters = 0</text>
  <text class="mono" x="105" y="745">proof_transcript = ""</text>
  <text class="small" x="105" y="780">No partial observation is promoted to proof</text>

  <text class="label" x="580" y="610">Metadata: bounded and typed</text>
  <text class="mono" x="580" y="646">error length &lt;= 512</text>
  <text class="mono" x="580" y="679">newline / NUL -&gt; "?"</text>
  <text class="mono" x="580" y="712">valid generation retained</text>
  <text class="mono" x="580" y="745">elapsed = 0.0 sentinel</text>
  <text class="small" x="580" y="780">Invalid capability or generation is normalized</text>

  <rect class="core" x="1050" y="570" width="480" height="245" rx="8"/>
  <text class="label" x="1085" y="610">Two consuming paths</text>
  <rect class="panel" x="1085" y="635" width="410" height="62" rx="6"/>
  <text class="body" x="1110" y="662">Startup: clean=False -&gt; Abort(65)</text>
  <text class="small" x="1110" y="684">Unified root diagnostic</text>
  <rect class="panel" x="1085" y="718" width="410" height="67" rx="6"/>
  <text class="body" x="1110" y="745">Renewal: F353/F354 admission</text>
  <text class="small" x="1110" y="770">Commit failure -&gt; fatal-control shutdown</text>

  <text class="section" x="70" y="882">Composed contract and evidence boundary</text>
  <rect class="core" x="70" y="912" width="950" height="116" rx="8"/>
  <text class="mono" x="105" y="954">protocol -&gt; total result -&gt; atomic admission -&gt; ordered shutdown</text>
  <text class="body" x="105" y="989">Producer exception commits a failed attempt; consumer exception retains pre-state</text>
  <text class="small" x="105" y="1015">Success path adds no MPI phase, filesystem I/O, hash, or payload copy</text>

  <rect class="panel" x="1050" y="912" width="480" height="116" rx="8"/>
  <text class="label" x="1085" y="951">10 / 10 mechanism checks</text>
  <text class="body" x="1085" y="982">Deterministic local evidence</text>
  <text class="small" x="1085" y="1008">No real MPI, ULFM, coverage, or uplift claim</text>
</svg>
