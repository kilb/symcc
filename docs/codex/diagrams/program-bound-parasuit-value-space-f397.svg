<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">F397 program-bound ParaSuit value-space workflow</title>
  <desc id="desc">Program identity and assignment observations enter a bounded value window, deterministic MeanShift and silhouette gate, then exploration or exploitation. A hash-bound state pair protects reuse.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17212b" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495e"/></marker>
    <style>
      .bg{fill:#f7f8fa}.panel{fill:#fff;stroke:#cbd3dc;stroke-width:2;filter:url(#shadow)}
      .navy{fill:#17324d}.teal{fill:#087f8c}.green{fill:#2f855a}.amber{fill:#c56a00}.red{fill:#b5483a}
      .title{font:700 34px system-ui,sans-serif;fill:#17212b}.sub{font:400 18px system-ui,sans-serif;fill:#536273}
      .h{font:700 21px system-ui,sans-serif;fill:#17212b}.body{font:400 17px system-ui,sans-serif;fill:#34495e}
      .white{font:700 20px system-ui,sans-serif;fill:#fff}.small{font:400 15px system-ui,sans-serif;fill:#536273}
      .mono{font:600 15px ui-monospace,SFMono-Regular,monospace;fill:#34495e}.line{fill:none;stroke:#34495e;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#718096;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text class="title" x="80" y="70">F397 · Program-Bound ParaSuit Value Space</text>
  <text class="sub" x="80" y="105">Bounded, deterministic and recoverable value exploration / exploitation</text>

  <rect class="panel" x="70" y="155" width="300" height="220" rx="8"/>
  <rect class="navy" x="70" y="155" width="300" height="54" rx="8"/>
  <rect class="navy" x="70" y="193" width="300" height="16"/>
  <text class="white" x="96" y="190">1 · Program identity</text>
  <text class="body" x="96" y="244">Exact target argv</text>
  <text class="body" x="96" y="279">Executable content SHA-256</text>
  <text class="body" x="96" y="314">task schema + provenance</text>
  <text class="mono" x="96" y="349">program_identity_hash</text>

  <rect class="panel" x="445" y="155" width="330" height="220" rx="8"/>
  <rect class="teal" x="445" y="155" width="330" height="54" rx="8"/>
  <rect class="teal" x="445" y="193" width="330" height="16"/>
  <text class="white" x="471" y="190">2 · Exact attribution</text>
  <text class="body" x="471" y="244">Consume assignment token once</text>
  <text class="body" x="471" y="279">Selected task parameters only</text>
  <text class="body" x="471" y="314">reward / elapsed / killed</text>
  <text class="small" x="471" y="348">NaN / Inf totalize · replay ignored</text>

  <rect class="panel" x="850" y="155" width="315" height="220" rx="8"/>
  <rect class="amber" x="850" y="155" width="315" height="54" rx="8"/>
  <rect class="amber" x="850" y="193" width="315" height="16"/>
  <text class="white" x="876" y="190">3 · Bounded ValueS</text>
  <text class="body" x="876" y="244">context ≥ evidence floor?</text>
  <text class="body" x="876" y="279">yes: context-local window</text>
  <text class="body" x="876" y="314">no: program-wide window</text>
  <text class="mono" x="876" y="348">4 ≤ window ≤ 256</text>

  <rect class="panel" x="1240" y="155" width="290" height="220" rx="8"/>
  <rect class="green" x="1240" y="155" width="290" height="54" rx="8"/>
  <rect class="green" x="1240" y="193" width="290" height="16"/>
  <text class="white" x="1266" y="190">4 · Normalize</text>
  <text class="body" x="1266" y="244">value → [0,1]</text>
  <text class="body" x="1266" y="279">reward ÷ cost penalty</text>
  <text class="body" x="1266" y="314">killed → utility 0</text>
  <text class="small" x="1266" y="348">Scale-isolated · cost-aware</text>

  <path class="line" d="M370 265 H445"/><path class="line" d="M775 265 H850"/><path class="line" d="M1165 265 H1240"/>

  <rect class="panel" x="475" y="465" width="650" height="180" rx="8"/>
  <text class="h" x="510" y="510">5 · Deterministic MeanShift + silhouette gate</text>
  <line x1="510" y1="530" x2="1090" y2="530" stroke="#d9e0e7" stroke-width="2"/>
  <circle cx="570" cy="575" r="13" fill="#087f8c"/><circle cx="606" cy="590" r="13" fill="#087f8c"/><circle cx="641" cy="568" r="13" fill="#087f8c"/>
  <circle cx="910" cy="570" r="13" fill="#c56a00"/><circle cx="948" cy="590" r="13" fill="#c56a00"/><circle cx="985" cy="565" r="13" fill="#c56a00"/>
  <text class="mono" x="680" y="575">bandwidth = P20(distance)</text>
  <text class="mono" x="680" y="608">admit iff clusters valid ∧ s ≥ η</text>
  <path class="line" d="M1385 375 V420 H800 V465"/>

  <rect class="panel" x="170" y="735" width="455" height="170" rx="8"/>
  <rect class="amber" x="170" y="735" width="455" height="50" rx="8"/>
  <rect class="amber" x="170" y="770" width="455" height="15"/>
  <text class="white" x="198" y="769">Explore · evidence weak / reserve hit</text>
  <text class="body" x="198" y="824">Bounded sampling near history anchor</text>
  <text class="body" x="198" y="860">Negative / zero / integer domains</text>
  <text class="small" x="198" y="890">or contextual Thompson fallback</text>

  <rect class="panel" x="975" y="735" width="455" height="170" rx="8"/>
  <rect class="green" x="975" y="735" width="455" height="50" rx="8"/>
  <rect class="green" x="975" y="770" width="455" height="15"/>
  <text class="white" x="1003" y="769">Exploit · stable high-quality partition</text>
  <text class="body" x="1003" y="824">Select cluster by mean utility</text>
  <text class="body" x="1003" y="860">Construct utility-weighted value</text>
  <text class="small" x="1003" y="890">Clamp to provider min / max</text>

  <path class="line" d="M665 645 L425 735"/><path class="line" d="M935 645 L1175 735"/>
  <text class="small" x="475" y="690">insufficient / degenerate / s &lt; η</text>
  <text class="small" x="980" y="690">s ≥ η and exploration reserve not hit</text>

  <rect x="665" y="775" width="270" height="100" rx="8" fill="#fff" stroke="#b5483a" stroke-width="2"/>
  <text class="h" x="696" y="810">Real execution</text>
  <text class="small" x="696" y="840">coverage reward + elapsed</text>
  <text class="small" x="696" y="863">feedback to next ValueS</text>
  <path class="dash" d="M665 825 H625"/><path class="dash" d="M935 825 H975"/>

  <rect x="70" y="940" width="1460" height="34" rx="6" fill="#e9eef3"/>
  <text class="mono" x="92" y="963">state pair = base SHA-256 + sequence + program + schema + provider provenance + exact policy · mismatch ⇒ reject both histories</text>
</svg>
