<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">F399 Cottontail-style alpha-normalized constraint selection</title>
  <desc id="desc">A validated Query IR DAG is projected into a target constraint shape and a joint shape over the latest eight prefix roots plus the target. Absolute byte offsets are alpha-renamed while semantic structure and cross-root aliasing remain. QueryStore records contextual duplicate classes and schedules novel representatives before duplicates, with a bounded fairness decay.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2933" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#405261"/></marker>
    <marker id="greenArrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#24765c"/></marker>
    <style>
      .bg{fill:#f6f8fa}.panel{fill:#fff;stroke:#c9d3dc;stroke-width:2;filter:url(#shadow)}
      .navy{fill:#183b56}.teal{fill:#087f8c}.green{fill:#24765c}.amber{fill:#ad6200}.red{fill:#b3473c}.purple{fill:#6551a3}
      .title{font:700 38px system-ui,sans-serif;fill:#17212b}.sub{font:400 18px system-ui,sans-serif;fill:#536273}
      .h{font:700 22px system-ui,sans-serif;fill:#17212b}.body{font:400 17px system-ui,sans-serif;fill:#34495e}
      .small{font:400 15px system-ui,sans-serif;fill:#536273}.white{font:700 20px system-ui,sans-serif;fill:#fff}
      .mono{font:600 15px ui-monospace,SFMono-Regular,monospace;fill:#34495e}.formula{font:600 17px ui-monospace,SFMono-Regular,monospace;fill:#183b56}
      .line{fill:none;stroke:#405261;stroke-width:3;marker-end:url(#arrow)}.feedback{fill:none;stroke:#24765c;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#greenArrow)}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1080"/>
  <text class="title" x="80" y="66">F399 · Alpha-Normalized Structural Constraint Selection</text>
  <text class="sub" x="80" y="102">Cottontail-style duplicate reduction over content-addressed Query IR, without conflating ECT and solver expressions</text>

  <rect class="panel" x="65" y="150" width="330" height="245" rx="8"/>
  <rect class="navy" x="65" y="150" width="330" height="58" rx="8"/><rect class="navy" x="65" y="193" width="330" height="15"/>
  <text class="white" x="92" y="188">1 · Runtime query</text>
  <text class="body" x="92" y="248">Versioned QF_BV expression DAG</text>
  <text class="body" x="92" y="284">Prefix roots + target root</text>
  <text class="body" x="92" y="320">Stable site + desired outcome</text>
  <text class="mono" x="92" y="358">read(index = absolute byte)</text>

  <rect class="panel" x="480" y="150" width="350" height="245" rx="8"/>
  <rect class="teal" x="480" y="150" width="350" height="58" rx="8"/><rect class="teal" x="480" y="193" width="350" height="15"/>
  <text class="white" x="507" y="188">2 · Fail-closed DAG index</text>
  <text class="body" x="507" y="248">Dense topological IDs</text>
  <text class="body" x="507" y="284">Bounded nodes / roots / children</text>
  <text class="body" x="507" y="320">Canonical JSON attributes</text>
  <text class="small" x="507" y="358">Validate once, reuse two projections</text>

  <rect class="panel" x="915" y="150" width="385" height="245" rx="8"/>
  <rect class="purple" x="915" y="150" width="385" height="58" rx="8"/><rect class="purple" x="915" y="193" width="385" height="15"/>
  <text class="white" x="942" y="188">3 · Alpha-normalized shapes</text>
  <text class="body" x="942" y="248">Target: complete reachable DAG</text>
  <text class="body" x="942" y="284">Context: latest ≤ 8 prefix roots + target</text>
  <text class="mono" x="942" y="321">index 95 → slot 0</text>
  <text class="small" x="942" y="358">SHA-256 node and root descriptors</text>

  <rect class="panel" x="1385" y="150" width="350" height="245" rx="8"/>
  <rect class="green" x="1385" y="150" width="350" height="58" rx="8"/><rect class="green" x="1385" y="193" width="350" height="15"/>
  <text class="white" x="1412" y="188">4 · Contextual class</text>
  <text class="body" x="1412" y="248">site + desired direction</text>
  <text class="body" x="1412" y="284">joint suffix/target alias shape</text>
  <text class="body" x="1412" y="320">target constraint shape</text>
  <text class="mono" x="1412" y="358">rank = 1, 2, 3, …</text>

  <path class="line" d="M395 272 H480"/><path class="line" d="M830 272 H915"/><path class="line" d="M1300 272 H1385"/>

  <rect class="panel" x="105" y="490" width="740" height="245" rx="8"/>
  <rect class="amber" x="105" y="490" width="740" height="58" rx="8"/><rect class="amber" x="105" y="533" width="740" height="15"/>
  <text class="white" x="135" y="528">Preserved semantics</text>
  <text class="body" x="135" y="590">✓ operator, bit width, constants and extraction positions</text>
  <text class="body" x="135" y="628">✓ ordered children, DAG topology and cross-root read alias relation</text>
  <text class="body" x="135" y="666">✓ different prefix suffixes remain different execution contexts</text>
  <text class="formula" x="135" y="704">equal(read[0], 0x41) ≡α equal(read[95], 0x41)</text>

  <rect class="panel" x="955" y="490" width="740" height="245" rx="8"/>
  <rect class="red" x="955" y="490" width="740" height="58" rx="8"/><rect class="red" x="955" y="533" width="740" height="15"/>
  <text class="white" x="985" y="528">Rejected equivalences</text>
  <text class="body" x="985" y="590">✕ different constant or operation</text>
  <text class="body" x="985" y="628">✕ same-read alias versus two independent reads</text>
  <text class="body" x="985" y="666">✕ malformed, cyclic or non-topological Query IR</text>
  <text class="formula" x="985" y="704">read[a] = read[a]  ≢α  read[a] = read[b]</text>

  <path class="line" d="M1560 395 V440 H475 V490"/>
  <path class="line" d="M1560 395 V452 H1325 V490"/>

  <rect class="panel" x="190" y="825" width="1420" height="185" rx="8"/>
  <text class="h" x="230" y="870">5 · QueryStore novelty-first, starvation-bounded scheduling</text>
  <line x1="230" y1="892" x2="1570" y2="892" stroke="#d8e0e7" stroke-width="2"/>
  <rect x="245" y="920" width="325" height="58" rx="7" fill="#e9f5f1" stroke="#24765c" stroke-width="2"/>
  <text class="body" x="272" y="955">rank 1 · representative first</text>
  <rect x="665" y="920" width="455" height="58" rx="7" fill="#fff4e5" stroke="#ad6200" stroke-width="2"/>
  <text class="body" x="692" y="955">rank r · initial score 1/r</text>
  <rect x="1215" y="920" width="335" height="58" rx="7" fill="#eef1f7" stroke="#6551a3" stroke-width="2"/>
  <text class="body" x="1242" y="955">300 s · penalty reaches zero</text>
  <path class="line" d="M570 949 H665"/><path class="line" d="M1120 949 H1215"/>
  <path class="feedback" d="M190 949 H70 Q40 949 40 919 V450 Q40 420 70 420 H655 V395"/>
  <text class="small" x="74" y="936">claim → exact solver</text>

  <rect x="65" y="1030" width="1670" height="36" rx="7" fill="#e7edf2"/>
  <text class="mono" x="92" y="1054">Structural: novelty → priority → depth · DFS/BFS/priority remain ablations · every SAT model still passes validation and concrete replay</text>
</svg>
