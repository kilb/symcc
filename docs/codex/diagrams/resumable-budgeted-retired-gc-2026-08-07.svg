<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1400" viewBox="0 0 1900 1400" role="img" aria-labelledby="title desc">
  <title id="title">F337 resumable budgeted retired-tree garbage collection</title>
  <desc id="desc">Comparison of unbounded startup deletion and the descriptor-relative three-budget incremental collector, with restart convergence and measured evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b42318"/>
    </marker>
  </defs>
  <rect width="1900" height="1400" fill="#f8fafc"/>
  <text x="70" y="76" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="42" font-weight="700" fill="#0f172a">F337 · 三预算可恢复 Retired-Tree GC</text>
  <text x="70" y="118" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="21" fill="#475569">把完成态物理回收从“选一棵后无界删除”升级为可持久续删的 root / entry / cooperative-time 三层预算</text>

  <rect x="60" y="160" width="500" height="660" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="90" y="205" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="25" font-weight="700" fill="#9a3412">F335/F336 启动 GC 的遗留尾延迟</text>
  <rect x="100" y="240" width="420" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="310" y="270" text-anchor="middle" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="19" font-weight="600" fill="#1e293b">ROOT_LIMIT = 1</text>
  <text x="310" y="295" text-anchor="middle" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="16" fill="#64748b">只限制选中根数</text>
  <line x1="310" y1="312" x2="310" y2="350" stroke="#b42318" stroke-width="3" marker-end="url(#arrow-red)"/>
  <rect x="100" y="360" width="420" height="112" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="310" y="398" text-anchor="middle" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="20" font-weight="700" fill="#9f1239">durable_rmtree(entire root)</text>
  <text x="310" y="430" text-anchor="middle" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="17" fill="#881337">扫描 + unlink 全部 N 条目 + parent fsync</text>
  <text x="310" y="455" text-anchor="middle" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="16" fill="#881337">不可在树内暂停</text>
  <g transform="translate(105,515)">
    <rect x="0" y="0" width="410" height="190" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="205" y="32" text-anchor="middle" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="17" font-weight="600" fill="#7c2d12">一棵合法 retired tree</text>
    <line x1="205" y1="50" x2="205" y2="78" stroke="#64748b" stroke-width="2"/>
    <line x1="65" y1="78" x2="345" y2="78" stroke="#64748b" stroke-width="2"/>
    <g fill="#ffedd5" stroke="#ea580c">
      <rect x="30" y="92" width="70" height="42" rx="4"/><rect x="115" y="92" width="70" height="42" rx="4"/>
      <rect x="200" y="92" width="70" height="42" rx="4"/><rect x="285" y="92" width="70" height="42" rx="4"/>
    </g>
    <g font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="14" fill="#9a3412" text-anchor="middle">
      <text x="65" y="118">entry 1</text><text x="150" y="118">entry 2</text><text x="235" y="118">…</text><text x="320" y="118">entry N</text>
    </g>
    <text x="205" y="168" text-anchor="middle" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="18" font-weight="700" fill="#b42318">启动等待 O(N)，GC lock 持有 O(N)</text>
  </g>
  <text x="310" y="760" text-anchor="middle" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="18" font-weight="600" fill="#9a3412">逻辑正确，但单次启动成本随树规模失控</text>

  <rect x="600" y="160" width="1240" height="660" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="635" y="205" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="25" font-weight="700" fill="#115e59">F337：descriptor-relative 三预算状态机</text>
  <text x="1805" y="205" text-anchor="end" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="16" fill="#64748b">stable flock · fail closed · Abort(66)</text>

  <g font-family="WenQuanYi Zen Hei,Arial,sans-serif">
    <rect x="640" y="245" width="210" height="112" rx="6" fill="#ecfeff" stroke="#0891b2"/>
    <text x="745" y="279" text-anchor="middle" font-size="18" font-weight="700" fill="#155e75">1 · 锁与预验证</text>
    <text x="745" y="309" text-anchor="middle" font-size="15" fill="#0e7490">完整 reserved namespace</text>
    <text x="745" y="333" text-anchor="middle" font-size="15" fill="#0e7490">name + no-follow type</text>

    <rect x="905" y="245" width="210" height="112" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="1010" y="279" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">2 · 根预算</text>
    <text x="1010" y="310" text-anchor="middle" font-size="16" fill="#15803d">ROOT_LIMIT</text>
    <text x="1010" y="334" text-anchor="middle" font-size="15" fill="#15803d">默认最多选择 1 根</text>

    <rect x="1170" y="245" width="270" height="112" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="1305" y="279" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">3 · FD 相对迭代 DFS</text>
    <text x="1305" y="309" text-anchor="middle" font-size="15" fill="#1e40af">openat + O_NOFOLLOW</text>
    <text x="1305" y="333" text-anchor="middle" font-size="15" fill="#1e40af">scandir(fd) · unlinkat · rmdir</text>

    <rect x="1495" y="245" width="300" height="112" rx="6" fill="#fefce8" stroke="#ca8a04"/>
    <text x="1645" y="279" text-anchor="middle" font-size="18" font-weight="700" fill="#854d0e">4 · 预算决策</text>
    <text x="1645" y="308" text-anchor="middle" font-size="15" fill="#a16207">ENTRY：成功变更硬上限</text>
    <text x="1645" y="332" text-anchor="middle" font-size="15" fill="#a16207">TIME：syscall 间协作截止</text>
  </g>
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="850" y1="301" x2="895" y2="301"/>
    <line x1="1115" y1="301" x2="1160" y2="301"/>
    <line x1="1440" y1="301" x2="1485" y2="301"/>
  </g>

  <rect x="640" y="410" width="1155" height="330" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="675" y="448" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="19" font-weight="700" fill="#334155">一次单步的可恢复目录状态</text>
  <g transform="translate(685,480)" font-family="WenQuanYi Zen Hei,Arial,sans-serif">
    <rect x="0" y="0" width="250" height="190" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="125" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1e40af">Frame stack</text>
    <rect x="30" y="50" width="190" height="35" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="45" y="94" width="175" height="35" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="60" y="138" width="160" height="35" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="125" y="73" text-anchor="middle" font-size="14" fill="#1e3a8a">root fd · dirty</text>
    <text x="132" y="117" text-anchor="middle" font-size="14" fill="#1e3a8a">child fd · iterator</text>
    <text x="140" y="161" text-anchor="middle" font-size="14" fill="#1e3a8a">leaf fd · basename</text>

    <line x1="275" y1="94" x2="345" y2="94" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="360" y="0" width="330" height="190" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="525" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#115e59">单调变更</text>
    <text x="390" y="67" font-size="15" fill="#334155">- file / symlink → unlinkat</text>
    <text x="390" y="96" font-size="15" fill="#334155">- empty directory → rmdir</text>
    <text x="390" y="125" font-size="15" fill="#334155">- ENOTEMPTY → reopen iterator</text>
    <text x="390" y="154" font-size="15" fill="#334155">- 每次成功 mutation 计 1</text>

    <line x1="715" y1="94" x2="785" y2="94" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="800" y="0" width="265" height="190" rx="6" fill="#ffffff" stroke="#ca8a04" stroke-width="2"/>
    <text x="932" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#854d0e">Durable stop</text>
    <text x="830" y="66" font-size="15" fill="#713f12">1. deepest dirty fd first</text>
    <text x="830" y="95" font-size="15" fill="#713f12">2. fsync surviving dirs</text>
    <text x="830" y="124" font-size="15" fill="#713f12">3. root removed → parent fsync</text>
    <text x="830" y="153" font-size="15" fill="#713f12">4. close all, return reason</text>
  </g>
  <rect x="650" y="758" width="1135" height="42" rx="5" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="1218" y="785" text-anchor="middle" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="17" font-weight="600" fill="#115e59">部分树仍是合法 retired 状态：下次启动重新扫描即可继续，无需额外 GC journal</text>

  <rect x="60" y="870" width="1780" height="460" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="915" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">可执行证据与结论边界</text>

  <rect x="90" y="950" width="520" height="315" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="120" y="988" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="20" font-weight="700" fill="#166534">真实 Open MPI · 跨启动收敛</text>
  <g font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="16" fill="#334155">
    <text x="120" y="1030">7 ranks · 2 masters · 5 workers · 同机 overlayfs</text>
    <text x="120" y="1072">启动 1：5 → 3 files · 2 entries · exit 0</text>
    <text x="120" y="1110">启动 2：3 → 1 files · 2 entries · exit 0</text>
    <text x="120" y="1148">启动 3：1 file + root → absent · exit 0</text>
    <text x="120" y="1190" font-weight="700" fill="#166534">每轮 3/3 + 2/2 worker ACK</text>
    <text x="120" y="1222" fill="#64748b">部分回收不阻断服务，后续启动自然续删</text>
  </g>

  <rect x="640" y="950" width="570" height="315" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="670" y="988" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">本机机制成本 · 20+20 交错样本/规模</text>
  <g font-family="WenQuanYi Zen Hei,Arial,sans-serif">
    <text x="680" y="1030" font-size="15" font-weight="700" fill="#334155">files</text>
    <text x="790" y="1030" font-size="15" font-weight="700" fill="#334155">完整删除</text>
    <text x="945" y="1030" font-size="15" font-weight="700" fill="#334155">64-entry 单步</text>
    <text x="1125" y="1030" font-size="15" font-weight="700" fill="#334155">比率</text>
    <g font-size="17" fill="#1e293b">
      <text x="680" y="1070">129</text><text x="790" y="1070">3.372 ms</text><text x="945" y="1070">3.089 ms</text><text x="1125" y="1070">0.916x</text>
      <text x="680" y="1110">1025</text><text x="790" y="1110">7.365 ms</text><text x="945" y="1110">3.579 ms</text><text x="1125" y="1110">0.486x</text>
      <text x="680" y="1150">4097</text><text x="790" y="1150">28.521 ms</text><text x="945" y="1150">3.648 ms</text><text x="1125" y="1150">0.128x</text>
    </g>
    <text x="670" y="1200" font-size="16" font-weight="700" fill="#1d4ed8">完整删除增长 8.459x；固定单步增长 1.181x</text>
    <text x="670" y="1232" font-size="15" fill="#64748b">最终总删除量不变，收益是单次启动工作封顶与摊销</text>
  </g>

  <rect x="1240" y="950" width="570" height="315" rx="6" fill="#fff7ed" stroke="#f97316"/>
  <text x="1270" y="988" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="20" font-weight="700" fill="#9a3412">严格边界</text>
  <g font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="16" fill="#7c2d12">
    <text x="1270" y="1032">- 时间预算不能抢占一个阻塞 syscall</text>
    <text x="1270" y="1072">- shared-root 顶层完整扫描仍未计入 entry budget</text>
    <text x="1270" y="1112">- flock 只约束协作 reclaimer</text>
    <text x="1270" y="1152">- 尚无真实多主机 / NFS failover / 断电证据</text>
    <text x="1270" y="1192">- 不代表 DSE、solver、coverage 或 LAVA-M 提升</text>
  </g>
  <rect x="1270" y="1212" width="510" height="34" rx="4" fill="#ffedd5"/>
  <text x="1525" y="1235" text-anchor="middle" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="15" font-weight="700" fill="#9a3412">证据等级：I / T / E-mechanism，而非 R</text>

  <text x="950" y="1370" text-anchor="middle" font-family="WenQuanYi Zen Hei,Arial,sans-serif" font-size="15" fill="#64748b">SymCC-Parallel · F337 · 2026-08-07 · production code + tests + real MPI + syscall + raw timing</text>
</svg>
