<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1920" height="128" fill="#17222d"/>
  <text x="80" y="62" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">F402 Compatible Branch Coverage</text>
  <text x="80" y="101" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="20" fill="#c9d4dc">依赖证明驱动的 fork-time 剪枝 · durable live-state frontier · conservative fail-open</text>

  <text x="80" y="182" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="18" font-weight="700" fill="#276678">1  静态兼容性证明</text>
  <rect x="70" y="205" width="510" height="650" rx="8" fill="#ffffff" stroke="#b9c4cc" stroke-width="2"/>
  <rect x="95" y="235" width="460" height="92" rx="6" fill="#e7f2f4" stroke="#74a9b5" stroke-width="2"/>
  <text x="125" y="271" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="23" font-weight="700" fill="#173b45">Validated continuation IR</text>
  <text x="125" y="302" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="17" fill="#36545c">CFG · SSA-like definitions · branch site / outcome</text>
  <path d="M325 327 V365" stroke="#62727c" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="95" y="365" width="218" height="150" rx="6" fill="#eaf4ed" stroke="#6b9e78" stroke-width="2"/>
  <text x="118" y="400" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="21" font-weight="700" fill="#285b34">Data closure</text>
  <text x="118" y="433" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#365a3e">迭代 def-use provenance</text>
  <text x="118" y="462" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#365a3e">input / size / nondet</text>
  <text x="118" y="491" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#365a3e">assume correlation atoms</text>

  <rect x="337" y="365" width="218" height="150" rx="6" fill="#fdf1df" stroke="#c9974c" stroke-width="2"/>
  <text x="360" y="400" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="21" font-weight="700" fill="#704b18">Control closure</text>
  <text x="360" y="433" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#6a552f">bitset post-dominator</text>
  <text x="360" y="462" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#6a552f">control-dependence</text>
  <text x="360" y="491" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#6a552f">transitive controller set</text>

  <path d="M204 515 V555 H325" fill="none" stroke="#62727c" stroke-width="3"/>
  <path d="M446 515 V555 H325" fill="none" stroke="#62727c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="95" y="570" width="460" height="112" rx="6" fill="#f1edf7" stroke="#8e79a8" stroke-width="2"/>
  <text x="125" y="607" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="22" font-weight="700" fill="#4d3b66">Pairwise compatibility</text>
  <text x="125" y="641" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="17" fill="#5d5270">same function ∧ analyzable ∧ dependency sets disjoint</text>
  <text x="125" y="667" font-family="Consolas, monospace" font-size="16" fill="#5d5270">compatible(Bi,Bj) ⇔ Di ∩ Dj = ∅</text>
  <path d="M325 682 V718" stroke="#62727c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="95" y="718" width="460" height="108" rx="6" fill="#fff0ef" stroke="#c66c63" stroke-width="2"/>
  <text x="125" y="753" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="20" font-weight="700" fill="#7b302a">Fail-open boundary</text>
  <text x="125" y="784" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#704642">memory / call / indirect call / cycle</text>
  <text x="125" y="810" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#704642">unknown assume · token ambiguity · analysis budget</text>

  <text x="655" y="182" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="18" font-weight="700" fill="#276678">2  Fork-time CBC state filter</text>
  <rect x="645" y="205" width="620" height="650" rx="8" fill="#ffffff" stroke="#b9c4cc" stroke-width="2"/>
  <rect x="680" y="240" width="550" height="78" rx="6" fill="#edf1f4" stroke="#91a0aa" stroke-width="2"/>
  <text x="710" y="273" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="21" font-weight="700" fill="#263944">Prospective symbolic children</text>
  <text x="710" y="300" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#50616a">append stable SHA-256(site, outcome) token before CAS commit</text>
  <path d="M955 318 V355" stroke="#62727c" stroke-width="3" marker-end="url(#arrow)"/>

  <polygon points="955,355 1110,425 955,495 800,425" fill="#fff4df" stroke="#c9974c" stroke-width="2"/>
  <text x="877" y="417" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="19" font-weight="700" fill="#684819">state pressure</text>
  <text x="891" y="443" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="17" fill="#684819">≥ threshold?</text>
  <path d="M800 425 H715 V535" fill="none" stroke="#6b9e78" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="718" y="405" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="15" fill="#3d7049">no: retain all</text>
  <path d="M955 495 V535" stroke="#c66c63" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="970" y="520" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="15" fill="#8a3a33">yes</text>

  <rect x="780" y="535" width="350" height="120" rx="6" fill="#e7f2f4" stroke="#74a9b5" stroke-width="2"/>
  <text x="810" y="570" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="20" font-weight="700" fill="#173b45">Greedy compatible groups</text>
  <text x="810" y="601" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#36545c">latest outcome per repeated branch site</text>
  <text x="810" y="630" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#36545c">keep group only when all outcomes agree</text>
  <path d="M955 655 V694" stroke="#62727c" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="680" y="694" width="250" height="116" rx="6" fill="#eaf4ed" stroke="#6b9e78" stroke-width="2"/>
  <text x="710" y="731" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="20" font-weight="700" fill="#285b34">Retained representatives</text>
  <text x="710" y="765" font-family="Consolas, monospace" font-size="18" fill="#365a3e">T T T …</text>
  <text x="710" y="793" font-family="Consolas, monospace" font-size="18" fill="#365a3e">F F F …</text>
  <rect x="980" y="694" width="250" height="116" rx="6" fill="#fff0ef" stroke="#c66c63" stroke-width="2"/>
  <text x="1010" y="731" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="20" font-weight="700" fill="#7b302a">Pruned products</text>
  <text x="1010" y="765" font-family="Consolas, monospace" font-size="18" fill="#704642">T F T …</text>
  <text x="1010" y="793" font-family="Consolas, monospace" font-size="18" fill="#704642">F T F …</text>

  <text x="1340" y="182" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="18" font-weight="700" fill="#276678">3  并行持久化与审计</text>
  <rect x="1330" y="205" width="520" height="650" rx="8" fill="#ffffff" stroke="#b9c4cc" stroke-width="2"/>
  <rect x="1365" y="240" width="450" height="105" rx="6" fill="#e7f2f4" stroke="#74a9b5" stroke-width="2"/>
  <text x="1395" y="277" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="21" font-weight="700" fill="#173b45">Durable frontier snapshot v4</text>
  <text x="1395" y="310" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#36545c">strategy · threshold · graph limits · stable RNG</text>
  <path d="M1590 345 V385" stroke="#62727c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1365" y="385" width="450" height="126" rx="6" fill="#f1edf7" stroke="#8e79a8" stroke-width="2"/>
  <text x="1395" y="421" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="21" font-weight="700" fill="#4d3b66">Worker claim / resume</text>
  <text x="1395" y="454" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#5d5270">ready + leases → global pressure</text>
  <text x="1395" y="482" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#5d5270">generation CAS · lease fencing · restart exactness</text>
  <path d="M1590 511 V551" stroke="#62727c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1365" y="551" width="450" height="132" rx="6" fill="#edf1f4" stroke="#91a0aa" stroke-width="2"/>
  <text x="1395" y="588" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="21" font-weight="700" fill="#263944">Observable evidence</text>
  <text x="1395" y="621" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#50616a">analyzed / unanalyzable / ambiguous</text>
  <text x="1395" y="649" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#50616a">checks / pruned / fail-open / pressure peak</text>
  <path d="M1590 683 V723" stroke="#62727c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1365" y="723" width="450" height="103" rx="6" fill="#eaf4ed" stroke="#6b9e78" stroke-width="2"/>
  <text x="1395" y="760" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="20" font-weight="700" fill="#285b34">Checkpoint publication</text>
  <text x="1395" y="793" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="16" fill="#365a3e">only admitted children enter local / durable frontier</text>

  <rect x="70" y="895" width="1780" height="125" rx="8" fill="#17222d"/>
  <text x="105" y="936" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">保证与边界</text>
  <circle cx="132" cy="976" r="9" fill="#77c18a"/>
  <text x="153" y="982" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="17" fill="#e7eef2">独立分支的每个 true / false outcome 由代表状态保留</text>
  <circle cx="737" cy="976" r="9" fill="#e1b45f"/>
  <text x="758" y="982" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="17" fill="#e7eef2">优化目标是 branch coverage，不保证保留全部 path / bug witness</text>
  <circle cx="1400" cy="976" r="9" fill="#d87970"/>
  <text x="1421" y="982" font-family="WenQuanYi Zen Hei, Arial, sans-serif" font-size="17" fill="#e7eef2">无法证明独立时保留状态</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#62727c"/>
    </marker>
  </defs>
