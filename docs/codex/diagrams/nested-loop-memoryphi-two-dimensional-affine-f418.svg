<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      @page { size: 15in 9.375in; margin: 0; }
      .title { font: 700 32px 'DejaVu Sans', sans-serif; fill: #172033; }
      .subtitle { font: 400 16px 'DejaVu Sans', sans-serif; fill: #526077; }
      .section { font: 700 19px 'DejaVu Sans', sans-serif; fill: #172033; }
      .label { font: 600 14px 'DejaVu Sans', sans-serif; fill: #273449; }
      .body { font: 400 13px 'DejaVu Sans', sans-serif; fill: #475569; }
      .mono { font: 600 13px 'DejaVu Sans Mono', monospace; fill: #172033; }
      .small { font: 400 12px 'DejaVu Sans', sans-serif; fill: #526077; }
      .white { fill: #ffffff; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f8fafc"/>
  <rect x="0" y="0" width="1440" height="10" fill="#0f766e"/>
  <text x="64" y="65" class="title">F418: Proof-Carrying 2D Affine Nested-Loop Memory Summary</text>
  <text x="64" y="94" class="subtitle">From outer/inner induction variables to target-endian last-write witnesses, reconstructed independently before use</text>

  <rect x="56" y="128" width="390" height="526" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="166" class="section">1. Recover the real loop nest</text>
  <rect x="82" y="194" width="338" height="70" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="102" y="220" class="label">Outer natural loop</text>
  <text x="102" y="244" class="mono">o = 0; o &lt; B_o; o += s_o</text>
  <path d="M251 264 L251 292" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="102" y="294" width="298" height="70" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="122" y="320" class="label">Inner natural loop</text>
  <text x="122" y="344" class="mono">i = 0; i &lt; B_i; i += s_i</text>
  <path d="M251 364 L251 392" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="82" y="394" width="338" height="94" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="102" y="420" class="label">Ordered MemoryDef chain</text>
  <text x="102" y="445" class="mono">idx = c + alpha*o + beta*i</text>
  <text x="102" y="469" class="mono">store[0]  -&gt;  store[1]  -&gt; latch</text>
  <path d="M251 488 L251 516" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="82" y="518" width="338" height="108" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="102" y="544" class="label">Fail-closed structural gate</text>
  <text x="102" y="568" class="body">Two MemoryPhi nodes, one latch per level,</text>
  <text x="102" y="590" class="body">positive constant steps, bounded input domains,</text>
  <text x="102" y="612" class="body">same object, no extra memory effect.</text>

  <rect x="470" y="128" width="484" height="526" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="494" y="166" class="section">2. Enumerate the sealed affine domain</text>
  <text x="494" y="194" class="mono">address(o,i) = base + scale * (c + alpha*o + beta*i)</text>
  <text x="494" y="218" class="small">Example: c=0, alpha=4, beta=1, s_o=1, s_i=2</text>

  <line x1="550" y1="540" x2="882" y2="540" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="540" x2="550" y2="272" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="892" y="545" class="label">inner i</text>
  <text x="532" y="259" class="label">outer o</text>
  <line x1="550" y1="450" x2="866" y2="450" stroke="#e2e8f0"/>
  <line x1="550" y1="360" x2="866" y2="360" stroke="#e2e8f0"/>
  <line x1="690" y1="540" x2="690" y2="300" stroke="#e2e8f0"/>
  <line x1="830" y1="540" x2="830" y2="300" stroke="#e2e8f0"/>
  <text x="545" y="562" class="small">0</text>
  <text x="685" y="562" class="small">2</text>
  <text x="535" y="545" class="small">0</text>
  <text x="535" y="455" class="small">1</text>
  <text x="535" y="365" class="small">2</text>

  <path d="M570 520 L710 520 L570 430 L710 430 L570 340 L710 340" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <g fill="#0f766e" stroke="#ffffff" stroke-width="3">
    <circle cx="570" cy="520" r="13"/><circle cx="710" cy="520" r="13"/>
    <circle cx="570" cy="430" r="13"/><circle cx="710" cy="430" r="13"/>
    <circle cx="570" cy="340" r="13"/><circle cx="710" cy="340" r="13"/>
  </g>
  <g class="mono">
    <text x="588" y="510">idx 0 / addr 64</text>
    <text x="728" y="510">idx 2 / addr 66</text>
    <text x="588" y="420">idx 4 / addr 68</text>
    <text x="728" y="420">idx 6 / addr 70</text>
    <text x="588" y="330">idx 8 / addr 72</text>
    <text x="728" y="330">idx 10 / addr 74</text>
  </g>
  <rect x="496" y="580" width="432" height="48" rx="5" fill="#ecfeff" stroke="#0e7490"/>
  <text x="512" y="600" class="body">Certificate order is lexicographic: outer, then inner.</text>
  <text x="512" y="620" class="body">Every enumerated index must exist in the real alias map.</text>

  <rect x="978" y="128" width="406" height="526" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1002" y="166" class="section">3. Bind bytes and verify twice</text>
  <rect x="1004" y="194" width="354" height="72" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1024" y="220" class="label">LLVM producer</text>
  <text x="1024" y="244" class="body">LoopInfo + MemorySSA + aliases + DataLayout</text>
  <path d="M1181 266 L1181 296" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1004" y="298" width="354" height="114" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="1024" y="324" class="label">v8 proof-carrying transcript</text>
  <text x="1024" y="348" class="body">Affine coefficients + finite instances</text>
  <text x="1024" y="370" class="body">2D fixed-point rounds + target-endian bytes</text>
  <text x="1024" y="392" class="body">Ordered first-match witnesses</text>
  <path d="M1181 412 L1181 442" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1004" y="444" width="354" height="92" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1024" y="470" class="label">Strict Python consumer</text>
  <text x="1024" y="494" class="body">Rebuild expression, instances, closure, bytes,</text>
  <text x="1024" y="516" class="body">case thresholds and capability dependencies.</text>
  <path d="M1181 536 L1181 566" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1004" y="568" width="354" height="60" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="1024" y="594" class="label">Runtime remains authoritative</text>
  <text x="1024" y="616" class="body">Real stores + path-local initializedness bitmap</text>

  <rect x="56" y="680" width="1328" height="164" rx="6" fill="#172033"/>
  <text x="80" y="715" class="section white">Last-write decision for one byte lane</text>
  <rect x="82" y="738" width="306" height="76" rx="5" fill="#253248" stroke="#64748b"/>
  <text x="100" y="763" class="mono white">case (o=2, i=2, writer=1)</text>
  <text x="100" y="789" class="small white">requires B_o &gt;= 3 and B_i &gt;= 3</text>
  <text x="406" y="780" class="label white">first satisfied</text>
  <path d="M500 776 L566 776" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="584" y="738" width="282" height="76" rx="5" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="604" y="763" class="mono white">value_byte = writer[1][lane]</text>
  <text x="604" y="789" class="small white">later outer, inner, then ordinal wins</text>
  <path d="M884 776 L950 776" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="968" y="738" width="388" height="76" rx="5" fill="#3f2b1d" stroke="#fb923c"/>
  <text x="988" y="763" class="mono white">no satisfied case =&gt; uninitialized</text>
  <text x="988" y="789" class="small white">Never converted to zero; unsupported shapes fall back</text>
  <text x="58" y="876" class="small">Scope: exact two-level loops, positive affine coefficients, finite argument domains, 1-4 full-byte constant writers, one object, no extra memory effects.</text>
</svg>
