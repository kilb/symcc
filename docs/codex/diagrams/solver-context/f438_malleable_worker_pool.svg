<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">F438 generation-fenced malleable worker pool</title>
  <desc id="desc">Signals feed a deterministic allocator. A fixed physical worker pool transitions between active, draining and standby through prepare, exact lease drain receipts and commit. QueryStore persists fenced snapshots and independently tracks query leases.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#334155"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 38px 'WenQuanYi Zen Hei','Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#102a43; }
      .subtitle { font: 400 19px 'WenQuanYi Zen Hei','Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#486581; }
      .h { font: 700 22px 'WenQuanYi Zen Hei','Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#102a43; }
      .b { font: 500 17px 'WenQuanYi Zen Hei','Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#243b53; }
      .s { font: 400 15px 'WenQuanYi Zen Hei','Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#486581; }
      .mono { font: 600 15px 'DejaVu Sans Mono',monospace; fill:#243b53; }
      .white { fill:#fff; }
      .line { fill:none; stroke:#334155; stroke-width:3; marker-end:url(#arrow); }
      .tealLine { fill:none; stroke:#0f766e; stroke-width:4; marker-end:url(#arrowTeal); }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="#f8fafc"/>
  <rect x="0" y="0" width="1800" height="108" fill="#ffffff"/>
  <rect x="0" y="104" width="1800" height="4" fill="#0f766e"/>
  <text x="70" y="54" class="title">F438 代际隔离的可塑 Worker 池</text>
  <text x="70" y="84" class="subtitle">效用信号 → 确定性分配 → 两阶段 drain/commit → 租约、证明与物理 rank 守恒</text>
  <rect x="1515" y="28" width="215" height="48" rx="8" fill="#102a43"/>
  <text x="1622" y="58" text-anchor="middle" class="b white">I / T / E-local</text>

  <!-- Signal plane -->
  <rect x="55" y="145" width="420" height="350" rx="8" fill="#ffffff" stroke="#bcccdc" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="145" width="420" height="60" rx="8" fill="#d9eaf7"/>
  <rect x="55" y="197" width="420" height="8" fill="#d9eaf7"/>
  <text x="82" y="182" class="h">1 可信调度信号</text>

  <rect x="82" y="231" width="166" height="104" rx="8" fill="#eef6fb" stroke="#84a9c0" stroke-width="2"/>
  <text x="165" y="264" text-anchor="middle" class="b">QueryStore</text>
  <text x="165" y="292" text-anchor="middle" class="mono">pending + leased</text>
  <text x="165" y="316" text-anchor="middle" class="s">一次 grouped SQL</text>

  <rect x="273" y="231" width="174" height="104" rx="8" fill="#e8f5f2" stroke="#5aa79d" stroke-width="2"/>
  <text x="360" y="264" text-anchor="middle" class="b">F437 feedback</text>
  <text x="360" y="292" text-anchor="middle" class="s">delivery / activity</text>
  <text x="360" y="316" text-anchor="middle" class="s">checker / event lag</text>

  <rect x="82" y="361" width="365" height="104" rx="8" fill="#fff8e6" stroke="#d8a72e" stroke-width="2"/>
  <text x="264" y="394" text-anchor="middle" class="b">MalleableJobSignal</text>
  <text x="264" y="422" text-anchor="middle" class="mono">job + family + backlog + utility</text>
  <text x="264" y="447" text-anchor="middle" class="s">pairing snapshot 先独立验证，再按 family 聚合</text>
  <path d="M165 335 V351 H264 V359" class="line"/>
  <path d="M360 335 V351 H264 V359" class="line"/>

  <!-- Allocator -->
  <rect x="535" y="145" width="410" height="350" rx="8" fill="#ffffff" stroke="#9fb3c8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="535" y="145" width="410" height="60" rx="8" fill="#e8f5f2"/>
  <rect x="535" y="197" width="410" height="8" fill="#e8f5f2"/>
  <text x="562" y="182" class="h">2 确定性整数分配器</text>
  <text x="570" y="245" class="mono">demand = ceil(backlog / B)</text>
  <text x="570" y="281" class="mono">score = backlog + utility</text>
  <text x="570" y="309" class="mono">      + activation - costs</text>
  <rect x="570" y="337" width="340" height="60" rx="8" fill="#ecfdf5" stroke="#34a853" stroke-width="2"/>
  <text x="740" y="363" text-anchor="middle" class="b">最小公平份额 + 递减边际效用</text>
  <text x="740" y="385" text-anchor="middle" class="s">有界整数 · job_id tie-break · slot 守恒</text>
  <rect x="570" y="414" width="340" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="740" y="446" text-anchor="middle" class="b">优先保留持有 lease 的同 job worker</text>
  <path d="M475 412 H518 V320 H533" class="tealLine"/>

  <!-- Physical pool -->
  <rect x="1005" y="145" width="740" height="350" rx="8" fill="#ffffff" stroke="#9fb3c8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1005" y="145" width="740" height="60" rx="8" fill="#ede9fe"/>
  <rect x="1005" y="197" width="740" height="8" fill="#ede9fe"/>
  <text x="1032" y="182" class="h">3 固定物理容量，动态逻辑 assignment</text>
  <text x="1710" y="181" text-anchor="end" class="s">--jobs = 4 / MPI ranks 1..4</text>

  <rect x="1040" y="235" width="150" height="178" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  <rect x="1055" y="250" width="120" height="35" rx="6" fill="#15803d"/>
  <text x="1115" y="274" text-anchor="middle" class="b white">ACTIVE</text>
  <text x="1115" y="317" text-anchor="middle" class="mono">slot-0</text>
  <text x="1115" y="345" text-anchor="middle" class="b">job-A · gen 7</text>
  <text x="1115" y="373" text-anchor="middle" class="s">可领取新 lease</text>
  <text x="1115" y="397" text-anchor="middle" class="s">动态 shard 0/2</text>

  <rect x="1215" y="235" width="150" height="178" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <rect x="1230" y="250" width="120" height="35" rx="6" fill="#b45309"/>
  <text x="1290" y="274" text-anchor="middle" class="b white">DRAINING</text>
  <text x="1290" y="317" text-anchor="middle" class="mono">slot-1</text>
  <text x="1290" y="345" text-anchor="middle" class="b">job-A · gen 7</text>
  <text x="1290" y="373" text-anchor="middle" class="s">禁止新 claim</text>
  <text x="1290" y="397" text-anchor="middle" class="s">等待真实调用返回</text>

  <rect x="1390" y="235" width="150" height="178" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  <rect x="1405" y="250" width="120" height="35" rx="6" fill="#15803d"/>
  <text x="1465" y="274" text-anchor="middle" class="b white">ACTIVE</text>
  <text x="1465" y="317" text-anchor="middle" class="mono">slot-2</text>
  <text x="1465" y="345" text-anchor="middle" class="b">job-B · gen 7</text>
  <text x="1465" y="373" text-anchor="middle" class="s">可领取新 lease</text>
  <text x="1465" y="397" text-anchor="middle" class="s">动态 shard 1/2</text>

  <rect x="1565" y="235" width="150" height="178" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
  <rect x="1580" y="250" width="120" height="35" rx="6" fill="#475569"/>
  <text x="1640" y="274" text-anchor="middle" class="b white">STANDBY</text>
  <text x="1640" y="317" text-anchor="middle" class="mono">slot-3</text>
  <text x="1640" y="345" text-anchor="middle" class="b">no job</text>
  <text x="1640" y="373" text-anchor="middle" class="s">物理线程仍存在</text>
  <text x="1640" y="397" text-anchor="middle" class="s">逻辑容量可 grow</text>
  <path d="M945 320 H987" class="tealLine"/>
  <text x="1375" y="457" text-anchor="middle" class="s">assignment token = SHA-256(protocol, pool, worker, generation, job)</text>

  <!-- Timeline -->
  <rect x="55" y="545" width="1160" height="350" rx="8" fill="#ffffff" stroke="#9fb3c8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="545" width="1160" height="60" rx="8" fill="#fff1df"/>
  <rect x="55" y="597" width="1160" height="8" fill="#fff1df"/>
  <text x="82" y="582" class="h">4 两阶段迁移：旧权限先排空，新权限后生效</text>
  <line x1="135" y1="715" x2="1125" y2="715" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <circle cx="160" cy="715" r="34" fill="#2563eb"/>
  <text x="160" y="722" text-anchor="middle" class="b white">P</text>
  <text x="160" y="777" text-anchor="middle" class="b">PREPARE</text>
  <text x="160" y="804" text-anchor="middle" class="s">密封 expected leases</text>
  <text x="160" y="828" text-anchor="middle" class="s">进入 draining</text>

  <circle cx="430" cy="715" r="34" fill="#d97706"/>
  <text x="430" y="722" text-anchor="middle" class="b white">D</text>
  <text x="430" y="777" text-anchor="middle" class="b">DRAIN</text>
  <text x="430" y="804" text-anchor="middle" class="s">停止新 claim</text>
  <text x="430" y="828" text-anchor="middle" class="s">等待 process-live lease</text>

  <circle cx="700" cy="715" r="34" fill="#7c3aed"/>
  <text x="700" y="722" text-anchor="middle" class="b white">R</text>
  <text x="700" y="777" text-anchor="middle" class="b">RECEIPT</text>
  <text x="700" y="804" text-anchor="middle" class="s">returned = expected</text>
  <text x="700" y="828" text-anchor="middle" class="s">proof set + cursor</text>

  <circle cx="970" cy="715" r="34" fill="#15803d"/>
  <text x="970" y="722" text-anchor="middle" class="b white">C</text>
  <text x="970" y="777" text-anchor="middle" class="b">COMMIT</text>
  <text x="970" y="804" text-anchor="middle" class="s">generation + 1</text>
  <text x="970" y="828" text-anchor="middle" class="s">签发新 token</text>
  <rect x="100" y="852" width="1070" height="26" rx="6" fill="#f1f5f9"/>
  <text x="635" y="871" text-anchor="middle" class="s">任何旧 generation/token 的 attach 或 finish 都失败关闭；ABORT 保留原 token 并重新开放旧 assignment</text>

  <!-- Store and invariants -->
  <rect x="1265" y="545" width="480" height="350" rx="8" fill="#ffffff" stroke="#9fb3c8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1265" y="545" width="480" height="60" rx="8" fill="#d9eaf7"/>
  <rect x="1265" y="597" width="480" height="8" fill="#d9eaf7"/>
  <text x="1292" y="582" class="h">5 QueryStore 持久裁决</text>
  <rect x="1300" y="630" width="410" height="82" rx="8" fill="#eef6fb" stroke="#5b8db8" stroke-width="2"/>
  <text x="1505" y="662" text-anchor="middle" class="b">单调 snapshot checkpoint</text>
  <text x="1505" y="689" text-anchor="middle" class="s">same ordinal/different SHA = fork reject</text>
  <rect x="1300" y="730" width="410" height="130" rx="8" fill="#ecfdf5" stroke="#34a853" stroke-width="2"/>
  <text x="1322" y="762" class="mono">prepared = commit + abort + pending</text>
  <text x="1322" y="790" class="mono">attached - retired = live leases</text>
  <text x="1322" y="818" class="mono">proofs = sum(proof cursors)</text>
  <text x="1322" y="846" class="mono">generation = committed transitions</text>
  <path d="M1215 720 H1247" class="line"/>

  <!-- Evidence footer -->
  <rect x="55" y="940" width="1690" height="105" rx="8" fill="#102a43"/>
  <text x="82" y="977" class="h white">密封机制证据</text>
  <text x="82" y="1010" class="b white">2 × 本机 5-rank · 16 epochs · 38 attach = 38 retire · 38 durable proofs · 31 stale fences rejected</text>
  <text x="1715" y="977" text-anchor="end" class="b white">边界</text>
  <text x="1715" y="1010" text-anchor="end" class="s white">无 dynamic MPI spawn / 多节点 speedup / coverage / defect-yield 声明</text>
</svg>
