<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">F434 multi-rank realtime proof-stream evaluation</title>
  <desc id="desc">A schematic of coordinator qualification, publisher proof publication, shared durable proof state, active CaDiCaL consumers, native acknowledgements, and independent replay.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526179"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 34px 'WenQuanYi Zen Hei', sans-serif; fill: #172033; }
      .subtitle { font: 400 17px 'WenQuanYi Zen Hei', sans-serif; fill: #59677d; }
      .lane-title { font: 700 22px 'WenQuanYi Zen Hei', sans-serif; fill: #172033; }
      .step-title { font: 700 18px 'WenQuanYi Zen Hei', sans-serif; fill: #172033; }
      .body { font: 400 15px 'WenQuanYi Zen Hei', sans-serif; fill: #46546a; }
      .small { font: 400 13px 'WenQuanYi Zen Hei', sans-serif; fill: #59677d; }
      .number { font: 700 16px 'WenQuanYi Zen Hei', sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .arrow { fill: none; stroke: #526179; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f7f9fc"/>
  <text x="800" y="54" text-anchor="middle" class="title">F434  多 Rank 实时证明流评测闭环</text>
  <text x="800" y="84" text-anchor="middle" class="subtitle">资格验证 · 活动求解门禁 · checked import · native ACK · 独立重放</text>

  <!-- Coordinator control plane -->
  <rect x="60" y="120" width="1480" height="130" rx="12" fill="#f4f0ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="88" y="151" class="lane-title">Rank 0 控制与身份平面</text>

  <g filter="url(#shadow)">
    <rect x="88" y="170" width="375" height="58" rx="8" fill="#ffffff" stroke="#c7b9f8"/>
    <circle cx="118" cy="199" r="17" fill="#7c3aed"/><text x="118" y="199" class="number">1</text>
    <text x="148" y="194" class="step-title">封闭配置与工作负载身份</text>
    <text x="148" y="216" class="small">seed · roles · formula/CNF · library SHA-256</text>

    <rect x="610" y="170" width="375" height="58" rx="8" fill="#ffffff" stroke="#c7b9f8"/>
    <circle cx="640" cy="199" r="17" fill="#7c3aed"/><text x="640" y="199" class="number">2</text>
    <text x="670" y="194" class="step-title">共享状态资格验证</text>
    <text x="670" y="216" class="small">MPI 共址；跨主机则验证 lock domain 与 namespace</text>

    <rect x="1132" y="170" width="380" height="58" rx="8" fill="#ffffff" stroke="#c7b9f8"/>
    <circle cx="1162" cy="199" r="17" fill="#7c3aed"/><text x="1162" y="199" class="number">3</text>
    <text x="1192" y="194" class="step-title">活动求解 readiness collective</text>
    <text x="1192" y="216" class="small">每个 consumer: generation=1 且 native solving=1</text>
  </g>
  <path d="M463 199 H598" class="arrow"/>
  <path d="M985 199 H1120" class="arrow"/>

  <!-- Main lanes -->
  <rect x="60" y="300" width="400" height="300" rx="12" fill="#fff7e8" stroke="#d97706" stroke-width="2"/>
  <text x="88" y="337" class="lane-title">Publisher Ranks</text>
  <text x="88" y="362" class="body">证明生产平面</text>
  <circle cx="112" cy="410" r="19" fill="#d97706"/><text x="112" y="410" class="number">4</text>
  <text x="145" y="405" class="step-title">不同 publisher 选择不同 implied clause</text>
  <text x="145" y="431" class="body">从同一 deterministic bit-blast plan 构造</text>
  <text x="145" y="454" class="body">有预算的 LRUP / RUP record，并先本地复核</text>
  <rect x="88" y="490" width="344" height="78" rx="8" fill="#ffffff" stroke="#e7b763" filter="url(#shadow)"/>
  <text x="110" y="520" class="step-title">create-once publication</text>
  <text x="110" y="545" class="body">record digest · publisher rank · round identity</text>

  <rect x="535" y="300" width="530" height="300" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="563" y="337" class="lane-title">Shared Proof Plane</text>
  <text x="563" y="362" class="body">持久事实源与单调事件顺序</text>
  <circle cx="587" cy="410" r="19" fill="#059669"/><text x="587" y="410" class="number">5</text>
  <text x="620" y="405" class="step-title">record 与 event 在同一事务提交</text>
  <text x="620" y="431" class="body">immutable JSON CAS · descriptor-anchored I/O</text>
  <text x="620" y="454" class="body">SQLite rollback journal · stable cross-process flock</text>
  <rect x="563" y="490" width="474" height="78" rx="8" fill="#ffffff" stroke="#65c8a5" filter="url(#shadow)"/>
  <text x="585" y="520" class="step-title">event_for_record(digest)</text>
  <text x="585" y="545" class="body">原子返回唯一 sequence 与 formula，不用 MAX(sequence) 猜测</text>

  <rect x="1140" y="300" width="400" height="300" rx="12" fill="#eff8ff" stroke="#0284c7" stroke-width="2"/>
  <text x="1168" y="337" class="lane-title">Consumer Ranks</text>
  <text x="1168" y="362" class="body">活动 CaDiCaL 3.0.1 CDCL solve</text>
  <circle cx="1192" cy="410" r="19" fill="#0284c7"/><text x="1192" y="410" class="number">6</text>
  <text x="1225" y="405" class="step-title">读取 formula-scoped event suffix</text>
  <text x="1225" y="431" class="body">重建 CNF · 递归 proof replay · checker 预算</text>
  <text x="1225" y="454" class="body">仅 checked clause 进入有界 external queue</text>
  <rect x="1168" y="490" width="344" height="78" rx="8" fill="#ffffff" stroke="#70bce5" filter="url(#shadow)"/>
  <text x="1190" y="520" class="step-title">ExternalPropagator native delivery</text>
  <text x="1190" y="545" class="body">token · solve generation · delivery ordinal ACK</text>

  <path d="M432 529 H523" class="arrow"/>
  <path d="M1037 529 H1128" class="arrow"/>
  <path d="M1322 228 V282 H260 V478" class="arrow" stroke="#7c3aed"/>

  <!-- Independent adjudication -->
  <rect x="250" y="660" width="1100" height="168" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="300" cy="711" r="21" fill="#334155"/><text x="300" y="711" class="number">7</text>
  <text x="338" y="705" class="lane-title">Rank 0 独立裁决与结果封存</text>
  <text x="338" y="738" class="body">重新加载 CAS record，逐 ACK 验证 event ↔ record ↔ formula/CNF ↔ checker policy ↔ native generation</text>
  <line x1="300" y1="764" x2="1300" y2="764" stroke="#d8dee8"/>
  <circle cx="300" cy="792" r="17" fill="#334155"/><text x="300" y="792" class="number">8</text>
  <text x="338" y="798" class="body">要求每个 consumer 的 ACK 集精确等于 publisher record 集；封存完整 rank reports、原始时延与 SHA-256</text>
  <path d="M800 600 V648" class="arrow" stroke="#059669"/>
  <path d="M1340 568 V630 H1220 V648" class="arrow" stroke="#0284c7"/>

  <!-- Timing boundary -->
  <rect x="250" y="872" width="1100" height="82" rx="10" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="280" y="902" class="step-title" fill="#b91c1c">时钟与科研结论边界</text>
  <text x="280" y="928" class="small">可比较：rank 本地 publish / solve / notification→finish；rank 0 本地 epoch makespan</text>
  <text x="280" y="949" class="small">禁止：直接相减跨主机 monotonic clock；据此声称 coverage、缺陷数或多节点 speedup</text>
</svg>
