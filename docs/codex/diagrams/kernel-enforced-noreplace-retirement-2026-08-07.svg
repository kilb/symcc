<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1400" viewBox="0 0 1900 1400">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2468a2"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#16784b"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#bb3128"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#102a43}.subtitle{font:17px Arial,sans-serif;fill:#526f8d}
      .section{font:700 25px Arial,sans-serif;fill:#102a43}.head{font:700 18px Arial,sans-serif;fill:#17324d}
      .body{font:15px Arial,sans-serif;fill:#365b7d}.small{font:13px Arial,sans-serif;fill:#526f8d}
      .mono{font:700 15px 'DejaVu Sans Mono',monospace;fill:#17324d}.metric{font:700 17px Arial,sans-serif;fill:#17324d}
      .panel{fill:#fff;stroke:#cfdae5;stroke-width:2}.blue{fill:#eaf4ff;stroke:#71addd;stroke-width:2}
      .green{fill:#e9f7ef;stroke:#62b88c;stroke-width:2}.red{fill:#fff0ef;stroke:#e07870;stroke-width:2}
      .amber{fill:#fff8e7;stroke:#e7b84d;stroke-width:2}.gray{fill:#f5f7fa;stroke:#adbcca;stroke-width:2}
    </style>
  </defs>
  <rect width="1900" height="1400" fill="#f4f7fa"/>
  <rect x="0" y="98" width="1900" height="4" fill="#2468a2"/>
  <text x="58" y="50" class="title">F336: Kernel-Enforced No-Clobber Epoch Retirement</text>
  <text x="58" y="80" class="subtitle">Replace a probabilistic check-then-replace assumption with an executable Linux RENAME_NOREPLACE invariant</text>

  <rect x="52" y="135" width="1796" height="270" rx="8" class="panel"/>
  <text x="82" y="178" class="section">Correctness gap closed</text>
  <rect x="86" y="210" width="790" height="155" rx="8" class="red"/>
  <text x="116" y="245" class="head">F335 boundary: check and replacement are separate</text>
  <rect x="116" y="270" width="180" height="60" rx="7" class="gray"/><text x="149" y="306" class="mono">lexists = false</text>
  <line x1="296" y1="300" x2="397" y2="300" stroke="#bb3128" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="314" y="283" class="small">race window</text>
  <rect x="410" y="270" width="180" height="60" rx="7" class="gray"/><text x="446" y="306" class="mono">other create</text>
  <line x1="590" y1="300" x2="680" y2="300" stroke="#bb3128" stroke-width="4" marker-end="url(#arrow-red)"/>
  <rect x="692" y="270" width="150" height="60" rx="7" class="gray"/><text x="714" y="306" class="mono">os.replace</text>
  <text x="116" y="350" class="small">A 128-bit name makes accidental collision unlikely; it does not prohibit clobbering.</text>

  <rect x="914" y="210" width="800" height="155" rx="8" class="green"/>
  <text x="944" y="245" class="head">F336 invariant: one indivisible kernel decision</text>
  <rect x="960" y="270" width="350" height="60" rx="7" class="blue"/><text x="994" y="306" class="mono">renameat2(RENAME_NOREPLACE)</text>
  <line x1="1310" y1="300" x2="1397" y2="300" stroke="#16784b" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="1410" y="258" width="265" height="84" rx="7" class="gray"/>
  <text x="1450" y="289" class="mono">absent: commit</text><text x="1434" y="322" class="mono">present: EEXIST</text>
  <text x="944" y="350" class="small">EEXIST preserves both ACTIVE and RETIRED; no check-then-rename fallback exists.</text>

  <rect x="52" y="440" width="1090" height="510" rx="8" class="panel"/>
  <text x="82" y="483" class="section">Two protocol gates on the real persistent root</text>
  <text x="98" y="528" class="head">A. Startup qualification before service</text>
  <rect x="100" y="555" width="190" height="84" rx="8" class="blue"/><text x="123" y="586" class="mono">private probe</text><text x="129" y="614" class="small">mkdir + dir fsync</text>
  <line x1="290" y1="597" x2="365" y2="597" stroke="#2468a2" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <rect x="378" y="555" width="210" height="84" rx="8" class="green"/><text x="403" y="586" class="mono">first rename = 0</text><text x="413" y="614" class="small">flag supported here</text>
  <line x1="588" y1="597" x2="663" y2="597" stroke="#2468a2" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <rect x="676" y="555" width="220" height="84" rx="8" class="amber"/><text x="701" y="586" class="mono">second = EEXIST</text><text x="712" y="614" class="small">clobber prohibited</text>
  <line x1="896" y1="597" x2="965" y2="597" stroke="#16784b" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="978" y="555" width="125" height="84" rx="8" class="green"/><text x="1000" y="586" class="mono">service</text><text x="994" y="614" class="small">or Abort 67</text>

  <text x="98" y="700" class="head">B. Completed epoch commit after every worker ACK</text>
  <rect x="100" y="730" width="190" height="86" rx="8" class="blue"/><text x="141" y="764" class="mono">ACTIVE E</text><text x="125" y="794" class="small">exact real directory</text>
  <line x1="290" y1="773" x2="365" y2="773" stroke="#2468a2" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <rect x="378" y="730" width="250" height="86" rx="8" class="green"/><text x="401" y="764" class="mono">NOREPLACE E -&gt; E-R</text><text x="420" y="794" class="small">one kernel decision</text>
  <line x1="628" y1="773" x2="703" y2="773" stroke="#16784b" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="716" y="730" width="180" height="86" rx="8" class="green"/><text x="740" y="764" class="mono">parent fsync</text><text x="747" y="794" class="small">durable commit</text>
  <line x1="896" y1="773" x2="965" y2="773" stroke="#16784b" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="978" y="730" width="125" height="86" rx="8" class="green"/><text x="997" y="764" class="mono">barrier</text><text x="991" y="794" class="small">then Finalize</text>
  <rect x="100" y="850" width="1003" height="65" rx="7" class="amber"/>
  <circle cx="132" cy="882" r="9" fill="#bb3128"/><text x="153" y="887" class="body">EEXIST: ACTIVE remains recoverable + old RETIRED remains reclaimable + Abort(72); never report success.</text>

  <rect x="1175" y="440" width="673" height="510" rx="8" class="panel"/>
  <text x="1205" y="483" class="section">Evidence chain</text>
  <rect x="1208" y="520" width="607" height="112" rx="8" class="gray"/>
  <text x="1235" y="552" class="head">Kernel trace</text>
  <text x="1235" y="581" class="mono">renameat2(..., NOREPLACE) = 0; fsync = 0</text>
  <text x="1235" y="608" class="mono">renameat2(..., NOREPLACE) = -1 EEXIST</text>
  <rect x="1208" y="650" width="607" height="135" rx="8" class="blue"/>
  <text x="1235" y="682" class="head">Real Open MPI collision -&gt; recovery</text>
  <text x="1235" y="712" class="body">7 ranks / 2 masters / 5 workers; ACK 3/3 + 2/2</text>
  <text x="1235" y="740" class="body">collision: ACTIVE + old RETIRED preserved -&gt; exit 72</text>
  <text x="1235" y="768" class="body">same epoch: GC old root -&gt; new retirement -&gt; exit 0</text>
  <rect x="1208" y="803" width="607" height="112" rx="8" class="green"/>
  <text x="1235" y="835" class="head">Regression scope</text>
  <text x="1235" y="866" class="metric">712 passed + 58 subtests</text>
  <text x="1235" y="894" class="body">unit + real processes + MPI + warnings-as-errors</text>

  <rect x="52" y="985" width="1796" height="335" rx="8" class="panel"/>
  <text x="82" y="1028" class="section">Measured cost and strict claim boundary</text>
  <rect x="86" y="1060" width="540" height="210" rx="8" class="green"/>
  <text x="116" y="1095" class="head">Rename boundary, 60 + 60 interleaved samples</text>
  <text x="116" y="1138" class="body">durable replace median</text><text x="420" y="1138" class="metric">2598.252 us</text>
  <text x="116" y="1175" class="body">durable NOREPLACE median</text><text x="420" y="1175" class="metric">2603.320 us</text>
  <text x="116" y="1212" class="body">increment / ratio</text><text x="420" y="1212" class="metric">+5.068 us / 1.002x</text>
  <text x="116" y="1244" class="small">Timed: rename syscall + destination-parent fsync only.</text>
  <rect x="660" y="1060" width="440" height="210" rx="8" class="blue"/>
  <text x="690" y="1095" class="head">One-time startup probe</text>
  <text x="690" y="1142" class="body">median</text><text x="910" y="1142" class="metric">11.944 ms</text>
  <text x="690" y="1182" class="body">P95</text><text x="910" y="1182" class="metric">13.024 ms</text>
  <text x="690" y="1222" class="small">Outside worker solve path; paid once per persistent run.</text>
  <rect x="1134" y="1060" width="680" height="210" rx="8" class="amber"/>
  <text x="1164" y="1095" class="head">Proof scope</text>
  <text x="1164" y="1132" class="body">[IN] Linux ABI, local overlayfs, EEXIST, parent fsync</text>
  <text x="1164" y="1168" class="body">[IN] same-host real MPI control flow and recovery</text>
  <text x="1164" y="1204" class="body">[OUT] NFS/Lustre failover, remote crash, rank repair</text>
  <text x="1164" y="1240" class="body">[OUT] DSE throughput, solver, coverage, LAVA-M uplift</text>
  <text x="52" y="1360" class="small">Evidence: docs/codex/evidence/f336-kernel-noreplace-retirement-2026-08-07/</text>
</svg>
