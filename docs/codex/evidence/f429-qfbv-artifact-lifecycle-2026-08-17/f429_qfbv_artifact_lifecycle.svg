<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">F429 lease-fenced QF_BV artifact lifecycle</title>
  <desc id="desc">A dependency-aware lifecycle schematic showing fenced worker roots, a unified context proof receipt lemma graph, exclusive mark and sweep, and recoverable per-store deletion.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#17324d"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#167b78"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#c74b50"/>
    </marker>
    <style>
      .title { font: 700 34px 'WenQuanYi Zen Hei','DejaVu Sans',sans-serif; fill: #13283d; }
      .subtitle { font: 400 17px 'WenQuanYi Zen Hei','DejaVu Sans',sans-serif; fill: #526171; }
      .lane { font: 700 20px 'WenQuanYi Zen Hei','DejaVu Sans',sans-serif; fill: #ffffff; }
      .head { font: 700 19px 'WenQuanYi Zen Hei','DejaVu Sans',sans-serif; fill: #183044; }
      .body { font: 400 15px 'WenQuanYi Zen Hei','DejaVu Sans',sans-serif; fill: #304657; }
      .small { font: 400 13px 'WenQuanYi Zen Hei','DejaVu Sans',sans-serif; fill: #5b6b78; }
      .tag { font: 700 13px 'WenQuanYi Zen Hei','DejaVu Sans',sans-serif; fill: #ffffff; }
      .mono { font: 600 14px 'DejaVu Sans Mono',monospace; fill: #24445d; }
      .metric { font: 700 17px 'WenQuanYi Zen Hei','DejaVu Sans',sans-serif; fill: #ffffff; }
      .footer-small { font: 400 13px 'WenQuanYi Zen Hei','DejaVu Sans',sans-serif; fill: #d8e1e8; }
      .box { fill: #ffffff; stroke: #bcc8d1; stroke-width: 2; rx: 7; }
      .worker { fill: #eef7f6; stroke: #167b78; stroke-width: 2.5; rx: 7; }
      .registry { fill: #fff7e8; stroke: #d38a20; stroke-width: 2.5; rx: 7; }
      .store { fill: #f1f5fb; stroke: #456ca4; stroke-width: 2.5; rx: 7; }
      .safe { fill: #f2f8ef; stroke: #5b8b52; stroke-width: 2.5; rx: 7; }
      .reject { fill: #fff1f1; stroke: #c74b50; stroke-width: 2; rx: 7; }
      .flow { fill: none; stroke: #17324d; stroke-width: 3; marker-end: url(#arrow); }
      .lease { fill: none; stroke: #167b78; stroke-width: 3; marker-end: url(#arrow-teal); }
      .reject-flow { fill: none; stroke: #c74b50; stroke-width: 2.5; marker-end: url(#arrow-red); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#f7f9fb"/>
  <rect x="0" y="0" width="1600" height="112" fill="#ffffff"/>
  <rect x="0" y="108" width="1600" height="4" fill="#167b78"/>
  <text x="70" y="57" class="title">F429 租约隔离的 QF_BV 制品生命周期</text>
  <text x="70" y="87" class="subtitle">活动 job 与 grace 形成可信根；依赖闭包保护对象；不可达制品按 dependent-first 可恢复删除</text>
  <rect x="1270" y="24" width="275" height="62" rx="5" fill="#17324d"/>
  <text x="1408" y="49" text-anchor="middle" class="metric">0 false deletion</text>
  <text x="1408" y="72" text-anchor="middle" class="metric">1,024-node oracle</text>

  <rect x="55" y="142" width="430" height="52" rx="6" fill="#167b78"/>
  <text x="270" y="175" text-anchor="middle" class="lane">A. Worker 与 Job Root</text>
  <rect x="585" y="142" width="430" height="52" rx="6" fill="#d38a20"/>
  <text x="800" y="175" text-anchor="middle" class="lane">B. 统一 Lifecycle Registry</text>
  <rect x="1115" y="142" width="430" height="52" rx="6" fill="#456ca4"/>
  <text x="1330" y="175" text-anchor="middle" class="lane">C. 三类 CAS Store</text>

  <rect x="55" y="222" width="430" height="128" class="worker"/>
  <rect x="78" y="243" width="42" height="28" rx="14" fill="#167b78"/>
  <text x="99" y="262" text-anchor="middle" class="tag">1</text>
  <text x="138" y="263" class="head">Fenced Job Lease</text>
  <text x="78" y="297" class="mono">job_id + owner + generation + deadline</text>
  <text x="78" y="325" class="body">start 原子递增 generation；heartbeat 续租</text>

  <rect x="55" y="383" width="430" height="132" class="worker"/>
  <rect x="78" y="404" width="42" height="28" rx="14" fill="#167b78"/>
  <text x="99" y="423" text-anchor="middle" class="tag">2</text>
  <text x="138" y="424" class="head">共享 Operation Lock</text>
  <text x="78" y="458" class="body">publish / read / touch 持共享 flock</text>
  <text x="78" y="485" class="body">GC 持独占 flock；stable inode + no-follow</text>

  <rect x="55" y="548" width="430" height="120" class="reject"/>
  <text x="78" y="580" class="head">失败关闭边界</text>
  <text x="78" y="612" class="body">旧代、错误 owner、过期 lease → 不能改 root</text>
  <text x="78" y="640" class="small">新 job ID 达 max_jobs 后拒绝；已有 ID 可继续增代</text>

  <rect x="585" y="222" width="430" height="160" class="registry"/>
  <text x="610" y="254" class="head">Root Set</text>
  <rect x="610" y="274" width="180" height="45" rx="5" fill="#ffffff" stroke="#d38a20" stroke-width="2"/>
  <text x="700" y="302" text-anchor="middle" class="body">active job_refs</text>
  <rect x="810" y="274" width="180" height="45" rx="5" fill="#ffffff" stroke="#d38a20" stroke-width="2"/>
  <text x="900" y="302" text-anchor="middle" class="body">recent last_seen</text>
  <text x="610" y="350" class="mono">R = lease roots UNION grace roots</text>

  <rect x="585" y="415" width="430" height="253" class="registry"/>
  <text x="610" y="447" class="head">Dependency Graph</text>
  <rect x="620" y="482" width="104" height="48" rx="5" fill="#eaf1fa" stroke="#456ca4" stroke-width="2"/>
  <text x="672" y="512" text-anchor="middle" class="body">lemma</text>
  <rect x="825" y="470" width="120" height="48" rx="5" fill="#eef7f6" stroke="#167b78" stroke-width="2"/>
  <text x="885" y="500" text-anchor="middle" class="body">context</text>
  <rect x="825" y="553" width="120" height="48" rx="5" fill="#fff2dc" stroke="#d38a20" stroke-width="2"/>
  <text x="885" y="583" text-anchor="middle" class="body">receipt</text>
  <rect x="620" y="585" width="104" height="48" rx="5" fill="#ffffff" stroke="#7f8c97" stroke-width="2"/>
  <text x="672" y="615" text-anchor="middle" class="body">proof</text>
  <path d="M724 500 H825" class="flow"/>
  <path d="M724 517 C770 517 780 577 825 577" class="flow"/>
  <path d="M825 593 C785 593 770 609 724 609" class="flow"/>
  <path d="M945 494 H983 V462 H825" class="flow dash"/>
  <text x="610" y="653" class="small">边方向：dependent → dependency；context child → parent</text>

  <rect x="1115" y="222" width="430" height="112" class="store"/>
  <text x="1140" y="254" class="head">F426 Context CAS</text>
  <text x="1140" y="285" class="body">parent-linked manifests + context SQLite index</text>
  <text x="1140" y="311" class="small">同步时按完整 parent chain 重建边</text>

  <rect x="1115" y="366" width="430" height="125" class="store"/>
  <text x="1140" y="398" class="head">F427 Proof / Receipt CAS</text>
  <text x="1140" y="429" class="body">receipt → proof；result mapping 双向闭合</text>
  <text x="1140" y="456" class="small">path / size / digest / schema 全部重验</text>

  <rect x="1115" y="523" width="430" height="118" class="store"/>
  <text x="1140" y="555" class="head">F428 Lemma CAS</text>
  <text x="1140" y="586" class="body">lemma → source context + proof receipt</text>
  <text x="1140" y="613" class="small">先登记 lifecycle，再公开 CAS，崩溃可回收</text>

  <path d="M485 286 H585" class="lease"/>
  <path d="M485 449 H552 V335 H585" class="lease dash"/>
  <path d="M1115 278 H1045 V494 H1015" class="flow"/>
  <path d="M1115 428 H1045 V565 H1015" class="flow"/>
  <path d="M1115 582 H1015" class="flow"/>
  <path d="M485 608 H545" class="reject-flow"/>

  <rect x="55" y="718" width="1490" height="206" class="safe"/>
  <rect x="78" y="741" width="246" height="38" rx="5" fill="#5b8b52"/>
  <text x="201" y="766" text-anchor="middle" class="lane">Exclusive Mark / Sweep</text>

  <rect x="78" y="806" width="250" height="78" class="box"/>
  <text x="203" y="833" text-anchor="middle" class="head">① Validate</text>
  <text x="203" y="858" text-anchor="middle" class="small">四端点闭合 / inventory complete</text>
  <rect x="376" y="806" width="250" height="78" class="box"/>
  <text x="501" y="833" text-anchor="middle" class="head">② Recursive Mark</text>
  <text x="501" y="858" text-anchor="middle" class="small">roots 沿 dependency 得到 live closure</text>
  <rect x="674" y="806" width="250" height="78" class="box"/>
  <text x="799" y="833" text-anchor="middle" class="head">③ Leaf Selection</text>
  <text x="799" y="858" text-anchor="middle" class="small">不可达 dependent 先于 dependency</text>
  <rect x="972" y="806" width="250" height="78" class="box"/>
  <text x="1097" y="833" text-anchor="middle" class="head">④ Recoverable Delete</text>
  <text x="1097" y="858" text-anchor="middle" class="small">store index → file → lifecycle row</text>
  <rect x="1270" y="806" width="250" height="78" class="box"/>
  <text x="1395" y="833" text-anchor="middle" class="head">⑤ Bounded Stop</text>
  <text x="1395" y="858" text-anchor="middle" class="small">objects / bytes / selection time</text>
  <path d="M328 845 H376" class="flow"/>
  <path d="M626 845 H674" class="flow"/>
  <path d="M924 845 H972" class="flow"/>
  <path d="M1222 845 H1270" class="flow"/>

  <rect x="55" y="955" width="1490" height="64" rx="6" fill="#17324d"/>
  <text x="90" y="982" class="metric">安全结论</text>
  <text x="215" y="982" class="lane">活动 5/5 受保护</text>
  <text x="500" y="982" class="lane">释放后 5/5 删除</text>
  <text x="795" y="982" class="lane">孤儿恢复 1/1</text>
  <text x="1040" y="982" class="lane">旧代拒绝 1/1</text>
  <text x="1280" y="982" class="lane">不声称 solver / coverage 加速</text>
  <text x="90" y="1005" class="footer-small">时间预算约束锁等待和候选选择；已准入的单对象恢复单元允许完成</text>
</svg>
