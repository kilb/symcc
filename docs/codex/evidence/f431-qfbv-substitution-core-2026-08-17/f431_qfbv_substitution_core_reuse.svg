<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">F431 verified variable-substitution UNSAT-core reuse</title>
  <desc id="desc">A source QF_BV query produces an independently checked UNSAT core. A target query passes Bloom prefiltering, exact structural unification, proof replay, substitution inclusion, and QueryStore revalidation before it may reuse UNSAT.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17202a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#157a6e"/>
    </marker>
    <style>
      .bg { fill: #f7f9fb; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .panel-source { fill: #fff8eb; stroke: #e1a94b; stroke-width: 2; filter: url(#shadow); }
      .panel-store { fill: #f1f8f4; stroke: #4b9878; stroke-width: 2; filter: url(#shadow); }
      .panel-target { fill: #f3f6fb; stroke: #5d78aa; stroke-width: 2; filter: url(#shadow); }
      .panel-authority { fill: #fff4f4; stroke: #c66868; stroke-width: 2; filter: url(#shadow); }
      .title { font-family: Inter, Arial, sans-serif; font-size: 38px; font-weight: 700; fill: #17202a; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 19px; fill: #52606d; }
      .section { font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #1f2937; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 19px; font-weight: 650; fill: #243241; }
      .body { font-family: Inter, Arial, sans-serif; font-size: 16px; fill: #475569; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 14px; fill: #596779; }
      .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 15px; fill: #243241; }
      .badge { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-green { fill: none; stroke: #157a6e; stroke-width: 3; marker-end: url(#arrowGreen); }
      .dash { fill: none; stroke: #8b5e34; stroke-width: 2.5; stroke-dasharray: 8 7; }
      .step { fill: #ffffff; stroke: #aeb9c7; stroke-width: 1.5; }
      .step-safe { fill: #ecf8f3; stroke: #48a07d; stroke-width: 1.5; }
      .step-filter { fill: #fff6df; stroke: #dca340; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="960"/>
  <text class="title" x="70" y="68">F431: Verified Variable-Substitution UNSAT-Core Reuse</text>
  <text class="subtitle" x="70" y="102">Fast candidate discovery is untrusted; only proof replay plus exact substituted-core inclusion can authorize UNSAT.</text>

  <rect x="70" y="142" width="420" height="294" rx="8" class="panel-source"/>
  <rect x="92" y="164" width="86" height="28" rx="4" fill="#c47b17"/>
  <text class="badge" x="110" y="183">PRODUCER</text>
  <text class="section" x="92" y="231">Source query</text>
  <text class="mono" x="92" y="264">F(x0, x1, ...)</text>

  <rect x="92" y="287" width="376" height="55" rx="6" class="step"/>
  <circle cx="120" cy="314" r="15" fill="#c47b17"/>
  <text class="badge" x="116" y="319">1</text>
  <text class="label" x="145" y="309">Full UNSAT is verified</text>
  <text class="small" x="145" y="330">cvc5 CPC + independent Ethos</text>

  <rect x="92" y="354" width="376" height="60" rx="6" class="step-safe"/>
  <circle cx="120" cy="384" r="15" fill="#24856b"/>
  <text class="badge" x="116" y="389">2</text>
  <text class="label" x="145" y="379">Named core extraction</text>
  <text class="small" x="145" y="401">Extractor output is re-proved before publication</text>

  <rect x="590" y="142" width="420" height="294" rx="8" class="panel-store"/>
  <rect x="612" y="164" width="112" height="28" rx="4" fill="#24856b"/>
  <text class="badge" x="627" y="183">SHARED CAS</text>
  <text class="section" x="612" y="231">Portable core artifact</text>
  <text class="body" x="612" y="266">Content-addressed, immutable record</text>

  <rect x="612" y="286" width="376" height="128" rx="6" class="step-safe"/>
  <text class="label" x="632" y="315">Bound identities</text>
  <text class="small" x="632" y="341">source Query IR + reachable expression DAG</text>
  <text class="small" x="632" y="365">core roots + structural footprints + Bloom bits</text>
  <text class="small" x="632" y="389">capability/policy hashes + CPC proof receipt</text>

  <path d="M 490 290 C 530 290, 545 290, 590 290" class="arrow-green"/>
  <text class="small" x="508" y="275">publish</text>

  <rect x="1110" y="142" width="420" height="294" rx="8" class="panel-target"/>
  <rect x="1132" y="164" width="99" height="28" rx="4" fill="#506fa8"/>
  <text class="badge" x="1148" y="183">CONSUMER</text>
  <text class="section" x="1132" y="231">Target query</text>
  <text class="mono" x="1132" y="264">G(y0, y1, ...)</text>

  <rect x="1132" y="287" width="376" height="55" rx="6" class="step-filter"/>
  <text class="label" x="1152" y="310">Bloom candidate prefilter</text>
  <text class="small" x="1152" y="331">May reject candidates; never authorizes UNSAT</text>

  <rect x="1132" y="354" width="376" height="60" rx="6" class="step"/>
  <text class="label" x="1152" y="378">Bounded exact structural join</text>
  <text class="small" x="1152" y="400">Consistent source-byte to target-byte mapping</text>

  <path d="M 1110 304 C 1064 304, 1051 304, 1010 304" class="arrow"/>
  <text class="small" x="1028" y="287">digest scan</text>

  <rect x="70" y="498" width="1460" height="318" rx="8" class="panel"/>
  <text class="section" x="98" y="540">Authorization pipeline for one candidate</text>

  <rect x="100" y="577" width="244" height="96" rx="7" class="step-safe"/>
  <circle cx="124" cy="600" r="14" fill="#24856b"/>
  <text class="badge" x="120" y="605">3</text>
  <text class="label" x="148" y="606">Proof replay</text>
  <text class="small" x="120" y="635">First use per process/domain:</text>
  <text class="small" x="120" y="656">reload receipt and rerun Ethos</text>

  <rect x="395" y="577" width="244" height="96" rx="7" class="step"/>
  <circle cx="419" cy="600" r="14" fill="#506fa8"/>
  <text class="badge" x="415" y="605">4</text>
  <text class="label" x="443" y="606">Exact substitution</text>
  <text class="small" x="415" y="635">Recompute every source root</text>
  <text class="mono" x="415" y="657">sigma(core)</text>

  <rect x="690" y="577" width="244" height="96" rx="7" class="step-safe"/>
  <circle cx="714" cy="600" r="14" fill="#24856b"/>
  <text class="badge" x="710" y="605">5</text>
  <text class="label" x="738" y="606">Exact inclusion</text>
  <text class="small" x="710" y="635">Require content-addressed roots:</text>
  <text class="mono" x="710" y="657">sigma(core) subset G</text>

  <rect x="985" y="577" width="244" height="96" rx="7" class="panel-authority"/>
  <circle cx="1009" cy="600" r="14" fill="#b75151"/>
  <text class="badge" x="1005" y="605">6</text>
  <text class="label" x="1033" y="606">QueryStore replay</text>
  <text class="small" x="1005" y="635">Reload target Query IR and repeat</text>
  <text class="small" x="1005" y="656">in an independent cache domain</text>

  <rect x="1280" y="577" width="220" height="96" rx="7" fill="#eaf8f0" stroke="#25825e" stroke-width="3" filter="url(#shadow)"/>
  <text class="label" x="1320" y="607">Authorized</text>
  <text class="label" x="1350" y="632">UNSAT</text>
  <text class="small" x="1300" y="656">No target solver process needed</text>

  <path d="M 344 625 L 395 625" class="arrow-green"/>
  <path d="M 639 625 L 690 625" class="arrow-green"/>
  <path d="M 934 625 L 985 625" class="arrow-green"/>
  <path d="M 1229 625 L 1280 625" class="arrow-green"/>

  <rect x="100" y="710" width="1088" height="75" rx="7" fill="#fff8eb" stroke="#e1a94b" stroke-width="1.5"/>
  <text class="label" x="124" y="739">Soundness theorem</text>
  <text class="body" x="124" y="765">If core is UNSAT and sigma is sort-preserving, sigma(core) is UNSAT; if sigma(core) is contained in G, then G is UNSAT.</text>
  <path d="M 1188 747 C 1234 747, 1250 704, 1300 673" class="dash"/>

  <rect x="70" y="850" width="1460" height="62" rx="7" fill="#273241"/>
  <text class="badge" x="95" y="878">FAIL CLOSED</text>
  <text x="215" y="879" font-family="Inter, Arial, sans-serif" font-size="16" fill="#eef2f7">tamper | timeout | cancellation | budget exhaustion | malformed core | proof drift | mapping mismatch</text>
  <text x="1180" y="879" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#f6c85f">fallback to normal solver</text>
  <text class="small" x="70" y="942">Scope: QF_BV mechanism evidence only. This diagram does not claim application coverage or defect-yield improvement.</text>
</svg>
