<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">F435 adaptive checked-proof admission</title>
  <desc id="desc">A verified proof stream passes through replay, adaptive admission, bounded deferral, native CaDiCaL delivery, acknowledgements, and independent QueryStore verification.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17212b" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#34495e"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#167d58"/></marker>
    <style>
      .title{font:700 34px 'DejaVu Sans',sans-serif;fill:#17212b}.topTitle{font:700 34px 'DejaVu Sans',sans-serif;fill:#fff}.sub{font:400 17px 'DejaVu Sans',sans-serif;fill:#52616f}.topSub{font:400 17px 'DejaVu Sans',sans-serif;fill:#cbd5df}.bottomSub{font:400 13px 'DejaVu Sans Mono',monospace;fill:#cbd5df}.lane{font:700 16px 'DejaVu Sans',sans-serif;fill:#fff}.head{font:700 21px 'DejaVu Sans',sans-serif;fill:#17212b}.body{font:400 15px 'DejaVu Sans',sans-serif;fill:#34495e}.small{font:400 13px 'DejaVu Sans Mono',monospace;fill:#34495e}.metric{font:700 18px 'DejaVu Sans',sans-serif;fill:#21a675}.box{fill:#fff;stroke:#c8d1da;stroke-width:2;rx:8;filter:url(#shadow)}.arrow{fill:none;stroke:#34495e;stroke-width:3;marker-end:url(#arrow)}.feedback{fill:none;stroke:#167d58;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#greenArrow)}
    </style>
  </defs>
  <rect width="1600" height="950" fill="#f4f6f8"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17212b"/>
  <rect x="0" y="112" width="16" height="838" fill="#e85d3f"/>
  <text x="62" y="55" class="topTitle">F435 Adaptive Checked-Proof Admission</text>
  <text x="62" y="86" class="topSub">Proof decides trust. Deterministic feedback decides admission time.</text>

  <rect x="42" y="145" width="145" height="53" rx="4" fill="#445a6f"/><text x="114" y="178" text-anchor="middle" class="lane">PRODUCER</text>
  <rect x="42" y="386" width="145" height="53" rx="4" fill="#b74931"/><text x="114" y="419" text-anchor="middle" class="lane">ADMISSION</text>
  <rect x="42" y="680" width="145" height="53" rx="4" fill="#167d58"/><text x="114" y="713" text-anchor="middle" class="lane">CONSUMER</text>

  <rect class="box" x="230" y="135" width="300" height="150"/>
  <text x="258" y="174" class="head">Durable proof event</text>
  <text x="258" y="207" class="small">formula + event sequence</text>
  <text x="258" y="232" class="small">record SHA + source identity</text>
  <text x="258" y="257" class="body">Immutable CAS publication</text>

  <rect class="box" x="650" y="135" width="330" height="150"/>
  <text x="678" y="174" class="head">Independent LRUP/RUP replay</text>
  <text x="678" y="207" class="body">Rebuild current bit-blast formula</text>
  <text x="678" y="232" class="body">Verify imports, hints and clause</text>
  <rect x="678" y="250" width="178" height="25" rx="4" fill="#dcefe7"/><text x="767" y="268" text-anchor="middle" class="small" fill="#126848">ClauseAuthorization</text>

  <path class="arrow" d="M530 210 H638"/>
  <path class="arrow" d="M815 285 V347"/>

  <rect class="box" x="555" y="350" width="520" height="235"/>
  <rect x="555" y="350" width="520" height="48" rx="8" fill="#fff0eb"/>
  <text x="583" y="382" class="head">Replayable fixed-point controller</text>
  <text x="583" y="428" class="small">+ short clause + propagation density + source yield</text>
  <text x="583" y="454" class="small">+ solve age - checker cost - queue fill - retry cost</text>
  <line x1="583" y1="475" x2="1047" y2="475" stroke="#d9e0e6" stroke-width="2"/>
  <rect x="583" y="500" width="128" height="50" rx="5" fill="#dcefe7"/><text x="647" y="532" text-anchor="middle" class="head" fill="#126848">ADMIT</text>
  <rect x="751" y="500" width="128" height="50" rx="5" fill="#fff1c9"/><text x="815" y="532" text-anchor="middle" class="head" fill="#8b6500">DEFER</text>
  <rect x="919" y="500" width="128" height="50" rx="5" fill="#f9d9d4"/><text x="983" y="532" text-anchor="middle" class="head" fill="#9e3323">REJECT</text>

  <rect class="box" x="230" y="390" width="250" height="185"/>
  <text x="258" y="429" class="head">Sealed observation</text>
  <text x="258" y="462" class="small">native solving / generation</text>
  <text x="258" y="487" class="small">solve age / remaining time</text>
  <text x="258" y="512" class="small">queue / ACK / deferred depth</text>
  <text x="258" y="545" class="body">No floating point or RNG</text>
  <path class="arrow" d="M480 482 H543"/>

  <rect class="box" x="1160" y="390" width="355" height="185"/>
  <text x="1188" y="429" class="head">Bounded deferred queue</text>
  <text x="1188" y="462" class="small">order: retry, event, record SHA</text>
  <text x="1188" y="487" class="small">delay: 2^min(retry, 6) polls</text>
  <text x="1188" y="512" class="body">Capacity, retries and decisions capped</text>
  <text x="1188" y="543" class="body">Budget exhaustion stops scanning</text>
  <path class="arrow" d="M815 550 V615 H1338 V587"/>
  <path class="feedback" d="M1338 390 V325 H1030 V350"/>

  <path class="arrow" d="M647 550 V660"/>
  <rect class="box" x="470" y="665" width="355" height="155"/>
  <text x="498" y="704" class="head">Native CaDiCaL queue</text>
  <text x="498" y="737" class="body">ExternalPropagator consumes literals</text>
  <text x="498" y="762" class="body">ACK only after terminating zero</text>
  <text x="498" y="792" class="small">token + generation + ordinal</text>

  <rect class="box" x="980" y="665" width="455" height="155"/>
  <text x="1008" y="704" class="head">Independent QueryStore verdict</text>
  <text x="1008" y="737" class="body">Replay decision and controller snapshot</text>
  <text x="1008" y="762" class="body">Reload CAS proof; verify exact event/source</text>
  <text x="1008" y="792" class="body">Reject tamper even after attacker reseals SHA</text>
  <path class="arrow" d="M825 742 H968"/>

  <path class="feedback" d="M647 665 V620 H355 V575"/>
  <text x="384" y="642" class="small" fill="#126848">delivered / backpressure / expired feedback</text>

  <rect x="230" y="865" width="1205" height="54" rx="5" fill="#17212b"/>
  <text x="258" y="899" class="metric">6 trials: static 2/8, adaptive 8/8 delivered (+75 pp)</text>
  <text x="1395" y="899" text-anchor="end" class="bottomSub">mechanism result, not solver speedup</text>
</svg>
