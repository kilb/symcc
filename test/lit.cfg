import shutil
from pathlib import Path

import lit.formats.shtest

config.name = "compiler"
config.test_format = lit.formats.shtest.ShTest()
config.suffixes = [".c", ".cpp", ".ll", ".py"]
config.substitutions += [
    ("%symcc", config.test_exec_root + "/../symcc"),
    ("%symxx", config.test_exec_root + "/../sym++"),
    ("%python", "python3"),
]

llvm17_opt = shutil.which("opt-17")
llvm17_diff = shutil.which("llvm-diff-17")
llvm17_plugin = (
    Path(config.test_source_root).resolve().parent
    / "build-llvm17"
    / "libsymcc.so"
)
current_build = Path(config.test_exec_root).resolve().parent
if (
    llvm17_opt
    and llvm17_diff
    and llvm17_plugin.is_file()
    and current_build != llvm17_plugin.parent.resolve()
):
    config.available_features.add("llvm17-cross")
    config.substitutions += [
        ("%opt17", llvm17_opt),
        ("%llvmdiff17", llvm17_diff),
        ("%passlib17", str(llvm17_plugin)),
    ]
